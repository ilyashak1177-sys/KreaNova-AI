<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI - Admin Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #cbd5e1; /* slate-300 */
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- FIREBASE SDK (BACKEND ENGINE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // =========================================================================
        // KONFIGURASI GOOGLE FIREBASE KREANOVA AI
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };
        // =========================================================================

        let app, auth, db, analytics;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            analytics = getAnalytics(app);
            console.log("Admin Firebase Connected!");
        } catch (error) {
            console.error("Firebase Error:", error);
        }

        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        const AdminUserManagement = () => {
            const [users, setUsers] = useState([]);
            const [toast, setToast] = useState(null);
            
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            return (
                <div className="animate-fade-in relative">
                    {toast && (
                        <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in">
                            <i className="fas fa-check-circle mr-2"></i> {toast}
                        </div>
                    )}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-white"><i className="fas fa-users text-blue-500 mr-2"></i>Database Member</h2>
                            <p className="text-xs text-slate-400 mt-1">Sistem menunggu pendaftaran baru dari database.</p>
                        </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-hidden flex flex-col items-center justify-center h-48 text-slate-500">
                        <i className="fas fa-database text-3xl mb-3 opacity-50"></i>
                        <p className="text-sm font-medium">Belum ada data member</p>
                    </div>
                </div>
            );
        };

        const AdminFinanceManagement = () => {
            const [withdrawals, setWithdrawals] = useState([]);
            const [toast, setToast] = useState(null);

            return (
                <div className="animate-fade-in relative">
                    {toast && (
                        <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in">
                            <i className="fas fa-check-circle mr-2"></i> {toast}
                        </div>
                    )}
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-xl font-bold text-white"><i className="fas fa-money-bill-wave text-emerald-500 mr-2"></i>Pencairan Dana (Withdrawal)</h2>
                            <p className="text-xs text-slate-400 mt-1">Eksekusi permintaan penarikan dana dari member ke rekening tujuan.</p>
                        </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-hidden flex flex-col items-center justify-center h-48 text-slate-500">
                        <i className="fas fa-file-invoice-dollar text-3xl mb-3 opacity-50"></i>
                        <p className="text-sm font-medium">Belum ada permintaan penarikan</p>
                    </div>
                </div>
            );
        };

        const AdminAiManager = () => {
            const [products, setProducts] = useState([]);
            const [toast, setToast] = useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const defaultProducts = [
                { id: 'tutorial', title: 'Tutorial Produk AI', icon: 'fa-youtube', color: 'from-red-600 to-red-800', url: '', active: true },
                { id: 1, title: 'Affiliate Produk', icon: 'fa-box-open', color: 'from-blue-500 to-cyan-500', url: '', active: true },
                { id: 2, title: 'Drama Short', icon: 'fa-masks-theater', color: 'from-purple-500 to-pink-500', url: '', active: true },
                { id: 3, title: 'Motivasi Islami', icon: 'fa-moon', color: 'from-emerald-500 to-teal-500', url: '', active: true },
                { id: 4, title: "Qur'an Overlay", icon: 'fa-book-quran', color: 'from-green-500 to-emerald-600', url: '', active: true },
                { id: 5, title: 'Animal Creature', icon: 'fa-paw', color: 'from-orange-500 to-amber-500', url: '', active: true },
                { id: 6, title: 'Animal Human Activity', icon: 'fa-person-walking-with-cane', color: 'from-yellow-500 to-orange-400', url: '', active: true },
                { id: 7, title: 'CineAI', icon: 'fa-clapperboard', color: 'from-rose-500 to-red-600', url: '', active: true },
                { id: 8, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                { id: 9, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                { id: 10, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
            ];

            useEffect(() => {
                const saved = localStorage.getItem('kreanova_ai_products');
                if (saved) {
                    let parsedSaved = JSON.parse(saved);
                    if (parsedSaved.length > 0 && parsedSaved[0].id !== 'tutorial') {
                        parsedSaved.unshift(defaultProducts[0]);
                    }
                    setProducts(parsedSaved);
                } else {
                    setProducts(defaultProducts);
                }
            }, []);

            const handleChange = (index, field, value) => {
                const newProducts = [...products];
                newProducts[index][field] = value;
                if (field === 'title' && value.toLowerCase() !== 'coming soon' && newProducts[index].icon === 'fa-lock') {
                    newProducts[index].icon = 'fa-star';
                    newProducts[index].color = 'from-blue-500 to-purple-500';
                }
                setProducts(newProducts);
            };

            const handleReset = (index) => {
                const newProducts = [...products];
                newProducts[index].title = 'Coming Soon';
                newProducts[index].url = '';
                newProducts[index].active = false;
                newProducts[index].icon = 'fa-lock';
                newProducts[index].color = 'from-slate-700 to-slate-800';
                setProducts(newProducts);
                showToast(`Slot #${newProducts[index].id} berhasil di-reset.`);
            };

            const handleSave = () => {
                localStorage.setItem('kreanova_ai_products', JSON.stringify(products));
                showToast('Konfigurasi Menu AI Video berhasil disimpan!');
            };

            return (
                <div className="animate-fade-in relative">
                    {toast && (
                        <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in">
                            <i className="fas fa-check-circle mr-2"></i> {toast}
                        </div>
                    )}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-white"><i className="fas fa-clapperboard text-blue-500 mr-2"></i>Pengaturan Link Menu AI</h2>
                            <p className="text-xs text-slate-400 mt-1">Tambah, edit, atau hapus link produk AI.</p>
                        </div>
                        <button onClick={handleSave} className="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white px-5 py-3 rounded-xl text-sm font-bold transition-all shadow-lg flex items-center gap-2">
                            <i className="fas fa-save"></i> Simpan Permanen
                        </button>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-hidden">
                        <div className="p-5 grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {products.map((prod, idx) => (
                                <div key={prod.id} className={`p-4 rounded-xl border flex flex-col transition-colors ${prod.active ? 'bg-slate-950 border-slate-700' : 'bg-slate-900/50 border-slate-800/50'}`}>
                                    <div className="flex justify-between items-center mb-3">
                                        <span className={`text-xs font-bold uppercase tracking-wider flex items-center gap-2 ${prod.active ? 'text-blue-400' : 'text-slate-500'}`}>
                                            <i className={`${prod.icon === 'fa-youtube' ? 'fab' : 'fas'} ${prod.icon} ${prod.id === 'tutorial' ? 'text-red-500' : ''}`}></i> Slot {prod.id === 'tutorial' ? 'Panduan' : `Menu #${prod.id}`}
                                        </span>
                                        <div className="flex items-center gap-3">
                                            {prod.id !== 'tutorial' && <button onClick={() => handleReset(idx)} className="text-[10px] text-red-400 font-bold uppercase">Hapus</button>}
                                            <label className="flex items-center gap-2 cursor-pointer bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                                                <span className={`text-[10px] font-bold uppercase ${prod.active ? 'text-green-400' : 'text-slate-500'}`}>{prod.active ? 'AKTIF' : 'NONAKTIF'}</span>
                                                <input type="checkbox" checked={prod.active} onChange={(e) => handleChange(idx, 'active', e.target.checked)} className="w-4 h-4 accent-blue-500 cursor-pointer" />
                                            </label>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1 ml-1 uppercase">Nama Produk / Menu</label>
                                            <input type="text" value={prod.title} onChange={(e) => handleChange(idx, 'title', e.target.value)} placeholder="Contoh: CineAI" className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1 ml-1 uppercase">URL Web App (Link Tujuan)</label>
                                            <input type="url" value={prod.url} onChange={(e) => handleChange(idx, 'url', e.target.value)} placeholder="https://..." className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-500" />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardCards = () => (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg"><p className="text-slate-400 text-xs mb-1 uppercase">Total Member</p><h3 className="text-2xl font-bold text-white">0</h3></div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg"><p className="text-slate-400 text-xs mb-1 uppercase">Total Revenue</p><h3 className="text-2xl font-bold text-white">Rp 0</h3></div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg"><p className="text-slate-400 text-xs mb-1 uppercase">Bonus Terbayar</p><h3 className="text-2xl font-bold text-white">Rp 0</h3></div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg"><p className="text-slate-400 text-xs mb-1 uppercase">Pending WD</p><h3 className="text-2xl font-bold text-white">Rp 0</h3></div>
            </div>
        );

        const AdminApp = () => {
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);

            return (
                <div className="h-screen w-full bg-slate-950 flex flex-col relative overflow-hidden font-sans">
                    {showLogoutConfirm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center animate-fade-in">
                            <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full mx-4">
                                <h3 className="text-lg font-bold text-white mb-2">Keluar?</h3>
                                <div className="flex gap-3 mt-4">
                                    <button onClick={() => setShowLogoutConfirm(false)} className="flex-1 px-4 py-2 bg-slate-800 text-white rounded-xl text-sm font-bold">Batal</button>
                                    <button onClick={() => window.location.reload()} className="flex-1 px-4 py-2 bg-red-600 text-white rounded-xl text-sm font-bold">Ya, Keluar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="h-16 bg-red-950/40 border-b border-red-900/50 flex items-center justify-between px-4 lg:px-6 shrink-0 z-20 backdrop-blur-md">
                        <div className="flex items-center gap-3 text-white">
                            <i className="fas fa-shield-alt text-red-500"></i>
                            <h1 className="font-bold text-sm tracking-widest uppercase">Admin Command Center</h1>
                        </div>
                        <button onClick={() => setShowLogoutConfirm(true)} className="bg-slate-900 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold"><i className="fas fa-sign-out-alt"></i></button>
                    </header>
                    
                    <div className="flex-1 flex overflow-hidden">
                        <aside className="hidden lg:flex w-64 bg-slate-900 border-r border-slate-800 flex-col overflow-y-auto shadow-2xl z-10 p-4 space-y-1">
                            <button onClick={() => setActiveMenu('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl text-sm ${activeMenu === 'dashboard' ? 'bg-blue-600/10 text-blue-400' : 'text-slate-400'}`}><i className="fas fa-chart-line mr-2"></i> Dashboard</button>
                            <button onClick={() => setActiveMenu('users')} className={`w-full text-left px-4 py-3 rounded-xl text-sm ${activeMenu === 'users' ? 'bg-blue-600/10 text-blue-400' : 'text-slate-400'}`}><i className="fas fa-users mr-2"></i> Member</button>
                            <button onClick={() => setActiveMenu('finance')} className={`w-full text-left px-4 py-3 rounded-xl text-sm ${activeMenu === 'finance' ? 'bg-blue-600/10 text-blue-400' : 'text-slate-400'}`}><i className="fas fa-wallet mr-2"></i> Finance</button>
                            <button onClick={() => setActiveMenu('ai_config')} className={`w-full text-left px-4 py-3 rounded-xl text-sm ${activeMenu === 'ai_config' ? 'bg-blue-600/10 text-blue-400' : 'text-slate-400'}`}><i className="fas fa-cogs mr-2"></i> Menu AI</button>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 pb-24 lg:p-8 bg-slate-950 custom-scrollbar relative">
                            {activeMenu === 'dashboard' && <div className="animate-fade-in"><DashboardCards /></div>}
                            {activeMenu === 'users' && <AdminUserManagement />}
                            {activeMenu === 'finance' && <AdminFinanceManagement />}
                            {activeMenu === 'ai_config' && <AdminAiManager />}
                        </main>
                    </div>

                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 pb-safe z-40">
                        <div className="flex justify-around items-center h-16 px-1">
                            <button onClick={() => setActiveMenu('dashboard')} className={`flex flex-col items-center gap-1 ${activeMenu === 'dashboard' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-chart-line"></i><span className="text-[9px]">Dashboard</span></button>
                            <button onClick={() => setActiveMenu('users')} className={`flex flex-col items-center gap-1 ${activeMenu === 'users' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-users"></i><span className="text-[9px]">Member</span></button>
                            <button onClick={() => setActiveMenu('finance')} className={`flex flex-col items-center gap-1 ${activeMenu === 'finance' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-wallet"></i><span className="text-[9px]">Finance</span></button>
                            <button onClick={() => setActiveMenu('ai_config')} className={`flex flex-col items-center gap-1 ${activeMenu === 'ai_config' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-cogs"></i><span className="text-[9px]">Menu AI</span></button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
