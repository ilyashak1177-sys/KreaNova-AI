<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; margin: 0; padding: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
        } catch (error) { console.error("Firebase Error:", error); }
        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AdminUserManagement = () => {
            const [users, setUsers] = useState([]);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetchUsers();
            }, []);

            const fetchUsers = async () => {
                if(!window.KreaNovaBackend) return;
                try {
                    const { db, collection, getDocs } = window.KreaNovaBackend;
                    const querySnapshot = await getDocs(collection(db, "users"));
                    const userList = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsers(userList);
                } catch (error) {
                    console.error("Error fetching users:", error);
                }
                setLoading(false);
            };

            const handleApprove = async (userId, docId) => {
                try {
                    const { db, doc, updateDoc } = window.KreaNovaBackend;
                    await updateDoc(doc(db, "users", docId), { status: "ACTIVE" });
                    setToast(`Akun ${userId} berhasil diaktifkan!`);
                    setTimeout(() => setToast(null), 3000);
                    fetchUsers(); // Refresh data
                } catch (error) {
                    alert("Gagal mengaktifkan: " + error.message);
                }
            };

            return (
                <div className="animate-fade-in relative">
                    {toast && <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in"><i className="fas fa-check-circle mr-2"></i> {toast}</div>}
                    <div className="mb-6">
                        <h2 className="text-xl font-bold text-white"><i className="fas fa-users text-blue-500 mr-2"></i>Database Member</h2>
                        <p className="text-xs text-slate-400 mt-1">Mengambil data Real-Time dari Firebase Firestore.</p>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-x-auto custom-scrollbar">
                        <table className="w-full text-left text-sm text-slate-300">
                            <thead className="bg-slate-950 border-b border-slate-800 text-xs uppercase text-slate-500 font-bold">
                                <tr><th className="px-5 py-4">Status / Aksi</th><th className="px-5 py-4">Data Member</th><th className="px-5 py-4">Sponsor</th><th className="px-5 py-4">Kontak</th></tr>
                            </thead>
                            <tbody>
                                {loading ? (<tr><td colSpan="4" className="text-center py-10"><i className="fas fa-spinner fa-spin text-blue-500 text-2xl"></i></td></tr>) : users.length === 0 ? (<tr><td colSpan="4" className="text-center py-10 text-slate-500">Belum ada member terdaftar.</td></tr>) : users.map((u) => (
                                    <tr key={u.id} className="border-b border-slate-800/50 hover:bg-slate-800/20">
                                        <td className="px-5 py-4">
                                            {u.status === 'PENDING' ? (
                                                <button onClick={() => handleApprove(u.userId, u.id)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg">Terima & Aktifkan</button>
                                            ) : (
                                                <span className="bg-green-500/20 text-green-400 px-3 py-1 rounded-lg text-[10px] font-bold tracking-wider">AKTIF</span>
                                            )}
                                        </td>
                                        <td className="px-5 py-4"><div className="font-bold text-white">{u.name}</div><div className="text-[10px] text-blue-400 font-mono mt-1">{u.userId} | Ref: {u.referralCode}</div></td>
                                        <td className="px-5 py-4"><div className="text-xs bg-slate-950 border border-slate-700 px-2 py-1 rounded inline-block font-mono text-emerald-400">{u.sponsor}</div></td>
                                        <td className="px-5 py-4"><div className="text-xs"><i className="fab fa-whatsapp text-emerald-500 w-4"></i> {u.phone}</div><div className="text-[10px] text-slate-500 mt-1">{u.email}</div></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const DashboardCards = () => (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg"><p className="text-slate-400 text-xs mb-1 uppercase">Total Member</p><h3 className="text-2xl font-bold text-white">0</h3></div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg"><p className="text-slate-400 text-xs mb-1 uppercase">Total Revenue</p><h3 className="text-2xl font-bold text-white">Rp 0</h3></div>
            </div>
        );

        const AdminApp = () => {
            const [activeMenu, setActiveMenu] = useState('dashboard');
            return (
                <div className="h-screen w-full bg-slate-950 flex flex-col relative overflow-hidden font-sans">
                    <header className="h-16 bg-red-950/40 border-b border-red-900/50 flex items-center justify-between px-4 lg:px-6 shrink-0 z-20 backdrop-blur-md">
                        <div className="flex items-center gap-3 text-white"><i className="fas fa-shield-alt text-red-500"></i><h1 className="font-bold text-sm tracking-widest uppercase">Admin Command Center</h1></div>
                    </header>
                    <div className="flex-1 flex overflow-hidden">
                        <aside className="hidden lg:flex w-64 bg-slate-900 border-r border-slate-800 flex-col overflow-y-auto shadow-2xl z-10 p-4 space-y-1">
                            <button onClick={() => setActiveMenu('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl text-sm ${activeMenu === 'dashboard' ? 'bg-blue-600/10 text-blue-400' : 'text-slate-400'}`}><i className="fas fa-chart-line mr-2"></i> Dashboard</button>
                            <button onClick={() => setActiveMenu('users')} className={`w-full text-left px-4 py-3 rounded-xl text-sm ${activeMenu === 'users' ? 'bg-blue-600/10 text-blue-400' : 'text-slate-400'}`}><i className="fas fa-users mr-2"></i> Member</button>
                        </aside>
                        <main className="flex-1 overflow-y-auto p-4 pb-24 lg:p-8 bg-slate-950 custom-scrollbar relative">
                            {activeMenu === 'dashboard' && <DashboardCards />}
                            {activeMenu === 'users' && <AdminUserManagement />}
                        </main>
                    </div>
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 pb-safe z-40">
                        <div className="flex justify-around items-center h-16 px-1">
                            <button onClick={() => setActiveMenu('dashboard')} className={`flex flex-col items-center gap-1 ${activeMenu === 'dashboard' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-chart-line"></i><span className="text-[9px]">Dashboard</span></button>
                            <button onClick={() => setActiveMenu('users')} className={`flex flex-col items-center gap-1 ${activeMenu === 'users' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-users"></i><span className="text-[9px]">Member</span></button>
                        </div>
                    </nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
