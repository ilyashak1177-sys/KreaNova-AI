<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KreaNova AI - Admin Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #cbd5e1; /* slate-300 */
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- FIREBASE SDK (BACKEND ENGINE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // TUGAS ANDA SELANJUTNYA: ISI KONFIGURASI INI DARI GOOGLE FIREBASE
        // =========================================================================
        const firebaseConfig = {
            apiKey: "KOSONG",
            authDomain: "KOSONG",
            projectId: "KOSONG",
            storageBucket: "KOSONG",
            messagingSenderId: "KOSONG",
            appId: "KOSONG"
        };
        // =========================================================================

        let app, auth, db;
        if(firebaseConfig.apiKey !== "KOSONG") {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        const AdminUserManagement = () => {
            // DATABASE DIKOSONGKAN SIAP UNTUK REAL DATA
            const [users, setUsers] = useState([]);
            const [toast, setToast] = useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const toggleStatus = (index) => {
                const newUsers = [...users];
                const currentStatus = newUsers[index].status;
                newUsers[index].status = currentStatus === 'ACTIVE' ? 'SUSPENDED' : 'ACTIVE';
                setUsers(newUsers);
                showToast(`Status user ${newUsers[index].id} berhasil diubah.`);
            };

            const deleteUser = (index) => {
                const newUsers = [...users];
                const deleted = newUsers.splice(index, 1);
                setUsers(newUsers);
                showToast(`User ${deleted[0].id} berhasil dihapus dari sistem.`);
            };

            const activateUser = (index) => {
                const newUsers = [...users];
                newUsers[index].status = 'ACTIVE';
                const sponsorName = newUsers[index].sponsor;
                setUsers(newUsers);
                // Notifikasi visual simulasi sistem otomatis
                showToast(`✅ Akun diaktifkan! Bonus Sponsor Rp 40.000 otomatis masuk ke dompet ${sponsorName}.`);
            };

            return (
                <div className="animate-fade-in relative">
                    {toast && (
                        <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in">
                            <i className="fas fa-check-circle mr-2"></i> {toast}
                        </div>
                    )}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-white"><i className="fas fa-users text-blue-500 mr-2"></i>Database Member</h2>
                            <p className="text-xs text-slate-400 mt-1">Kelola data seluruh member KreaNova AI.</p>
                        </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider">
                                    <tr>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">ID / Waktu</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Member</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Kontak</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Data Rekening Bank</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Status & Tagihan</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800 text-right">Aksi Admin</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {users.map((user, idx) => (
                                        <tr key={user.id} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="px-6 py-4">
                                                <p className="text-white font-bold font-mono">{user.id}</p>
                                                <p className="text-slate-400 text-[10px]">{user.join}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="text-white font-medium">{user.name}</p>
                                                <p className="text-blue-400 text-[10px]">Sponsor: {user.sponsor}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="text-slate-300 text-xs"><i className="fab fa-whatsapp text-emerald-500 mr-1"></i> {user.wa}</p>
                                                <p className="text-slate-400 text-[10px]">{user.email}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="text-white font-bold text-xs uppercase">{user.bank}</p>
                                                <p className="text-slate-400 text-[10px]">A.N. {user.bankOwner}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                {user.status === 'PENDING_PAYMENT' ? (
                                                    <div className="bg-orange-500/10 border border-orange-500/30 p-2 rounded-lg text-center">
                                                        <span className="block text-[10px] font-bold text-orange-400 uppercase mb-1"><i className="fas fa-clock mr-1"></i> Menunggu Transfer</span>
                                                        <span className="block text-sm font-black text-white">{formatIDR(user.nominal)}</span>
                                                    </div>
                                                ) : (
                                                    <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase inline-block ${
                                                        user.status === 'ACTIVE' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 
                                                        'bg-red-500/10 text-red-400 border border-red-500/20'
                                                    }`}>
                                                        {user.status}
                                                    </span>
                                                )}
                                            </td>
                                            <td className="px-6 py-4 text-right">
                                                {user.status === 'PENDING_PAYMENT' ? (
                                                    <button onClick={() => activateUser(idx)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition-all shadow-lg shadow-emerald-600/20 flex items-center gap-1 ml-auto">
                                                        <i className="fas fa-check-circle"></i> Terima & Aktifkan
                                                    </button>
                                                ) : (
                                                    <div className="space-x-2">
                                                        <button onClick={() => showToast('Membuka modal edit data...')} className="p-2 bg-slate-800 hover:bg-slate-700 text-blue-400 rounded-lg transition-colors" title="Edit Data"><i className="fas fa-edit"></i></button>
                                                        <button onClick={() => toggleStatus(idx)} className="p-2 bg-slate-800 hover:bg-slate-700 text-orange-400 rounded-lg transition-colors" title="Kunci/Buka Akses">
                                                            <i className={`fas ${user.status === 'ACTIVE' ? 'fa-lock' : 'fa-unlock'}`}></i>
                                                        </button>
                                                        <button onClick={() => deleteUser(idx)} className="p-2 bg-slate-800 hover:bg-red-900/50 text-red-400 rounded-lg transition-colors" title="Hapus Akun"><i className="fas fa-trash"></i></button>
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminFinanceManagement = () => {
            // DATABASE DIKOSONGKAN SIAP UNTUK REAL DATA
            const [withdrawals, setWithdrawals] = useState([]);
            const [toast, setToast] = useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const processWD = (index, action) => {
                const newWD = [...withdrawals];
                newWD[index].status = action === 'APPROVE' ? 'APPROVED' : 'REJECTED';
                setWithdrawals(newWD);
                showToast(`Pencairan ${newWD[index].id} berhasil di-${action.toLowerCase()}.`);
            };

            return (
                <div className="animate-fade-in relative">
                    {toast && (
                        <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in">
                            <i className="fas fa-check-circle mr-2"></i> {toast}
                        </div>
                    )}
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-xl font-bold text-white"><i className="fas fa-money-bill-wave text-emerald-500 mr-2"></i>Pencairan Dana (Withdrawal)</h2>
                            <p className="text-xs text-slate-400 mt-1">Eksekusi permintaan penarikan dana dari member ke rekening tujuan.</p>
                        </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider">
                                    <tr>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">ID Penarikan</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Member</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Tujuan Transfer</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Nominal</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800">Status</th>
                                        <th className="px-6 py-4 font-medium border-b border-slate-800 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {withdrawals.map((wd, idx) => (
                                        <tr key={wd.id} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="px-6 py-4">
                                                <p className="text-white font-mono text-xs">{wd.id}</p>
                                                <p className="text-slate-400 text-[10px]">{wd.date}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="text-white font-medium">{wd.user}</p>
                                                <p className="text-blue-400 text-[10px] font-mono">{wd.userId}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="text-white font-bold text-xs">{wd.bank} - {wd.accNum}</p>
                                                <p className="text-slate-400 text-[10px]">A.N. {wd.accName}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="text-emerald-400 font-bold">{formatIDR(wd.amount)}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase inline-block ${
                                                    wd.status === 'APPROVED' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 
                                                    wd.status === 'REJECTED' ? 'bg-red-500/10 text-red-400 border border-red-500/20' :
                                                    'bg-orange-500/10 text-orange-400 border border-orange-500/20'
                                                }`}>
                                                    {wd.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 text-right">
                                                {wd.status === 'PENDING' ? (
                                                    <div className="flex justify-end gap-2">
                                                        <button onClick={() => processWD(idx, 'REJECT')} className="px-3 py-1.5 bg-red-900/50 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-xs font-bold transition-colors">
                                                            Tolak
                                                        </button>
                                                        <button onClick={() => processWD(idx, 'APPROVE')} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition-colors shadow-lg shadow-emerald-600/20 flex items-center gap-1">
                                                            <i className="fas fa-check"></i> Transfer
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <span className="text-xs text-slate-500"><i className="fas fa-lock"></i> Selesai</span>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminAiManager = () => {
            const [products, setProducts] = useState([]);
            const [toast, setToast] = useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const defaultProducts = [
                { id: 'tutorial', title: 'Tutorial Produk AI', icon: 'fa-youtube', color: 'from-red-600 to-red-800', url: '', active: true },
                { id: 1, title: 'Affiliate Produk', icon: 'fa-box-open', color: 'from-blue-500 to-cyan-500', url: '', active: true },
                { id: 2, title: 'Drama Short', icon: 'fa-masks-theater', color: 'from-purple-500 to-pink-500', url: '', active: true },
                { id: 3, title: 'Motivasi Islami', icon: 'fa-moon', color: 'from-emerald-500 to-teal-500', url: '', active: true },
                { id: 4, title: "Qur'an Overlay", icon: 'fa-book-quran', color: 'from-green-500 to-emerald-600', url: '', active: true },
                { id: 5, title: 'Animal Creature', icon: 'fa-paw', color: 'from-orange-500 to-amber-500', url: '', active: true },
                { id: 6, title: 'Animal Human Activity', icon: 'fa-person-walking-with-cane', color: 'from-yellow-500 to-orange-400', url: '', active: true },
                { id: 7, title: 'CineAI', icon: 'fa-clapperboard', color: 'from-rose-500 to-red-600', url: '', active: true },
                { id: 8, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                { id: 9, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                { id: 10, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
            ];

            // Muat data menu saat komponen admin dibuka
            useEffect(() => {
                const saved = localStorage.getItem('kreanova_ai_products');
                if (saved) {
                    let parsedSaved = JSON.parse(saved);
                    // Update versi: Jika member lama tidak punya slot tutorial, tambahkan di posisi pertama
                    if (parsedSaved.length > 0 && parsedSaved[0].id !== 'tutorial') {
                        parsedSaved.unshift(defaultProducts[0]);
                    }
                    setProducts(parsedSaved);
                } else {
                    setProducts(defaultProducts);
                }
            }, []);

            const handleChange = (index, field, value) => {
                const newProducts = [...products];
                newProducts[index][field] = value;
                
                // Efek visual otomatis: Jika admin merubah nama "Coming Soon" jadi produk baru, gemboknya terbuka
                if (field === 'title' && value.toLowerCase() !== 'coming soon' && newProducts[index].icon === 'fa-lock') {
                    newProducts[index].icon = 'fa-star';
                    newProducts[index].color = 'from-blue-500 to-purple-500';
                }
                
                setProducts(newProducts);
            };

            const handleReset = (index) => {
                const newProducts = [...products];
                newProducts[index].title = 'Coming Soon';
                newProducts[index].url = '';
                newProducts[index].active = false;
                newProducts[index].icon = 'fa-lock';
                newProducts[index].color = 'from-slate-700 to-slate-800';
                setProducts(newProducts);
                showToast(`Slot #${newProducts[index].id} berhasil di-reset (Dihapus).`);
            };

            const handleSave = () => {
                // Simpan ke "Database" (LocalStorage)
                localStorage.setItem('kreanova_ai_products', JSON.stringify(products));
                showToast('Konfigurasi Menu AI Video berhasil disimpan! Member akan langsung melihat perubahannya.');
            };

            return (
                <div className="animate-fade-in relative">
                    {toast && (
                        <div className="absolute top-0 right-0 bg-emerald-500/90 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg z-50 animate-fade-in">
                            <i className="fas fa-check-circle mr-2"></i> {toast}
                        </div>
                    )}
                    {/* Header Modul */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-white"><i className="fas fa-clapperboard text-blue-500 mr-2"></i>Pengaturan Link Menu AI</h2>
                            <p className="text-xs text-slate-400 mt-1">Tambah, edit, atau hapus link produk AI yang akan tampil di aplikasi member.</p>
                        </div>
                        <button onClick={handleSave} className="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white px-5 py-3 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(37,99,235,0.3)] flex items-center gap-2">
                            <i className="fas fa-save"></i> Simpan Permanen
                        </button>
                    </div>

                    {/* Grid Form Input */}
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-lg overflow-hidden">
                        <div className="p-5 grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {products.map((prod, idx) => (
                                <div key={prod.id} className={`p-4 rounded-xl border flex flex-col transition-colors ${prod.active ? 'bg-slate-950 border-slate-700' : 'bg-slate-900/50 border-slate-800/50'}`}>
                                    <div className="flex justify-between items-center mb-3">
                                        <span className={`text-xs font-bold uppercase tracking-wider flex items-center gap-2 ${prod.active ? 'text-blue-400' : 'text-slate-500'}`}>
                                            <i className={`${prod.icon === 'fa-youtube' ? 'fab' : 'fas'} ${prod.icon}`}></i> Slot {prod.id === 'tutorial' ? 'Panduan' : `Menu #${prod.id}`}
                                        </span>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => handleReset(idx)} className="text-[10px] text-red-400 hover:text-red-300 font-bold uppercase tracking-wider" title="Hapus dan Reset Slot Ini"><i className="fas fa-trash-alt mr-1"></i> Hapus</button>
                                            <label className="flex items-center gap-2 cursor-pointer bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                                                <span className={`text-[10px] font-bold uppercase tracking-widest ${prod.active ? 'text-green-400' : 'text-slate-500'}`}>{prod.active ? 'AKTIF' : 'NONAKTIF'}</span>
                                                <input 
                                                    type="checkbox" 
                                                    checked={prod.active}
                                                    onChange={(e) => handleChange(idx, 'active', e.target.checked)}
                                                    className="w-4 h-4 accent-blue-500 cursor-pointer"
                                                />
                                            </label>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1 ml-1 uppercase tracking-widest">Nama Produk / Menu</label>
                                            <div className="relative">
                                                <i className="fas fa-tag absolute left-3 top-2.5 text-xs text-slate-500"></i>
                                                <input 
                                                    type="text" 
                                                    value={prod.title}
                                                    onChange={(e) => handleChange(idx, 'title', e.target.value)}
                                                    placeholder="Contoh: CineAI"
                                                    className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-8 pr-3 py-2.5 focus:outline-none focus:border-blue-500 transition-colors"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1 ml-1 uppercase tracking-widest">URL Web App (Link Tujuan)</label>
                                            <div className="relative">
                                                <i className="fas fa-link absolute left-3 top-2.5 text-xs text-slate-500"></i>
                                                <input 
                                                    type="url" 
                                                    value={prod.url}
                                                    onChange={(e) => handleChange(idx, 'url', e.target.value)}
                                                    placeholder="Contoh: https://link-produk.com"
                                                    className="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-8 pr-3 py-2.5 focus:outline-none focus:border-blue-500 transition-colors"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardCards = () => {
            // STATISTIK DIKOSONGKAN SIAP UNTUK REAL DATA
            const STATS = {
                totalUsers: 0,
                activeUsers: 0,
                revenue: 0,
                totalBonusPaid: 0,
                pendingWithdrawals: 0
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                        <div className="flex justify-between items-start mb-4">
                            <div className="p-3 bg-blue-500/10 rounded-xl"><i className="fas fa-users text-blue-500 text-xl"></i></div>
                            <span className="flex items-center text-[10px] text-green-400 bg-green-400/10 px-2 py-1 rounded-md"><i className="fas fa-arrow-up mr-1"></i> +124 User Hari Ini</span>
                        </div>
                        <p className="text-slate-400 text-xs mb-1 font-medium uppercase tracking-wider">Total Member</p>
                        <h3 className="text-2xl font-bold text-white">{STATS.totalUsers.toLocaleString()}</h3>
                    </div>
                    
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                        <div className="flex justify-between items-start mb-4">
                            <div className="p-3 bg-emerald-500/10 rounded-xl"><i className="fas fa-wallet text-emerald-500 text-xl"></i></div>
                            <span className="flex items-center text-[10px] text-green-400 bg-green-400/10 px-2 py-1 rounded-md"><i className="fas fa-arrow-up mr-1"></i> + Rp 14.500.000 Hari Ini</span>
                        </div>
                        <p className="text-slate-400 text-xs mb-1 font-medium uppercase tracking-wider">Total Revenue</p>
                        <h3 className="text-2xl font-bold text-white">{formatIDR(STATS.revenue)}</h3>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                        <div className="flex justify-between items-start mb-4">

                        </div>

            const handleLogout = () => {

                                                    </tr>

                            {activeMenu !== 'dashboard' && activeMenu !== 'ai_config' && activeMenu !== 'users' && activeMenu !== 'finance' && (

                            <button onClick={() => setActiveMenu('dashboard')} className="flex flex-col items-center justify-center w-full h-full gap-1">
                                <i className={`fas fa-chart-line text-lg transition-colors ${activeMenu === 'dashboard' ? 'text-blue-500' : 'text-slate-500'}`}></i>
                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'dashboard' ? 'text-blue-400' : 'text-slate-500'}`}>Dashboard</span>

                                <i className={`fas fa-users text-lg transition-colors ${activeMenu === 'users' ? 'text-blue-500' : 'text-slate-500'}`}></i>
                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'users' ? 'text-blue-400' : 'text-slate-500'}`}>Member</span>

                            <button onClick={() => setActiveMenu('finance')} className="flex flex-col items-center justify-center w-full h-full gap-1 relative">

                            <button onClick={() => setActiveMenu('ai_config')} className="flex flex-col items-center justify-center w-full h-full gap-1">

                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'ai_config' ? 'text-blue-400' : 'text-slate-500'}`}>Menu AI</span>
                            </button>

                    </nav>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
