<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #cbd5e1; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-text { text-shadow: 0 0 12px rgba(59, 130, 246, 0.5); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.KreaNovaBackend = { db, collection, query, where, onSnapshot, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc, serverTimestamp };
        } catch (error) {
            console.error("Firebase Admin Error:", error);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);

        // --- KOMPONEN TOAST (NOTIFIKASI) ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgClass = type === 'error' ? 'bg-red-500' : type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600';

            return (
                <div className={`fixed top-5 right-5 z-50 ${bgClass} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 animate-slide-up max-w-[90vw]`}>
                    <i className={`fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i>
                    <span className="text-xs font-bold leading-tight">{message}</span>
                    <button onClick={onClose} className="ml-3 text-white/80 hover:text-white"><i className="fas fa-times"></i></button>
                </div>
            );
        };

        // --- 1. DASHBOARD OVERVIEW ---
        const DashboardOverview = () => {
            const [stats, setStats] = useState({ totalMembers: 0, activeMembers: 0, revenue: 0, pendingWD: 0 });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!window.KreaNovaBackend) return;
                const { db, collection, onSnapshot, query, where, doc, deleteDoc } = window.KreaNovaBackend;

                const unsubUsers = onSnapshot(collection(db, "users"), (snapshot) => {
                    let total = snapshot.size;
                    let active = 0;
                    let rev = 0;
                    const now = new Date().getTime();

                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        
                        // Fitur Auto-Delete 24 Jam untuk yang Pending
                        if (data.status === 'PENDING' && data.createdAt) {
                            const createdTime = new Date(data.createdAt).getTime();
                            if (now - createdTime > 86400000) { // 24 jam = 86400000 ms
                                deleteDoc(doc(db, "users", docSnap.id)).catch(e => console.error("Auto-delete error:", e));
                                total -= 1;
                                return;
                            }
                        }

                        if (data.status === 'ACTIVE') {
                            active += 1;
                            rev += (data.billAmount || 150000);
                        }
                    });

                    setStats(prev => ({ ...prev, totalMembers: total, activeMembers: active, revenue: rev }));
                    setLoading(false);
                }, (err) => { console.error(err); setLoading(false); });

                const qWD = query(collection(db, "withdrawals"), where("status", "==", "PENDING"));
                const unsubWD = onSnapshot(qWD, (snapshot) => {
                    setStats(prev => ({ ...prev, pendingWD: snapshot.size }));
                });

                return () => { unsubUsers(); unsubWD(); };
            }, []);

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-white tracking-wide">Pusat Komando</h2>
                            <p className="text-slate-400 text-xs mt-1">Gambaran umum performa sistem KreaNova AI secara real-time.</p>
                        </div>
                        <div className="bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-xl flex items-center justify-center space-x-2 text-xs text-emerald-400 shadow-sm">
                            <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                            <span className="font-semibold">Sistem Berjalan Normal</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-blue-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Member</p>
                                    <h3 className="text-2xl font-black text-white mt-2">{loading ? '...' : stats.totalMembers}</h3>
                                </div>
                                <div className="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400 border border-blue-500/20">
                                    <i className="fas fa-users text-lg"></i>
                                </div>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-3"><i className="fas fa-database text-blue-400 mr-1"></i> Terdaftar di Firestore</p>
                        </div>

                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-emerald-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Member Aktif</p>
                                    <h3 className="text-2xl font-black text-white mt-2">{loading ? '...' : stats.activeMembers}</h3>
                                </div>
                                <div className="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center text-emerald-400 border border-emerald-500/20">
                                    <i className="fas fa-user-check text-lg"></i>
                                </div>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-3"><i className="fas fa-check-circle text-emerald-400 mr-1"></i> Akun Sudah Diverifikasi</p>
                        </div>

                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-yellow-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Revenue Pendaftaran</p>
                                    <h3 className="text-xl font-black text-white mt-2">{loading ? '...' : formatIDR(stats.revenue)}</h3>
                                </div>
                                <div className="w-10 h-10 bg-yellow-500/10 rounded-xl flex items-center justify-center text-yellow-400 border border-yellow-500/20">
                                    <i className="fas fa-coins text-lg"></i>
                                </div>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-3"><i className="fas fa-chart-line text-yellow-400 mr-1"></i> Total Masuk Aktivasi</p>
                        </div>

                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-purple-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Antrean WD</p>
                                    <h3 className="text-2xl font-black text-white mt-2">{loading ? '...' : stats.pendingWD}</h3>
                                </div>
                                <div className="w-10 h-10 bg-purple-500/10 rounded-xl flex items-center justify-center text-purple-400 border border-purple-500/20">
                                    <i className="fas fa-wallet text-lg"></i>
                                </div>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-3"><i className="fas fa-clock text-purple-400 mr-1"></i> Permintaan Penarikan</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 2. JARINGAN ADMIN ---
        const AdminNetworkTree = () => {
            const [rootRef, setRootRef] = useState('KREANOVA');
            const [searchRef, setSearchRef] = useState('');
            const [treeData, setTreeData] = useState({ root: null, left: null, right: null });
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(false);

            const fetchNode = useCallback(async (refCode) => {
                if (!window.KreaNovaBackend) return;
                setLoading(true);
                try {
                    const { db, collection, query, where, getDocs } = window.KreaNovaBackend;
                    
                    const qRoot = query(collection(db, "users"), where("referralCode", "==", refCode));
                    const snapRoot = await getDocs(qRoot);
                    let rootUser = null;
                    snapRoot.forEach(docSnap => { rootUser = docSnap.data(); });

                    let leftUser = null, rightUser = null;

                    if (rootUser) {
                        const qDown = query(collection(db, "users"), where("upline", "==", refCode));
                        const snapDown = await getDocs(qDown);
                        snapDown.forEach(docSnap => {
                            const data = docSnap.data();
                            if (data.position === 'KIRI') leftUser = data;
                            if (data.position === 'KANAN') rightUser = data;
                        });
                    }

                    setTreeData({ root: rootUser, left: leftUser, right: rightUser });
                } catch (e) { console.error("Error fetching tree:", e); } 
                finally { setLoading(false); }
            }, []);

            useEffect(() => { fetchNode(rootRef); }, [rootRef, fetchNode]);

            const handleDrillDown = (user) => { if (user) { setHistory(prev => [...prev, rootRef]); setRootRef(user.referralCode); } };
            const handleGoUp = () => { if (history.length > 0) { const newHistory = [...history]; const prev = newHistory.pop(); setHistory(newHistory); setRootRef(prev); } };
            const handleSearchSubmit = (e) => { e.preventDefault(); if (searchRef.trim()) { setHistory([]); setRootRef(searchRef.trim().toUpperCase()); } };

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-white tracking-wide"><i className="fas fa-sitemap text-blue-500 mr-2"></i> Pohon Jaringan</h2>
                            <p className="text-slate-400 text-xs mt-1">Eksplorasi seluruh struktur jaringan member.</p>
                        </div>
                        
                        <form onSubmit={handleSearchSubmit} className="flex gap-2 w-full md:w-auto">
                            <input type="text" value={searchRef} onChange={e => setSearchRef(e.target.value)} placeholder="Cari Kode ID..." className="flex-1 bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-xl text-xs outline-none focus:border-blue-500" />
                            <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap"><i className="fas fa-search mr-1"></i> Cari</button>
                        </form>
                    </div>

                    <div className="glass-panel p-4 md:p-8 rounded-2xl border border-slate-800 relative min-h-[400px] overflow-hidden">
                        {history.length > 0 && (
                            <button onClick={handleGoUp} className="absolute top-4 left-4 md:top-6 md:left-6 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 md:px-4 md:py-2 rounded-xl text-xs font-bold transition flex items-center z-20 shadow-md"><i className="fas fa-arrow-up mr-2"></i> Naik</button>
                        )}

                        <div className="w-full overflow-x-auto pb-4 custom-scrollbar">
                            {loading ? (
                                <div className="h-full w-full flex flex-col justify-center items-center py-20"><i className="fas fa-circle-notch fa-spin text-3xl text-blue-500 mb-2"></i><p className="text-xs text-slate-400">Memuat Jaringan...</p></div>
                            ) : (
                                <div className="min-w-[500px] flex flex-col items-center mx-auto mt-10 md:mt-0">
                                    <div className="bg-slate-900 border-2 border-yellow-500/80 p-4 rounded-2xl text-center w-56 md:w-64 shadow-xl z-10 relative">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-yellow-500/20 text-yellow-400 rounded-full flex items-center justify-center mx-auto mb-2 border border-yellow-500/40">
                                            <i className="fas fa-user-shield text-lg md:text-xl"></i>
                                        </div>
                                        <h4 className="font-bold text-white text-xs md:text-sm truncate">{treeData.root ? treeData.root.name : rootRef}</h4>
                                        <span className="bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 text-[9px] md:text-[10px] font-mono font-bold px-2 py-0.5 rounded-full inline-block mt-1">ID: {rootRef}</span>
                                    </div>
                                    <div className="w-48 h-6 md:h-8 border-t-2 border-l-2 border-r-2 border-slate-700 rounded-t-xl my-0"></div>
                                    <div className="flex justify-between w-full max-w-xl gap-4 md:gap-6 z-10">
                                        <div className="w-1/2 flex flex-col items-center">
                                            {treeData.left ? (
                                                <div onClick={() => handleDrillDown(treeData.left)} className="bg-slate-900 border border-blue-500/50 hover:border-blue-400 p-3 md:p-4 rounded-2xl text-center w-full shadow-lg cursor-pointer transition transform hover:-translate-y-1">
                                                    <div className="w-8 h-8 md:w-10 md:h-10 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-2 border border-blue-500/30">
                                                        <i className="fas fa-user text-xs md:text-sm"></i>
                                                    </div>
                                                    <p className="text-[11px] md:text-xs font-bold text-white truncate">{treeData.left.name}</p>
                                                    <p className="text-[9px] md:text-[10px] text-blue-400 font-mono mt-0.5">ID: {treeData.left.referralCode}</p>
                                                    <p className="text-[8px] md:text-[9px] text-slate-500 uppercase font-bold mt-2 border-t border-slate-800 pt-1">TIM KIRI</p>
                                                </div>
                                            ) : (
                                                <div className="bg-slate-950/60 border border-slate-800 border-dashed p-4 md:p-6 rounded-2xl text-center w-full flex items-center justify-center h-[120px]"><p className="text-[10px] md:text-xs text-slate-500 font-bold uppercase">Kaki Kiri Kosong</p></div>
                                            )}
                                        </div>
                                        <div className="w-1/2 flex flex-col items-center">
                                            {treeData.right ? (
                                                <div onClick={() => handleDrillDown(treeData.right)} className="bg-slate-900 border border-emerald-500/50 hover:border-emerald-400 p-3 md:p-4 rounded-2xl text-center w-full shadow-lg cursor-pointer transition transform hover:-translate-y-1">
                                                    <div className="w-8 h-8 md:w-10 md:h-10 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2 border border-emerald-500/30">
                                                        <i className="fas fa-user text-xs md:text-sm"></i>
                                                    </div>
                                                    <p className="text-[11px] md:text-xs font-bold text-white truncate">{treeData.right.name}</p>
                                                    <p className="text-[9px] md:text-[10px] text-emerald-400 font-mono mt-0.5">ID: {treeData.right.referralCode}</p>
                                                    <p className="text-[8px] md:text-[9px] text-slate-500 uppercase font-bold mt-2 border-t border-slate-800 pt-1">TIM KANAN</p>
                                                </div>
                                            ) : (
                                                <div className="bg-slate-950/60 border border-slate-800 border-dashed p-4 md:p-6 rounded-2xl text-center w-full flex items-center justify-center h-[120px]"><p className="text-[10px] md:text-xs text-slate-500 font-bold uppercase">Kaki Kanan Kosong</p></div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3. DATABASE MEMBER ---
        const AdminUsers = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!window.KreaNovaBackend) return;
                const { db, collection, onSnapshot } = window.KreaNovaBackend;

                const unsub = onSnapshot(collection(db, "users"), (snapshot) => {
                    const list = [];
                    snapshot.forEach(docSnap => { list.push({ id: docSnap.id, ...docSnap.data() }); });
                    // Urutkan PENDING di atas
                    list.sort((a, b) => {
                        if (a.status === 'PENDING' && b.status !== 'PENDING') return -1;
                        if (a.status !== 'PENDING' && b.status === 'PENDING') return 1;
                        return new Date(b.createdAt) - new Date(a.createdAt);
                    });
                    setUsers(list); setLoading(false);
                }, (err) => { console.error(err); setLoading(false); });

                return () => unsub();
            }, []);

            const handleActivate = async (user) => {
                try {
                    const { db, doc, updateDoc, collection, query, where, getDocs } = window.KreaNovaBackend;
                    
                    await updateDoc(doc(db, "users", user.id), { status: "ACTIVE" });

                    // Logika Komisi & Qualified Berulang
                    if (user.sponsor && user.sponsor !== 'KREANOVA') {
                        const qSponsor = query(collection(db, "users"), where("referralCode", "==", user.sponsor));
                        const snapSponsor = await getDocs(qSponsor);
                        
                        snapSponsor.forEach(async (spDoc) => {
                            const spData = spDoc.data();
                            
                            let newLeft = spData.leftDirects || 0;
                            let newRight = spData.rightDirects || 0;

                            const legToIncrement = user.sponsorLeg || user.position;
                            if (legToIncrement === 'KIRI') newLeft += 1;
                            if (legToIncrement === 'KANAN') newRight += 1;

                            // LOGIKA SIKLUS KELIPATAN 5
                            const oldPairs = Math.floor(Math.min(spData.leftDirects || 0, spData.rightDirects || 0) / 5);
                            const newPairs = Math.floor(Math.min(newLeft, newRight) / 5);
                            
                            let qualifiedBonus = 0;
                            if (newPairs > oldPairs) {
                                qualifiedBonus = (newPairs - oldPairs) * 50000;
                            }

                            const newWallet = (spData.walletAvailable || 0) + 40000 + qualifiedBonus;
                            const isQual = newPairs > 0;

                            await updateDoc(doc(db, "users", spDoc.id), {
                                walletAvailable: newWallet,
                                leftDirects: newLeft,
                                rightDirects: newRight,
                                isQualified: isQual,
                                qualifiedPairs: newPairs
                            });
                        });
                    }
                    showToast(`Akun ${user.name} berhasil DIAKTIFKAN!`, 'success');
                } catch (e) { showToast("Gagal mengaktifkan: " + e.message, 'error'); }
            };

            const handleBlock = async (user) => {
                try {
                    const { db, doc, updateDoc } = window.KreaNovaBackend;
                    await updateDoc(doc(db, "users", user.id), { status: "BLOCKED" });
                    showToast(`Akun ${user.name} telah DIBLOKIR!`, 'warning');
                } catch (e) { showToast("Gagal memblokir: " + e.message, 'error'); }
            };

            const handleRestore = async (user) => {
                try {
                    const { db, doc, updateDoc } = window.KreaNovaBackend;
                    await updateDoc(doc(db, "users", user.id), { status: "ACTIVE" });
                    showToast(`Akun ${user.name} berhasil DIPULIHKAN!`, 'success');
                } catch (e) { showToast("Gagal memulihkan: " + e.message, 'error'); }
            };

            const handleDelete = async (user) => {
                if(!window.confirm(`Yakin ingin MENGHAPUS PERMANEN akun ${user.name}? Jaringan di bawahnya akan ditarik ke atas.`)) return;
                
                try {
                    const { db, doc, deleteDoc, updateDoc, collection, query, where, getDocs } = window.KreaNovaBackend;
                    
                    // 1. Cari anak langsung dari user yang dihapus
                    const qDownline = query(collection(db, "users"), where("upline", "==", user.referralCode));
                    const snapDownline = await getDocs(qDownline);
                    
                    if (!snapDownline.empty) {
                        const newUplineCode = user.upline; 
                        const promises = [];
                        snapDownline.forEach((downDoc) => { 
                            promises.push(updateDoc(doc(db, "users", downDoc.id), { upline: newUplineCode })); 
                        });
                        await Promise.all(promises);
                    }
                    
                    // 2. Hapus permanen
                    await deleteDoc(doc(db, "users", user.id));
                    showToast(`Akun ${user.name} DIHAPUS. Jaringan di bawahnya telah ditarik naik.`, 'success');
                } catch (e) { showToast("Gagal menghapus: " + e.message, 'error'); }
            };

            const filteredUsers = users.filter(u => 
                (u.name && u.name.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (u.email && u.email.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (u.referralCode && u.referralCode.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-white tracking-wide"><i className="fas fa-users text-blue-500 mr-2"></i> Database Member</h2>
                            <p className="text-slate-400 text-xs mt-1">Kelola status, aktivasi, dan penghapusan member.</p>
                        </div>
                        <div className="relative w-full md:w-72">
                            <i className="fas fa-search absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                            <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Cari nama, email, atau ID..." className="w-full bg-slate-900 border border-slate-700 text-white pl-9 pr-4 py-2.5 rounded-xl text-xs outline-none focus:border-blue-500 shadow-sm" />
                        </div>
                    </div>

        // --- 5. KEUANGAN (WD) ---
        const AdminWD = ({ showToast }) => {
            const [withdrawals, setWithdrawals] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!window.KreaNovaBackend) return;
                const { db, collection, onSnapshot, query } = window.KreaNovaBackend;
                
                const q = query(collection(db, "withdrawals"));
                const unsub = onSnapshot(q, (snapshot) => {
                    const list = [];
                    snapshot.forEach(docSnap => {
                        list.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setWithdrawals(list);
                    setLoading(false);
                }, (err) => { console.error(err); setLoading(false); });

                return () => unsub();
            }, []);

            const handleApprove = async (wd) => {
                try {
                    const { db, doc, updateDoc } = window.KreaNovaBackend;
                    await updateDoc(doc(db, "withdrawals", wd.id), { status: "COMPLETED", processedAt: new Date().toISOString() });
                    showToast(`Withdrawal ${wd.name} disetujui!`, 'success');
                } catch(e) { showToast("Gagal approve: " + e.message, 'error'); }
            }

            const handleReject = async (wd) => {
                if(!window.confirm(`Tolak dan kembalikan Rp ${wd.amount} ke saldo ${wd.name}?`)) return;
                try {
                    const { db, doc, updateDoc, getDoc } = window.KreaNovaBackend;
                    
                    const userRef = doc(db, "users", wd.userId);
                    const userSnap = await getDoc(userRef);
                    if(userSnap.exists()) {
                        const currentWallet = userSnap.data().walletAvailable || 0;
                        await updateDoc(userRef, { walletAvailable: currentWallet + wd.amount });
                    }
                    
                    await updateDoc(doc(db, "withdrawals", wd.id), { status: "REJECTED", processedAt: new Date().toISOString() });
                    showToast(`WD ditolak. Saldo Rp ${wd.amount} dikembalikan.`, 'warning');

                            <button onClick={() => { setActiveMenu('dashboard'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-chart-pie w-6"></i> Dashboard
                            </button>
                            <button onClick={() => { setActiveMenu('network'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'network' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-sitemap w-6"></i> Pohon Jaringan
                            </button>
                            <button onClick={() => { setActiveMenu('users'); setIsSidebarOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'users' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <div className="flex items-center"><i className="fas fa-users w-6"></i> Database Member</div>
                                {pendingCount > 0 && <span className="bg-red-500 text-white text-[9px] md:text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse">{pendingCount}</span>}
                            </button>
                            <button onClick={() => { setActiveMenu('links'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'links' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-link w-6"></i> Manajemen Tautan
                            </button>
                            <button onClick={() => { setActiveMenu('wd'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'wd' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-money-bill-wave w-6"></i> Keuangan (WD)
                            </button>
                        </nav>

                        <div className="p-3 md:p-4 border-t border-slate-800">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 bg-slate-800/50 hover:bg-red-500/20 text-slate-400 hover:text-red-400 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all border border-transparent hover:border-red-500/30">
                                <i className="fas fa-sign-out-alt"></i> <span>Keluar</span>
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 w-full relative">
                        <header className="h-16 md:h-20 border-b border-slate-800 flex items-center justify-between px-4 md:px-8 bg-[#0b0f19]/80 backdrop-blur-md z-10 shrink-0">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden text-slate-300 hover:text-white bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                                    <i className="fas fa-bars text-lg"></i>
                                </button>
                                <div className="text-slate-400 text-xs md:text-sm font-medium hidden sm:block">
                                    <span className="text-blue-500">Super Admin</span> <i className="fas fa-chevron-right text-[10px] mx-2 opacity-50"></i> <span className="capitalize">{activeMenu === 'wd' ? 'Keuangan' : activeMenu}</span>
                                </div>
                            </div>

                            <div className="flex items-center space-x-4 md:space-x-6">
                                <div className="relative cursor-pointer" onClick={() => setActiveMenu('users')}>
                                    <i className="fas fa-bell text-slate-400 text-lg md:text-xl hover:text-white transition"></i>
                                    {pendingCount > 0 && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 md:w-3 md:h-3 bg-red-500 rounded-full border-2 border-[#0b0f19] animate-pulse"></span>}
                                </div>
                                <div className="flex items-center space-x-2 md:space-x-3 pl-4 md:pl-6 border-l border-slate-700">
                                    <div className="text-right hidden sm:block">
                                        <p className="text-xs md:text-sm font-bold text-white">DELTAFORCE</p>
                                        <p className="text-[9px] md:text-[10px] text-yellow-500 font-bold uppercase tracking-wider">Founder</p>
                                    </div>
                                    <div className="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-tr from-slate-700 to-slate-600 rounded-full flex items-center justify-center border border-slate-500 shadow-sm">
                                        <i className="fas fa-user-shield text-white text-xs md:text-sm"></i>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                            <div className="max-w-7xl mx-auto pb-8">
                                {activeMenu === 'dashboard' && <DashboardOverview />}
                                {activeMenu === 'network' && <AdminNetworkTree />}
                                {activeMenu === 'users' && <AdminUsers showToast={showToast} />}
                                {activeMenu === 'links' && <AdminLinks showToast={showToast} />}
                                {activeMenu === 'wd' && <AdminWD showToast={showToast} />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
