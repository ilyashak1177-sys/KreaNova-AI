<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI | Super Admin Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glow-text { text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tree-node { display: flex; flex-direction: column; align-items: center; position: relative; padding: 20px 0; transition: all 0.3s; }
        .tree-node::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #334155; width: 0; height: 20px; }
        .tree-root::before { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
        } catch (error) { console.error("Firebase Error:", error); }
        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, deleteDoc, doc, setDoc, getDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            return (
                <div className={`fixed top-5 right-5 ${bgColor} text-white px-6 py-3 rounded-lg shadow-2xl z-50 animate-slide-up flex items-center gap-3`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-xl`}></i>
                    <span className="font-semibold text-sm">{message}</span>
                </div>
            );
        };

        // --- KOMPONEN POHON JARINGAN ---
        const AdminNetworkTree = () => (
            <div className="animate-fade-in h-full flex flex-col">
                <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-sitemap text-yellow-500 mr-2"></i> Visualisasi Jaringan Binary (MLM)</h2>
                <div className="glass-panel flex-1 rounded-2xl shadow-lg p-8 flex items-center justify-center overflow-auto custom-scrollbar">
                    <div className="flex flex-col items-center">
                        <div className="tree-node tree-root">
                            <div className="w-16 h-16 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.5)] border-4 border-slate-900 z-10 cursor-pointer hover:scale-110 transition">
                                <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-full h-full rounded-full object-cover" onError={(e) => e.target.style.display='none'} />
                            </div>
                            <p className="text-xs font-bold text-yellow-400 mt-2">Master Code</p>
                        </div>
                        <div className="w-full h-8 border-t-2 border-l-2 border-r-2 border-slate-600 rounded-t-xl mx-auto flex justify-between px-16 relative" style={{width: '300px'}}></div>
                        <div className="flex justify-between w-full" style={{width: '350px'}}>
                            <div className="tree-node">
                                <div className="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-900 z-10 text-white font-bold cursor-pointer hover:scale-110 transition">Kiri</div>
                            </div>
                            <div className="tree-node">
                                <div className="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-900 z-10 text-white font-bold cursor-pointer hover:scale-110 transition">Kanan</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- KOMPONEN MANAJEMEN TAUTAN 10 MENU & AI ---
        const AdminLinks = ({ showToast }) => {
            const [isSaving, setIsSaving] = useState(false);
            
            // State untuk 10 Menu Utama KreaNova
            const [mainMenus, setMainMenus] = useState({
                menu1: '', menu2: '', menu3: '', menu4: '', menu5: '', 
                menu6: '', menu7: '', menu8: '', menu9: '', menu10: ''
            });

            // State Dinamis untuk Slot AI
            const [aiSlots, setAiSlots] = useState([
                { id: 1, name: 'AI Text-to-Image', url: '' },
                { id: 2, name: 'AI Video Maker', url: '' }
            ]);

            // Load data dari Firebase
            useEffect(() => {
                const fetchLinks = async () => {
                    if(!window.KreaNovaBackend) return;
                    try {
                        const { db, doc, getDoc } = window.KreaNovaBackend;
                        const docSnap = await getDoc(doc(db, "settings", "global_links"));
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.mainMenus) setMainMenus(data.mainMenus);
                            if (data.aiSlots) setAiSlots(data.aiSlots);
                        }
                    } catch (e) { console.error("Gagal load link", e); }
                };
                fetchLinks();
            }, []);

            // Handle Perubahan Input Menu Utama
            const handleMenuChange = (e) => {
                setMainMenus({ ...mainMenus, [e.target.name]: e.target.value });
            };

            // Handle Perubahan Input Slot AI
            const handleAiChange = (index, field, value) => {
                const newAiSlots = [...aiSlots];
                newAiSlots[index][field] = value;
                setAiSlots(newAiSlots);
            };

            // Tambah Slot AI Baru
            const addAiSlot = () => {
                setAiSlots([...aiSlots, { id: Date.now(), name: `Tools AI Baru ${aiSlots.length + 1}`, url: '' }]);
            };

            // Hapus Slot AI
            const removeAiSlot = (index) => {
                const newAiSlots = aiSlots.filter((_, i) => i !== index);
                setAiSlots(newAiSlots);
            };

            // Simpan ke Firebase
            const handleSave = async () => {
                setIsSaving(true);
                if(!window.KreaNovaBackend) {
                    showToast('Gagal terhubung ke Firebase', 'error');
                    setIsSaving(false);
                    return;
                }
                try {
                    const { db, doc, setDoc } = window.KreaNovaBackend;
                    await setDoc(doc(db, "settings", "global_links"), {
                        mainMenus: mainMenus,
                        aiSlots: aiSlots
                    });
                    showToast('Sukses! Semua link berhasil di-deploy ke aplikasi utama.', 'success');
                } catch (e) {
                    showToast('Gagal menyimpan: ' + e.message, 'error');
                }
                setIsSaving(false);
            };

            return (
                <div className="animate-fade-in max-w-5xl space-y-6 pb-10">
                    <div className="flex justify-between items-end mb-4">
                        <div>
                            <h2 className="text-2xl font-bold text-white mb-2"><i className="fas fa-link text-blue-500 mr-2"></i> CMS Tautan Global</h2>
                            <p className="text-sm text-slate-400">Atur 10 Menu Utama KreaNova dan Generator AI secara Real-Time.</p>
                        </div>
                        <button onClick={handleSave} disabled={isSaving} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1">
                            {isSaving ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-cloud-upload-alt mr-2"></i>}
                            {isSaving ? 'Menyimpan...' : 'Deploy Semua Perubahan'}
                        </button>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* KARTU 1: 10 MENU UTAMA KREANOVA */}
                        <div className="glass-panel p-6 rounded-2xl shadow-lg border-t-4 border-t-emerald-500">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center"><i className="fas fa-th text-emerald-400 mr-2"></i> 10 Menu Utama KreaNova</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-1 block">1. Affiliate Produk</label>
                                    <input type="text" name="menu1" value={mainMenus.menu1} onChange={handleMenuChange} placeholder="URL Affiliate" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-1 block">2. Drama Short</label>
                                    <input type="text" name="menu2" value={mainMenus.menu2} onChange={handleMenuChange} placeholder="URL Drama" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-1 block">3. Tutorial AI</label>
                                    <input type="text" name="menu3" value={mainMenus.menu3} onChange={handleMenuChange} placeholder="URL Tutorial" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">4. Menu 4</label>
                                    <input type="text" name="menu4" value={mainMenus.menu4} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">5. Menu 5</label>
                                    <input type="text" name="menu5" value={mainMenus.menu5} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">6. Menu 6</label>
                                    <input type="text" name="menu6" value={mainMenus.menu6} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">7. Menu 7</label>
                                    <input type="text" name="menu7" value={mainMenus.menu7} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">8. Menu 8</label>
                                    <input type="text" name="menu8" value={mainMenus.menu8} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">9. Menu 9</label>
                                    <input type="text" name="menu9" value={mainMenus.menu9} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">10. Menu 10</label>
                                    <input type="text" name="menu10" value={mainMenus.menu10} onChange={handleMenuChange} placeholder="URL Tambahan" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-2.5 text-sm text-white outline-none" />
                                </div>
                            </div>
                        </div>

                        {/* KARTU 2: SLOT AI DINAMIS */}
                        <div className="glass-panel p-6 rounded-2xl shadow-lg border-t-4 border-t-purple-500 flex flex-col">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center justify-between">
                                <div><i className="fas fa-robot text-purple-400 mr-2"></i> Hub AI Generator</div>
                                <span className="bg-purple-500/20 text-purple-400 text-xs px-2 py-1 rounded-full">{aiSlots.length} Slot Aktif</span>
                            </h3>
                            
                            <div className="space-y-4 flex-1 overflow-y-auto custom-scrollbar pr-2 max-h-[450px]">
                                {aiSlots.map((slot, index) => (
                                    <div key={slot.id} className="bg-slate-900/50 p-4 rounded-xl border border-slate-700 relative group">
                                        {aiSlots.length > 1 && (
                                            <button onClick={() => removeAiSlot(index)} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs shadow opacity-0 group-hover:opacity-100 transition"><i className="fas fa-times"></i></button>
                                        )}
                                        <div className="mb-2">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nama Tools AI (Label)</label>
                                            <input type="text" value={slot.name} onChange={(e) => handleAiChange(index, 'name', e.target.value)} placeholder="Contoh: Krea AI Image" className="w-full bg-slate-950 border border-slate-700 focus:border-purple-500 rounded-lg p-2 text-sm text-white outline-none" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Link URL</label>
                                            <input type="text" value={slot.url} onChange={(e) => handleAiChange(index, 'url', e.target.value)} placeholder="https://..." className="w-full bg-slate-950 border border-slate-700 focus:border-purple-500 rounded-lg p-2 text-sm text-white outline-none" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <button onClick={addAiSlot} className="w-full mt-4 py-3 border-2 border-dashed border-purple-500/50 text-purple-400 font-bold rounded-xl hover:bg-purple-500/10 transition">
                                <i className="fas fa-plus mr-2"></i>Tambah Slot AI Baru
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeMenu, setActiveMenu] = useState('links'); // Set default ke links untuk memudahkan Anda
            const [toast, setToast] = useState(null);
            const showToast = (msg, type) => setToast({ msg, type });

            return (
                <div className="h-screen w-full flex bg-[#0b0f19] bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] overflow-hidden">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    <aside className="w-20 lg:w-72 glass-panel border-r border-slate-800/50 flex flex-col z-20 transition-all duration-300">
                        <div className="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-slate-800/50 shrink-0">
                            <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-10 h-10 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.3)] border border-yellow-500/50" onError={(e) => e.target.style.display='none'} />
                            <div className="ml-3 hidden lg:block"><h1 className="font-black text-lg text-white tracking-wide glow-text">KreaNova AI</h1><p className="text-[10px] font-bold text-yellow-500 uppercase tracking-widest">Super Admin</p></div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 flex flex-col gap-2 px-3 custom-scrollbar">
                            <button onClick={() => setActiveMenu('network')} className={`flex items-center p-3 rounded-xl transition group ${activeMenu === 'network' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-sitemap w-6"></i><span className="ml-3 font-semibold hidden lg:block">Pohon Jaringan</span></button>
                            <button onClick={() => setActiveMenu('links')} className={`flex items-center p-3 rounded-xl transition group ${activeMenu === 'links' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-link w-6"></i><span className="ml-3 font-semibold hidden lg:block">Manajemen Tautan</span></button>
                            {/* Menu lainnya (Dashboard, Member) saya sembunyikan sementara di kode ini agar fokus ke Tautan & Pohon sesuai request, tapi bisa ditambahkan kembali jika perlu */}
                        </nav>
                    </aside>
                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        <header className="h-20 glass-panel border-b border-slate-800/50 flex items-center justify-between px-8 z-10 shrink-0">
                            <div className="flex items-center text-slate-400 text-sm font-medium"><span>Super Admin</span> <i className="fas fa-chevron-right mx-3 text-xs opacity-50"></i> <span className="text-blue-400 capitalize">{activeMenu}</span></div>
                            <div className="flex items-center gap-5"><div className="w-10 h-10 rounded-full bg-slate-800 border-2 border-slate-600 flex items-center justify-center text-white"><i className="fas fa-user-shield"></i></div></div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar pb-32">
                            {activeMenu === 'network' && <AdminNetworkTree />}
                            {activeMenu === 'links' && <AdminLinks showToast={showToast} />}
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
