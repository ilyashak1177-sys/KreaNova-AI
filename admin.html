<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI | Super Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glow-text { text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tree-node { display: flex; flex-direction: column; align-items: center; position: relative; padding: 20px 0; transition: all 0.3s; }
        .tree-node::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #334155; width: 0; height: 20px; }
        .tree-root::before { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, deleteDoc, doc, setDoc, getDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
        } catch (error) { console.warn("Firebase Warning:", error.message); }
        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, deleteDoc, doc, setDoc, getDoc, query, where, onSnapshot };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            return (
                <div className={`fixed top-5 right-5 ${bgColor} text-white px-6 py-3 rounded-lg shadow-2xl z-50 animate-slide-up flex items-center gap-3`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-xl`}></i>
                    <span className="font-semibold text-sm">{message}</span>
                </div>
            );
        };

        // --- 1. DASHBOARD ---
        const DashboardOverview = () => (
            <div className="animate-fade-in space-y-6">
                <div className="flex justify-between items-end mb-8">
                    <div>
                        <h2 className="text-2xl font-bold text-white mb-1 glow-text">Pusat Komando</h2>
                        <p className="text-sm text-slate-400">Ringkasan performa KreaNova AI secara Real-Time.</p>
                    </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-blue-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Total Member</p><i className="fas fa-users text-blue-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-emerald-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Member Aktif</p><i className="fas fa-user-check text-emerald-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-orange-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Antrean WD</p><i className="fas fa-wallet text-orange-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-yellow-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Revenue (Rp)</p><i className="fas fa-chart-line text-yellow-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                </div>
            </div>
        );

        // --- 3. DATABASE MEMBER ---
        const AdminUsers = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState("");
            const [processingId, setProcessingId] = useState(null);

            useEffect(() => { fetchUsers(); }, []);

            const fetchUsers = async () => {
                if(!window.KreaNovaBackend) return;
                setLoading(true);
                try {
                    const { db, collection, getDocs } = window.KreaNovaBackend;
                    const snap = await getDocs(collection(db, "users"));
                    const userList = [];
                    snap.forEach(doc => userList.push(doc.data()));
                    userList.sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
                    setUsers(userList);
                } catch (e) {
                    console.error(e);
                    showToast("Gagal mengambil data pengguna.", "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleActivate = async (targetUser) => {
                if(!window.KreaNovaBackend) return;
                setProcessingId(targetUser.userId + '-activate');
                try {
                    const { db, doc, updateDoc, getDocs, collection, query, where } = window.KreaNovaBackend;
                    
                    // 1. Aktifkan akun member
                    await updateDoc(doc(db, "users", targetUser.userId), {
                        status: 'ACTIVE'
                    });

                    // 2. Cari Sponsor untuk membagikan bonus
                    if (targetUser.sponsor && targetUser.sponsor !== 'KREANOVA') {
                        const qSponsor = query(collection(db, "users"), where("referralCode", "==", targetUser.sponsor));
                        const sponsorSnap = await getDocs(qSponsor);
                        
                        if (!sponsorSnap.empty) {
                            const sponsorDoc = sponsorSnap.docs[0];
                            const sponsorData = sponsorDoc.data();
                            
                            let newWallet = (sponsorData.walletAvailable || 0) + 40000;
                            let newLeftDirects = sponsorData.leftDirects || 0;
                            let newRightDirects = sponsorData.rightDirects || 0;

                            if (targetUser.position === 'KIRI') newLeftDirects += 1;
                            if (targetUser.position === 'KANAN') newRightDirects += 1;

                            let qualified = sponsorData.isQualified || false;

                            // Cek syarat Qualified
                            if (!qualified && newLeftDirects >= 10 && newRightDirects >= 10) {
                                newWallet += 50000;
                                qualified = true;
                                showToast(`Bonus Qualified Rp50.000 cair ke sponsor ${sponsorData.name}!`, 'success');
                            }

                            await updateDoc(doc(db, "users", sponsorData.userId), {
                                walletAvailable: newWallet,
                                leftDirects: newLeftDirects,
                                rightDirects: newRightDirects,
                                isQualified: qualified
                            });
                        }
                    }
                    showToast(`Akun ${targetUser.name} berhasil diaktifkan!`, "success");
                    fetchUsers();
                } catch (e) {
                    console.error(e);
                    showToast("Gagal aktivasi: " + e.message, "error");
                } finally {
                    setProcessingId(null);
                }
            };

            const handleBlock = async (targetUser) => {
                if(!window.KreaNovaBackend) return;
                setProcessingId(targetUser.userId + '-block');
                try {
                    const { db, doc, updateDoc } = window.KreaNovaBackend;
                    await updateDoc(doc(db, "users", targetUser.userId), { status: 'BLOCKED' });
                    showToast(`Akun ${targetUser.name} berhasil diblokir.`, "success");
                    fetchUsers();
                } catch (e) {
                    showToast("Gagal memblokir: " + e.message, "error");
                } finally {
                    setProcessingId(null);
                }
            };

            const handleReactivate = async (targetUser) => {
                if(!window.KreaNovaBackend) return;
                setProcessingId(targetUser.userId + '-reactivate');
                try {
                    const { db, doc, updateDoc } = window.KreaNovaBackend;
                    // Aktifkan tanpa membagikan ulang bonus
                    await updateDoc(doc(db, "users", targetUser.userId), { status: 'ACTIVE' });
                    showToast(`Akun ${targetUser.name} dipulihkan (Tanpa bonus ganda).`, "success");
                    fetchUsers();
                } catch (e) {
                    showToast("Gagal memulihkan: " + e.message, "error");
                } finally {
                    setProcessingId(null);
                }
            };

            const handleDelete = async (targetUser) => {
                if(!window.KreaNovaBackend) return;
                setProcessingId(targetUser.userId + '-delete');
                try {
                    const { db, doc, deleteDoc } = window.KreaNovaBackend;
                    await deleteDoc(doc(db, "users", targetUser.userId));
                    showToast(`Data ${targetUser.name} berhasil dihapus permanen.`, "success");
                    fetchUsers();
                } catch (e) {
                    showToast("Gagal menghapus: " + e.message, "error");
                } finally {
                    setProcessingId(null);
                }
            };

            const filteredUsers = users.filter(u => u.name?.toLowerCase().includes(searchQuery.toLowerCase()) || u.referralCode?.toLowerCase().includes(searchQuery.toLowerCase()));

            return (
                <div className="animate-fade-in space-y-6 pb-10">
                    <div className="flex flex-col md:flex-row justify-between md:items-end gap-4 mb-4">
                        <div>
                            <h2 className="text-2xl font-bold text-white mb-1"><i className="fas fa-users-cog text-blue-500 mr-2"></i> Database Member</h2>
                            <p className="text-sm text-slate-400">Kelola pendaftaran, aktivasi, pemblokiran, dan penghapusan pengguna.</p>
                        </div>
                        <div className="relative">
                            <i className="fas fa-search absolute left-3 top-3.5 text-slate-500"></i>
                            <input type="text" placeholder="Cari nama / ID..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full md:w-64 bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-white outline-none transition" />
                        </div>
                    </div>

                    <div className="glass-panel rounded-2xl shadow-lg border-t-4 border-t-blue-500 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead>
                                    <tr className="bg-slate-900/80 border-b border-slate-700/50 text-xs uppercase tracking-wider text-slate-400 font-bold">
                                        <th className="p-4">Member</th>
                                        <th className="p-4 text-center">Sponsor & Posisi</th>
                                        <th className="p-4 text-center">Tagihan (Rp)</th>
                                        <th className="p-4 text-center">Status</th>
                                        <th className="p-4 text-center">Aksi Manajemen</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {loading ? (
                                        <tr><td colSpan="5" className="p-8 text-center text-slate-500"><i className="fas fa-circle-notch fa-spin text-2xl mb-2"></i><p>Memuat database...</p></td></tr>
                                    ) : filteredUsers.length === 0 ? (
                                        <tr><td colSpan="5" className="p-8 text-center text-slate-500"><i className="fas fa-folder-open text-2xl mb-2"></i><p>Belum ada data member ditemukan.</p></td></tr>
                                    ) : filteredUsers.map((u, i) => (
                                        <tr key={i} className="hover:bg-slate-800/30 transition-colors">
                                            <td className="p-4">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center ${u.status === 'BLOCKED' ? 'text-red-400' : 'text-blue-400'}`}>
                                                        <i className={`fas ${u.status === 'BLOCKED' ? 'fa-user-slash' : 'fa-user'}`}></i>
                                                    </div>
                                                    <div>
                                                        <p className={`text-sm font-bold ${u.status === 'BLOCKED' ? 'text-slate-400 line-through' : 'text-white'}`}>{u.name}</p>
                                                        <p className="text-[10px] font-mono text-yellow-500 bg-yellow-500/10 px-1.5 py-0.5 rounded border border-yellow-500/20 inline-block mt-1">ID: {u.referralCode}</p>
                                                        <p className="text-xs text-slate-400">{u.email}</p>
                                                    </div>
                                                </div>
                                            </td>
                                            <td className="p-4 text-center">
                                                <p className="text-xs font-mono text-slate-300">{u.sponsor || '-'}</p>
                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded mt-1 inline-block ${u.position === 'KIRI' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'}`}>{u.position}</span>
                                            </td>
                                            <td className="p-4 text-center font-mono text-sm text-slate-300">{new Intl.NumberFormat('id-ID').format(u.billAmount || 0)}</td>
                                            <td className="p-4 text-center">
                                                {u.status === 'ACTIVE' ? (
                                                    <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-bold"><i className="fas fa-check mr-1"></i> AKTIF</span>
                                                ) : u.status === 'BLOCKED' ? (
                                                    <span className="bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[10px] font-bold"><i className="fas fa-ban mr-1"></i> BLOKIR</span>
                                                ) : (
                                                    <span className="bg-orange-500/20 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full text-[10px] font-bold"><i className="fas fa-clock mr-1"></i> PENDING</span>
                                                )}
                                            </td>
                                            <td className="p-4 text-center">
                                                <div className="flex items-center justify-center gap-2">
                                                    {u.status === 'PENDING' && (
                                                        <button onClick={() => handleActivate(u)} disabled={processingId !== null} className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-[10px] font-bold shadow transition flex items-center">
                                                            {processingId === u.userId + '-activate' ? <i className="fas fa-spinner fa-spin"></i> : "Aktifkan"}
                                                        </button>
                                                    )}
                                                    {u.status === 'ACTIVE' && (
                                                        <button onClick={() => handleBlock(u)} disabled={processingId !== null} className="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1.5 rounded text-[10px] font-bold shadow transition flex items-center" title="Blokir Akun">
                                                            {processingId === u.userId + '-block' ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-ban mr-1"></i> Blokir</>}
                                                        </button>
                                                    )}
                                                    {u.status === 'BLOCKED' && (
                                                        <button onClick={() => handleReactivate(u)} disabled={processingId !== null} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-[10px] font-bold shadow transition flex items-center" title="Pulihkan Akun">
                                                            {processingId === u.userId + '-reactivate' ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-unlock mr-1"></i> Pulihkan</>}
                                                        </button>
                                                    )}
                                                    <button onClick={() => handleDelete(u)} disabled={processingId !== null} className="bg-red-950/40 hover:bg-red-600 text-red-400 hover:text-white border border-red-900/50 hover:border-red-600 px-3 py-1.5 rounded text-[10px] font-bold shadow transition flex items-center" title="Hapus Permanen">
                                                        {processingId === u.userId + '-delete' ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-trash-alt"></i>}
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- POHON JARINGAN ---
        const AdminNetworkTree = () => {
            const [allUsers, setAllUsers] = useState([]);
            const [viewRoot, setViewRoot] = useState({ name: 'Perusahaan (Master)', referralCode: 'KREANOVA' });
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchAll = async () => {
                    if(!window.KreaNovaBackend) return;
                    try {
                        const { db, collection, getDocs } = window.KreaNovaBackend;
                        const snap = await getDocs(collection(db, "users"));
                        const users = [];
                        snap.forEach(d => users.push(d.data()));
                        setAllUsers(users);
                    } catch (e) {
                        console.error(e);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchAll();
            }, []);

            const leftNode = allUsers.find(u => (u.upline || u.sponsor) === viewRoot.referralCode && u.position === 'KIRI' && u.status === 'ACTIVE');
            const rightNode = allUsers.find(u => (u.upline || u.sponsor) === viewRoot.referralCode && u.position === 'KANAN' && u.status === 'ACTIVE');

            const handleDrillDown = (node) => {
                if (!node) return;
                setHistory([...history, viewRoot]);
                setViewRoot(node);
            };

            const handleGoUp = () => {
                if (history.length === 0) return;
                const newHist = [...history];
                const prev = newHist.pop();
                setHistory(newHist);
                setViewRoot(prev);
            };

            const renderNode = (nodeData, position) => {
                if (loading) {
                    return <div className="w-[45%] text-center py-4"><i className="fas fa-circle-notch fa-spin text-slate-500"></i></div>;
                }
                
                if (nodeData) {
                    return (
                        <div className="flex flex-col items-center w-[45%] cursor-pointer group" onClick={() => handleDrillDown(nodeData)}>
                            <div className="w-0.5 h-6 bg-slate-600 mb-0"></div>
                            <div className="bg-slate-800/80 border-2 border-emerald-500/50 p-4 rounded-xl w-full text-center hover:bg-slate-700 hover:scale-105 transition shadow-lg relative">
                                <div className="w-8 h-8 mx-auto bg-emerald-600 rounded-full flex items-center justify-center mb-2 shadow-inner">
                                    <i className="fas fa-user text-white text-xs"></i>
                                </div>
                                <p className="text-xs text-white font-bold truncate">{nodeData.name}</p>
                                <p className="text-[10px] text-emerald-400 font-mono mt-1">ID: {nodeData.referralCode}</p>
                            </div>
                            <div className="w-16 h-4 border-t border-l border-r border-slate-700 mt-0 opacity-50"></div>
                        </div>
                    );
                }

                return (
                    <div className="flex flex-col items-center w-[45%]">
                        <div className="w-0.5 h-6 bg-slate-600 mb-0"></div>
                        <div className="bg-slate-900/50 border border-slate-700 border-dashed p-4 rounded-xl text-center w-full shadow-lg relative">
                            <p className="text-xs text-slate-500 uppercase font-bold py-4">Tim {position}<br/>(Kosong)</p>
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in h-full flex flex-col">
                    <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-sitemap text-yellow-500 mr-2"></i> Visualisasi Jaringan Binary</h2>
                    <div className="glass-panel flex-1 rounded-2xl shadow-lg p-8 flex flex-col items-center justify-start overflow-auto custom-scrollbar relative">
                        
                        {history.length > 0 && (
                            <button onClick={handleGoUp} className="absolute top-8 left-8 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition flex items-center">
                                <i className="fas fa-arrow-up mr-2"></i> Kembali Naik
                            </button>
                        )}

                        <div className="flex flex-col items-center mt-4">
                            <div className="tree-node tree-root">
                                <div className={`w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(250,204,21,0.5)] border-4 ${history.length > 0 ? 'border-blue-500' : 'border-yellow-500'} z-10`}>
                                    {history.length === 0 ? (
                                        <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-full h-full rounded-full object-cover" onError={(e) => e.target.style.display='none'} />
                                    ) : (
                                        <i className="fas fa-user-tie text-3xl text-white"></i>
                                    )}
                                </div>
                                <p className="text-sm font-bold text-white mt-3">{viewRoot.name}</p>
                                <p className="text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded border border-yellow-500/30 mt-1">ID: {viewRoot.referralCode}</p>
                            </div>
                            
                            <div className="w-full h-10 border-t-2 border-l-2 border-r-2 border-slate-600 rounded-t-xl mx-auto flex justify-between px-16 relative mt-2" style={{width: '380px'}}></div>
                            
                            <div className="flex justify-between w-full" style={{width: '450px'}}>
                                {renderNode(leftNode, 'KIRI')}
                                {renderNode(rightNode, 'KANAN')}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. CMS TAUTAN + TRIPAY ---
        const AdminLinks = ({ showToast }) => {
            const [isSaving, setIsSaving] = useState(false);
            const [tripayLink, setTripayLink] = useState('');
            const [bannerText, setBannerText] = useState(''); // MENGGANTI bannerLink MENJADI bannerText
            const [mainMenus, setMainMenus] = useState([
                { id: 1, name: 'Tutorial Penggunaan GenAI', url: '' },
                { id: 2, name: 'Affiliate Produk', url: '' },
                { id: 3, name: 'Drama Short', url: '' },
                { id: 4, name: 'Motivasiku', url: '' },
                { id: 5, name: 'Qur\'an Overlay', url: '' },
                { id: 6, name: 'Animal Creature', url: '' },
                { id: 7, name: 'Animal Human Activity', url: '' }
            ]);

            useEffect(() => {
                const fetchLinks = async () => {
                    if(!window.KreaNovaBackend) return;
                    try {
                        const { db, doc, getDoc } = window.KreaNovaBackend;
                        const docSnap = await getDoc(doc(db, "settings", "global_links"));
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.mainMenus && Array.isArray(data.mainMenus) && data.mainMenus.length > 0) {
                                setMainMenus(data.mainMenus);
                            }
                            if (data.tripayLink) setTripayLink(data.tripayLink);
                            if (data.bannerText !== undefined) setBannerText(data.bannerText);
                            else if (data.bannerLink) setBannerText(data.bannerLink); // Fallback ke data lama jika ada
                        }
                    } catch (e) { console.warn("Pratinjau Offline: Memuat tautan bawaan."); }
                };
                fetchLinks();
            }, []);

            const handleMenuChange = (index, field, value) => {
                const newMenus = [...mainMenus];
                newMenus[index][field] = value;
                setMainMenus(newMenus);
            };

            const addMenuSlot = () => {
                setMainMenus([...mainMenus, { id: Date.now(), name: `Menu Baru ${mainMenus.length + 1}`, url: '' }]);
            };

            const removeMenuSlot = (index) => {
                setMainMenus(mainMenus.filter((_, i) => i !== index));
            };

            const handleSave = async () => {
                setIsSaving(true);
                if(!window.KreaNovaBackend) { showToast('Gagal terhubung ke Firebase', 'error'); setIsSaving(false); return; }
                try {
                    const { db, doc, setDoc } = window.KreaNovaBackend;
                    await setDoc(doc(db, "settings", "global_links"), { 
                        mainMenus,
                        tripayLink,
                        bannerText // MENYIMPAN SEBAGAI TEKS NASKAH
                    });
                    showToast('Sukses! Semua link & Pengumuman berhasil di-deploy.', 'success');
                } catch (e) { showToast('Gagal menyimpan: ' + e.message, 'error'); }
                setIsSaving(false);
            };

            return (
                <div className="animate-fade-in max-w-5xl space-y-6 pb-10">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-white mb-2"><i className="fas fa-link text-blue-500 mr-2"></i> CMS Tautan Global</h2>
                            <p className="text-sm text-slate-400">Ubah link di sini, dan semua perangkat member akan otomatis berubah seketika.</p>
                        </div>
                        <button onClick={handleSave} disabled={isSaving} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1 w-full md:w-auto">
                            {isSaving ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-cloud-upload-alt mr-2"></i>}
                            {isSaving ? 'Menyimpan...' : 'Deploy Perubahan'}
                        </button>
                    </div>

                    {/* KARTU BANNER POPUP TENGAH */}
                    <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-lg border-t-4 border-t-yellow-500">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center border-b border-slate-700/50 pb-4">
                            <i className="fas fa-file-alt text-yellow-400 mr-3"></i> Banner Pop-up (Teks Informasi)
                        </h3>
                        <div className="bg-slate-900/50 p-5 rounded-xl border border-slate-700 transition-all hover:border-yellow-500/50 shadow-sm relative overflow-hidden">
                            <div className="mb-2 relative z-10">
                                <label className="text-xs font-bold text-yellow-400 uppercase tracking-wider block mb-1">Naskah Pengumuman</label>
                                <p className="text-[10px] text-slate-400 mb-4">Ketik informasi, peraturan, atau promosi. Teks ini akan muncul saat member menekan logo KreaNova di tengah navigasi bawah.</p>
                                <textarea 
                                    value={bannerText} 
                                    onChange={(e) => setBannerText(e.target.value)} 
                                    placeholder="Tuliskan pengumuman di sini..." 
                                    className="w-full bg-slate-950 border border-slate-700 focus:border-yellow-500 rounded-lg p-3 text-sm text-white outline-none transition custom-scrollbar min-h-[120px] resize-y" 
                                ></textarea>
                            </div>
                        </div>
                    </div>

                    {/* KARTU TRIPAY PAYMENT GATEWAY */}
                    <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-lg border-t-4 border-t-blue-500 mt-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center border-b border-slate-700/50 pb-4">
                            <i className="fas fa-credit-card text-blue-400 mr-3"></i> Payment Gateway (Tripay)
                        </h3>
                        <div className="bg-slate-900/50 p-5 rounded-xl border border-slate-700 transition-all hover:border-blue-500/50 shadow-sm relative overflow-hidden">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/10 rounded-full blur-xl pointer-events-none"></div>
                            <div className="mb-2 relative z-10">
                                <label className="text-xs font-bold text-blue-400 uppercase tracking-wider block mb-1">Link URL Payment Tripay (Pendaftaran)</label>
                                <p className="text-[10px] text-slate-400 mb-4">Tautan ini akan diarahkan secara otomatis saat calon member mengklik tombol pendaftaran/pembayaran di web utama.</p>
                                <input 
                                    type="text" 
                                    value={tripayLink} 
                                    onChange={(e) => setTripayLink(e.target.value)} 
                                    placeholder="https://tripay.co.id/checkout/..." 
                                    className="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-lg p-3 text-sm text-white outline-none transition" 
                                />
                            </div>
                        </div>
                    </div>

                    {/* KARTU MENU UTAMA */}
                    <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-lg border-t-4 border-t-emerald-500 mt-6">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center justify-between border-b border-slate-700/50 pb-4">
                            <div><i className="fas fa-th-list text-emerald-400 mr-2"></i> 10 Menu Utama KreaNova AI</div>
                            <span className="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold">{mainMenus.length} Slot Aktif</span>
                        </h3>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {mainMenus.map((menu, index) => (
                                <div key={menu.id} className="bg-slate-900/50 p-5 rounded-xl border border-slate-700 relative group transition-all hover:border-emerald-500/50 shadow-sm">
                                    {mainMenus.length > 1 && (
                                        <button onClick={() => removeMenuSlot(index)} className="absolute -top-3 -right-3 bg-red-500 text-white w-7 h-7 rounded-full text-xs shadow-lg opacity-0 group-hover:opacity-100 transition hover:bg-red-600 z-10 tooltip" title="Hapus Slot">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    )}
                                    
                                    <div className="mb-4">
                                        <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-1">Nama Slot {index + 1}</label>
                                        <input type="text" value={menu.name} onChange={(e) => handleMenuChange(index, 'name', e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-3 text-sm text-white outline-none transition" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Link URL</label>
                                        <input type="text" value={menu.url} onChange={(e) => handleMenuChange(index, 'url', e.target.value)} placeholder="https://..." className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-3 text-sm text-white outline-none transition" />
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <button onClick={addMenuSlot} className="w-full mt-8 py-4 border-2 border-dashed border-emerald-500/30 text-emerald-400 font-bold rounded-xl hover:bg-emerald-500/10 transition flex items-center justify-center group">
                            <i className="fas fa-plus mr-2 group-hover:scale-125 transition-transform"></i>Tambah Slot
                        </button>
                    </div>
                </div>
            );
        };

        // --- 5. KEUANGAN (WD) ---
        const AdminWD = () => (
            <div className="animate-fade-in">
                <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-money-bill-wave text-blue-500 mr-2"></i> Eksekusi Withdrawal (WD)</h2>
                <div className="glass-panel p-8 rounded-2xl border-t-4 border-t-orange-500 text-center">
                    <i className="fas fa-check-circle text-5xl text-emerald-500 mb-4"></i>
                    <h3 className="text-xl font-bold text-white mb-2">Semua Pembayaran Selesai</h3>
                    <p className="text-slate-400 text-sm">Belum ada antrean penarikan dana baru dari jaringan Anda saat ini.</p>
                </div>
            </div>
        );

        // --- STRUKTUR UTAMA APLIKASI ---
        const App = () => {
            const [activeMenu, setActiveMenu] = useState('links'); 
            const [toast, setToast] = useState(null);
            const [pendingCount, setPendingCount] = useState(0);
            const [lastPendingUsers, setLastPendingUsers] = useState([]);
            const showToast = (msg, type) => setToast({ msg, type });

            // Real-time listener untuk notifikasi pendaftar baru
            useEffect(() => {
                if (!window.KreaNovaBackend) return;
                const { db, collection, query, where, onSnapshot } = window.KreaNovaBackend;
                
                const q = query(collection(db, "users"), where("status", "==", "PENDING"));
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const currentPending = [];
                    snapshot.forEach(doc => {
                        currentPending.push(doc.data());
                    });
                    
                    setPendingCount(currentPending.length);

                    // Deteksi jika ada user BARU yang masuk (bukan sekadar data pertama kali diload)
                    if (lastPendingUsers.length > 0 && currentPending.length > lastPendingUsers.length) {
                        // Cari user baru untuk ditampilkan di toast
                        const newUsers = currentPending.filter(cu => !lastPendingUsers.find(lu => lu.userId === cu.userId));
                        if (newUsers.length > 0) {
                            showToast(`Ada pendaftar baru! ${newUsers[0].name} menunggu aktivasi.`, 'success');
                            
                            // Mainkan suara notifikasi
                            try {
                                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                                audio.play().catch(e => console.log("Browser memblokir auto-play suara."));
                            } catch (err) {}
                        }
                    }
                    setLastPendingUsers(currentPending);
                    
                }, (error) => {
                    console.error("Error mendengarkan notifikasi:", error);
                });

                return () => unsubscribe();
            }, [lastPendingUsers]);

            return (
                <div className="h-screen w-full flex bg-[#0b0f19] bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] overflow-hidden">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* SIDEBAR */}
                    <aside className="w-20 lg:w-72 glass-panel border-r border-slate-800/50 flex flex-col z-20">
                        <div className="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-slate-800/50 shrink-0">
                            <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-10 h-10 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.3)] border border-yellow-500/50" onError={(e) => e.target.style.display='none'} />
                            <div className="ml-3 hidden lg:block"><h1 className="font-black text-lg text-white glow-text">KreaNova AI</h1><p className="text-[10px] font-bold text-yellow-500 tracking-widest">Admin Portal</p></div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 flex flex-col gap-2 px-3 custom-scrollbar">
                            <button onClick={() => setActiveMenu('dashboard')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'dashboard' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-chart-pie w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Dashboard</span></button>
                            <button onClick={() => setActiveMenu('network')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'network' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-sitemap w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Pohon Jaringan</span></button>
                            <button onClick={() => setActiveMenu('users')} className={`relative flex items-center p-3 rounded-xl group ${activeMenu === 'users' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="fas fa-users-cog w-6 text-center text-lg"></i>
                                <span className="ml-3 font-semibold hidden lg:block">Database Member</span>
                                {pendingCount > 0 && (
                                    <span className="absolute right-3 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-lg animate-pulse">{pendingCount}</span>
                                )}
                            </button>
                            <button onClick={() => setActiveMenu('links')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'links' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-link w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Manajemen Tautan</span></button>
                            <button onClick={() => setActiveMenu('finance')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'finance' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-money-bill-wave w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Keuangan (WD)</span></button>
                        </nav>
                        <div className="p-4 border-t border-slate-800/50">
                            <button className="w-full flex items-center justify-center lg:justify-start p-3 rounded-xl text-red-400 hover:bg-red-500/10 transition"><i className="fas fa-sign-out-alt w-6 text-center"></i><span className="ml-3 font-semibold hidden lg:block">Keluar</span></button>
                        </div>
                    </aside>
                    
                    {/* AREA UTAMA */}
                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        <header className="h-20 glass-panel border-b border-slate-800/50 flex items-center justify-between px-8 z-10 shrink-0">
                            <div className="flex items-center text-slate-400 text-sm font-medium"><span>Super Admin</span> <i className="fas fa-chevron-right mx-3 text-xs opacity-50"></i> <span className="text-blue-400 capitalize">{activeMenu}</span></div>
                            <div className="flex items-center gap-5">
                                <button onClick={() => { if(pendingCount > 0) setActiveMenu('users'); }} className="text-slate-400 hover:text-white relative transition-colors">
                                    <i className="fas fa-bell text-xl"></i>
                                    {pendingCount > 0 && (
                                        <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full shadow-[0_0_10px_rgba(239,68,68,0.6)] animate-pulse">{pendingCount}</span>
                                    )}
                                </button>
                                <div className="h-8 w-px bg-slate-700"></div>
                                <div className="flex items-center gap-3">
                                    <div className="text-right hidden sm:block"><p className="text-sm font-bold text-white leading-none mb-1">DELTAFORCE</p><p className="text-[10px] text-yellow-500 font-bold uppercase">Founder</p></div>
                                    <div className="w-10 h-10 rounded-full bg-slate-800 border-2 border-slate-600 flex items-center justify-center text-white"><i className="fas fa-user-shield"></i></div>
                                </div>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar pb-32">
                            {activeMenu === 'dashboard' && <DashboardOverview />}
                            {activeMenu === 'network' && <AdminNetworkTree />}
                            {activeMenu === 'users' && <AdminUsers showToast={showToast} />}
                            {activeMenu === 'links' && <AdminLinks showToast={showToast} />}
                            {activeMenu === 'finance' && <AdminWD />}
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
