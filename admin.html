<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI | Super Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glow-text { text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tree-node { display: flex; flex-direction: column; align-items: center; position: relative; padding: 20px 0; transition: all 0.3s; }
        .tree-node::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #334155; width: 0; height: 20px; }
        .tree-root::before { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
        } catch (error) { console.error("Firebase Error:", error); }
        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, deleteDoc, doc, setDoc, getDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            return (
                <div className={`fixed top-5 right-5 ${bgColor} text-white px-6 py-3 rounded-lg shadow-2xl z-[9999] animate-slide-up flex items-center gap-3`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-xl`}></i>
                    <span className="font-semibold text-sm">{message}</span>
                </div>
            );
        };

        // --- DASHBOARD OVERVIEW ---
        const DashboardOverview = () => (
            <div className="animate-fade-in space-y-6">
                <div className="flex justify-between items-end mb-8">
                    <div>
                        <h2 className="text-2xl font-bold text-white mb-1 glow-text">Pusat Komando</h2>
                        <p className="text-sm text-slate-400">Ringkasan performa KreaNova AI secara Real-Time.</p>
                    </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-blue-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Total Member</p><i className="fas fa-users text-blue-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-emerald-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Member Aktif</p><i className="fas fa-user-check text-emerald-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-orange-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Antrean WD</p><i className="fas fa-wallet text-orange-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-yellow-500 shadow-lg">
                        <div className="flex justify-between items-center mb-4"><p className="text-slate-400 text-xs font-bold uppercase">Revenue (Rp)</p><i className="fas fa-chart-line text-yellow-400 text-xl"></i></div>
                        <h3 className="text-3xl font-black text-white">0</h3>
                    </div>
                </div>
            </div>
        );

        // --- POHON JARINGAN ---
        const AdminNetworkTree = () => (
            <div className="animate-fade-in h-full flex flex-col">
                <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-sitemap text-yellow-500 mr-2"></i> Visualisasi Jaringan Binary</h2>
                <div className="glass-panel flex-1 rounded-2xl shadow-lg p-8 flex items-center justify-center overflow-auto custom-scrollbar">
                    <div className="flex flex-col items-center">
                        <div className="tree-node tree-root">
                            <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.5)] border-4 border-yellow-500 z-10">
                                <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-full h-full rounded-full object-cover" onError={(e) => e.target.style.display='none'} />
                            </div>
                            <p className="text-xs font-bold text-yellow-400 mt-2">Master</p>
                        </div>
                        <div className="w-full h-8 border-t-2 border-l-2 border-r-2 border-slate-600 rounded-t-xl mx-auto flex justify-between px-16 relative" style={{width: '300px'}}></div>
                        <div className="flex justify-between w-full" style={{width: '350px'}}>
                            <div className="tree-node"><div className="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-900 z-10 text-white font-bold cursor-pointer hover:scale-110 transition">Kiri</div></div>
                            <div className="tree-node"><div className="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-900 z-10 text-white font-bold cursor-pointer hover:scale-110 transition">Kanan</div></div>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- DATABASE MEMBER ---
        const AdminUsers = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState("");

            useEffect(() => { fetchUsers(); }, []);

            const fetchUsers = async () => {
                setLoading(true);
                if(!window.KreaNovaBackend) return;
                try {
                    const { db, collection, getDocs } = window.KreaNovaBackend;
                    const querySnapshot = await getDocs(collection(db, "users"));
                    const userList = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsers(userList);
                } catch (error) { console.error(error); }
                setLoading(false);
            };

            const handleAction = async (docId, action) => {
                const { db, doc, updateDoc, deleteDoc } = window.KreaNovaBackend;
                try {
                    if (action === 'DELETE') {
                        if(confirm('Data akan hangus. Lanjutkan?')) { await deleteDoc(doc(db, "users", docId)); showToast('Member dihapus permanen!', 'success'); }
                    } else if (action === 'ACTIVE') {
                        await updateDoc(doc(db, "users", docId), { status: "ACTIVE" }); showToast('Akun Member Diaktifkan!', 'success');
                    } else if (action === 'LOCK') {
                        await updateDoc(doc(db, "users", docId), { status: "LOCKED" }); showToast('Akun dikunci demi keamanan.', 'error');
                    }
                    fetchUsers();
                } catch (e) { showToast("Gagal: " + e.message, 'error'); }
            };

            const filteredUsers = users.filter(u => (u.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || (u.email || '').toLowerCase().includes(searchQuery.toLowerCase()));

            return (
                <div className="animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h2 className="text-2xl font-bold text-white"><i className="fas fa-users-cog text-blue-500 mr-2"></i> Database Member</h2>
                        <div className="relative w-full md:w-64"><i className="fas fa-search absolute left-3 top-3 text-slate-500"></i><input type="text" placeholder="Cari nama/email..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-full py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500" /></div>
                    </div>
                    <div className="glass-panel rounded-2xl shadow-lg overflow-hidden custom-scrollbar overflow-x-auto">
                        <table className="w-full text-left text-sm text-slate-300 min-w-[900px]">
                            <thead className="bg-slate-900/80 border-b border-slate-700 text-xs uppercase text-slate-400 font-bold tracking-wider">
                                <tr><th className="px-6 py-5">Profil</th><th className="px-6 py-5">Kontak</th><th className="px-6 py-5">Bank (WD)</th><th className="px-6 py-5 text-center">Status</th><th className="px-6 py-5 text-center">Aksi</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {loading ? (<tr><td colSpan="5" className="text-center py-16"><i className="fas fa-circle-notch fa-spin text-blue-500 text-3xl mb-3"></i><p>Sinkronisasi Database...</p></td></tr>) : filteredUsers.length === 0 ? (<tr><td colSpan="5" className="text-center py-16 text-slate-500">Tidak ada data.</td></tr>) : filteredUsers.map((u) => (
                                    <tr key={u.id} className="hover:bg-slate-800/30 transition group">
                                        <td className="px-6 py-4"><div className="font-bold text-white">{u.name || 'N/A'}</div><div className="text-xs text-slate-400">{u.email || 'N/A'}</div></td>
                                        <td className="px-6 py-4"><div className="text-emerald-400 font-mono text-sm">{u.phone || 'N/A'}</div><div className="text-[10px] text-slate-500">Sponsor: {u.sponsor || 'KREANOVA'}</div></td>
                                        <td className="px-6 py-4"><div className="text-sm font-bold text-yellow-500">{u.bankName || 'Belum diatur'}</div><div className="text-xs font-mono text-slate-300">{u.bankAccount || '-'}</div></td>
                                        <td className="px-6 py-4 text-center"><span className="px-3 py-1.5 rounded-full text-xs font-bold border bg-slate-800 text-white">{u.status || 'PENDING'}</span></td>
                                        <td className="px-6 py-4"><div className="flex justify-center gap-2">
                                            {u.status !== 'ACTIVE' && <button onClick={() => handleAction(u.id, 'ACTIVE')} className="bg-emerald-600 hover:bg-emerald-500 text-white w-8 h-8 rounded-full tooltip" title="Aktifkan"><i className="fas fa-check"></i></button>}
                                            {u.status === 'ACTIVE' && <button onClick={() => handleAction(u.id, 'LOCK')} className="bg-orange-600 hover:bg-orange-500 text-white w-8 h-8 rounded-full tooltip" title="Kunci"><i className="fas fa-lock"></i></button>}
                                            <button onClick={() => handleAction(u.id, 'DELETE')} className="bg-red-600 hover:bg-red-500 text-white w-8 h-8 rounded-full tooltip" title="Hapus"><i className="fas fa-trash"></i></button>
                                        </div></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- CMS TAUTAN ---
        const AdminLinks = ({ showToast }) => {
            const [isSaving, setIsSaving] = useState(false);
            const [tripayLink, setTripayLink] = useState('');
            const [mainMenus, setMainMenus] = useState([
                { id: 1, name: 'Tutorial Penggunaan GenAI', url: '' },
                { id: 2, name: 'Affiliate Produk', url: '' },
                { id: 3, name: 'Drama Short', url: '' },
                { id: 4, name: 'Motivasiku', url: '' },
                { id: 5, name: 'Qur\'an Overlay', url: '' },
                { id: 6, name: 'Animal Creature', url: '' },
                { id: 7, name: 'Animal Human Activity', url: '' }
            ]);

            useEffect(() => {
                const fetchLinks = async () => {
                    if(!window.KreaNovaBackend) return;
                    try {
                        const { db, doc, getDoc } = window.KreaNovaBackend;
                        const docSnap = await getDoc(doc(db, "settings", "global_links"));
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.mainMenus && Array.isArray(data.mainMenus) && data.mainMenus.length > 0) {
                                setMainMenus(data.mainMenus);
                            }
                            if (data.tripayLink) setTripayLink(data.tripayLink);
                        }
                    } catch (e) { console.error("Gagal load link", e); }
                };
                fetchLinks();
            }, []);

            const handleMenuChange = (index, field, value) => {
                const newMenus = [...mainMenus];
                newMenus[index][field] = value;
                setMainMenus(newMenus);
            };

            const addMenuSlot = () => {
                setMainMenus([...mainMenus, { id: Date.now(), name: `Menu Baru ${mainMenus.length + 1}`, url: '' }]);
            };

            const removeMenuSlot = (index) => {
                setMainMenus(mainMenus.filter((_, i) => i !== index));
            };

            const handleSave = async () => {
                setIsSaving(true);
                if(!window.KreaNovaBackend) { showToast('Gagal terhubung ke Firebase', 'error'); setIsSaving(false); return; }
                try {
                    const { db, doc, setDoc } = window.KreaNovaBackend;
                    await setDoc(doc(db, "settings", "global_links"), { mainMenus, tripayLink });
                    showToast('Sukses! Semua link & Tripay berhasil di-deploy.', 'success');
                } catch (e) { showToast('Gagal menyimpan: ' + e.message, 'error'); }
                setIsSaving(false);
            };

            return (
                <div className="animate-fade-in max-w-5xl space-y-6 pb-10">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-4 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-white mb-2"><i className="fas fa-link text-blue-500 mr-2"></i> CMS Tautan Global</h2>
                            <p className="text-sm text-slate-400">Ubah link di sini, dan semua perangkat member akan otomatis berubah seketika.</p>
                        </div>
                        <button onClick={handleSave} disabled={isSaving} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-500/30 transition w-full md:w-auto">
                            {isSaving ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-cloud-upload-alt mr-2"></i>}
                            {isSaving ? 'Menyimpan...' : 'Deploy Perubahan'}
                        </button>
                    </div>

                    {/* KARTU TRIPAY PAYMENT GATEWAY */}
                    <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-lg border-t-4 border-t-blue-500">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center border-b border-slate-700/50 pb-4">
                            <i className="fas fa-credit-card text-blue-400 mr-3"></i> Payment Gateway (Tripay)
                        </h3>
                        <div className="bg-slate-900/50 p-5 rounded-xl border border-slate-700 transition-all hover:border-blue-500/50 shadow-sm">
                            <label className="text-xs font-bold text-blue-400 uppercase tracking-wider block mb-1">Link URL Payment Tripay</label>
                            <p className="text-[10px] text-slate-400 mb-4">Tautan ini akan diarahkan secara otomatis saat calon member mengklik tombol daftar/bayar.</p>
                            <input type="text" value={tripayLink} onChange={(e) => setTripayLink(e.target.value)} placeholder="https://tripay.co.id/checkout/..." className="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-lg p-3 text-sm text-white outline-none" />
                        </div>
                    </div>

                    {/* KARTU MENU UTAMA (TANPA HUB AI) */}
                    <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-lg border-t-4 border-t-emerald-500">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center justify-between border-b border-slate-700/50 pb-4">
                            <div><i className="fas fa-th-list text-emerald-400 mr-2"></i> 10 Menu Utama KreaNova AI</div>
                            <span className="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold">{mainMenus.length} Slot Aktif</span>
                        </h3>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {mainMenus.map((menu, index) => (
                                <div key={menu.id} className="bg-slate-900/50 p-5 rounded-xl border border-slate-700 relative group transition-all hover:border-emerald-500/50 shadow-sm">
                                    {mainMenus.length > 1 && (
                                        <button onClick={() => removeMenuSlot(index)} className="absolute -top-3 -right-3 bg-red-500 text-white w-7 h-7 rounded-full text-xs shadow-lg opacity-0 group-hover:opacity-100 transition hover:bg-red-600 z-10 tooltip" title="Hapus Slot">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    )}
                                    <div className="mb-4">
                                        <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-1">Nama Slot {index + 1}</label>
                                        <input type="text" value={menu.name} onChange={(e) => handleMenuChange(index, 'name', e.target.value)} className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-3 text-sm text-white outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Link URL</label>
                                        <input type="text" value={menu.url} onChange={(e) => handleMenuChange(index, 'url', e.target.value)} placeholder="https://..." className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-3 text-sm text-white outline-none" />
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <button onClick={addMenuSlot} className="w-full mt-8 py-4 border-2 border-dashed border-emerald-500/30 text-emerald-400 font-bold rounded-xl hover:bg-emerald-500/10 transition flex items-center justify-center group">
                            <i className="fas fa-plus mr-2"></i>Tambah Slot Baru
                        </button>
                    </div>
                </div>
            );
        };

        // --- KEUANGAN (WD) ---
        const AdminWD = () => (
            <div className="animate-fade-in">
                <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-money-bill-wave text-blue-500 mr-2"></i> Eksekusi Withdrawal (WD)</h2>
                <div className="glass-panel p-8 rounded-2xl border-t-4 border-t-orange-500 text-center">
                    <i className="fas fa-check-circle text-5xl text-emerald-500 mb-4"></i>
                    <h3 className="text-xl font-bold text-white mb-2">Semua Pembayaran Selesai</h3>
                    <p className="text-slate-400 text-sm">Belum ada antrean penarikan dana baru dari jaringan Anda saat ini.</p>
                </div>
            </div>
        );

        // --- STRUKTUR UTAMA APLIKASI ---
        const App = () => {
            const [activeMenu, setActiveMenu] = useState('links'); 
            const [toast, setToast] = useState(null);
            const showToast = (msg, type) => setToast({ msg, type });

            return (
                <div className="h-screen w-full flex bg-[#0b0f19] bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] overflow-hidden">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    
                    <aside className="w-20 lg:w-72 glass-panel border-r border-slate-800/50 flex flex-col z-20">
                        <div className="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-slate-800/50 shrink-0">
                            <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-10 h-10 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.3)] border border-yellow-500/50" onError={(e) => e.target.style.display='none'} />
                            <div className="ml-3 hidden lg:block"><h1 className="font-black text-lg text-white glow-text">KreaNova AI</h1><p className="text-[10px] font-bold text-yellow-500 tracking-widest">Admin Portal</p></div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 flex flex-col gap-2 px-3 custom-scrollbar">
                            <button onClick={() => setActiveMenu('dashboard')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'dashboard' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-chart-pie w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Dashboard</span></button>
                            <button onClick={() => setActiveMenu('network')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'network' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-sitemap w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Pohon Jaringan</span></button>
                            <button onClick={() => setActiveMenu('users')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'users' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-users-cog w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Database Member</span></button>
                            <button onClick={() => setActiveMenu('links')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'links' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-link w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Manajemen Tautan</span></button>
                            <button onClick={() => setActiveMenu('finance')} className={`flex items-center p-3 rounded-xl group ${activeMenu === 'finance' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fas fa-money-bill-wave w-6 text-center text-lg"></i><span className="ml-3 font-semibold hidden lg:block">Keuangan (WD)</span></button>
                        </nav>
                        <div className="p-4 border-t border-slate-800/50">
                            <button className="w-full flex items-center justify-center lg:justify-start p-3 rounded-xl text-red-400 hover:bg-red-500/10 transition"><i className="fas fa-sign-out-alt w-6 text-center"></i><span className="ml-3 font-semibold hidden lg:block">Keluar</span></button>
                        </div>
                    </aside>
                    
                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        <header className="h-20 glass-panel border-b border-slate-800/50 flex items-center justify-between px-8 z-10 shrink-0">
                            <div className="flex items-center text-slate-400 text-sm font-medium"><span>Super Admin</span> <i className="fas fa-chevron-right mx-3 text-xs opacity-50"></i> <span className="text-blue-400 capitalize">{activeMenu}</span></div>
                            <div className="flex items-center gap-5">
                                <button className="text-slate-400 hover:text-white relative"><i className="fas fa-bell text-xl"></i><span className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
                                <div className="h-8 w-px bg-slate-700"></div>
                                <div className="flex items-center gap-3">
                                    <div className="text-right hidden sm:block"><p className="text-sm font-bold text-white leading-none mb-1">Ilyas Hak</p><p className="text-[10px] text-yellow-500 font-bold uppercase">Founder</p></div>
                                    <div className="w-10 h-10 rounded-full bg-slate-800 border-2 border-slate-600 flex items-center justify-center text-white"><i className="fas fa-user-shield"></i></div>
                                </div>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar pb-32">
                            {activeMenu === 'dashboard' && <DashboardOverview />}
                            {activeMenu === 'network' && <AdminNetworkTree />}
                            {activeMenu === 'users' && <AdminUsers showToast={showToast} />}
                            {activeMenu === 'links' && <AdminLinks showToast={showToast} />}
                            {activeMenu === 'finance' && <AdminWD />}
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
