<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #cbd5e1; margin: 0; padding: 0; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-text { text-shadow: 0 0 12px rgba(59, 130, 246, 0.5); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // PERBAIKAN: Mengambil Auth untuk membuat akun member secara manual dari panel admin
        import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            // PERBAIKAN: Membuka Aplikasi Firebase Kedua (Secondary) Khusus untuk Pendaftaran Manual. 
            // Ini MENCEGAH Admin ter-logout saat membuatkan akun Firebase untuk member baru!
            const secondaryApp = initializeApp(firebaseConfig, "SecondaryAdminApp");
            const secondaryAuth = getAuth(secondaryApp);

            window.KreaNovaBackend = { db, collection, query, where, onSnapshot, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc, serverTimestamp, secondaryAuth, createUserWithEmailAndPassword, signOut };
        } catch (error) {
            console.error("Firebase Admin Error:", error);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgClass = type === 'error' ? 'bg-red-500' : type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600';

            return (
                <div className={`fixed top-5 right-5 z-50 ${bgClass} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 animate-slide-up max-w-[90vw]`}>
                    <i className={`fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i>
                    <span className="text-xs font-bold leading-tight">{message}</span>
                    <button onClick={onClose} className="ml-3 text-white/80 hover:text-white"><i className="fas fa-times"></i></button>
                </div>
            );
        };

        const DashboardOverview = () => {
            const [stats, setStats] = useState({ totalMembers: 0, activeMembers: 0, revenue: 0, pendingWD: 0 });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!window.KreaNovaBackend) return;
                const { db, collection, onSnapshot, query, where, doc, deleteDoc } = window.KreaNovaBackend;

                const unsubUsers = onSnapshot(collection(db, "users"), (snapshot) => {
                    let total = snapshot.size;
                    let active = 0;
                    let rev = 0;
                    const now = new Date().getTime();

                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        
                        // Fitur Auto-Delete 24 Jam untuk yang Pending
                        if (data.status === 'PENDING' && data.createdAt) {
                            const createdTime = new Date(data.createdAt).getTime();
                            if (now - createdTime > 86400000) { 
                                deleteDoc(doc(db, "users", docSnap.id)).catch(e => console.error("Auto-delete error:", e));
                                total -= 1;
                                return;
                            }
                        }

                        if (data.status === 'ACTIVE') {
                            active += 1;
                            rev += (data.billAmount || 150000);
                        }
                    });

                    setStats(prev => ({ ...prev, totalMembers: total, activeMembers: active, revenue: rev }));
                    setLoading(false);
                }, (err) => { console.error(err); setLoading(false); });

                const qWD = query(collection(db, "withdrawals"), where("status", "==", "PENDING"));
                const unsubWD = onSnapshot(qWD, (snapshot) => {
                    setStats(prev => ({ ...prev, pendingWD: snapshot.size }));
                });

                return () => { unsubUsers(); unsubWD(); };
            }, []);

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-white tracking-wide">Pusat Komando</h2>
                            <p className="text-slate-400 text-xs mt-1">Gambaran umum performa sistem KreaNova AI secara real-time.</p>
                        </div>
                        <div className="bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-xl flex items-center justify-center space-x-2 text-xs text-emerald-400 shadow-sm">
                            <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                            <span className="font-semibold">Sistem Berjalan Normal</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-blue-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Member</p>
                                    <h3 className="text-2xl font-black text-white mt-2">{loading ? '...' : stats.totalMembers}</h3>
                                </div>
                                <div className="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400 border border-blue-500/20">
                                    <i className="fas fa-users text-lg"></i>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-emerald-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Member Aktif</p>
                                    <h3 className="text-2xl font-black text-white mt-2">{loading ? '...' : stats.activeMembers}</h3>
                                </div>
                                <div className="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center text-emerald-400 border border-emerald-500/20">
                                    <i className="fas fa-user-check text-lg"></i>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-yellow-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Revenue Pendaftaran</p>
                                    <h3 className="text-xl font-black text-white mt-2">{loading ? '...' : formatIDR(stats.revenue)}</h3>
                                </div>
                                <div className="w-10 h-10 bg-yellow-500/10 rounded-xl flex items-center justify-center text-yellow-400 border border-yellow-500/20">
                                    <i className="fas fa-coins text-lg"></i>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-5 rounded-2xl border-t-4 border-t-purple-500 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-wider">Antrean WD</p>
                                    <h3 className="text-2xl font-black text-white mt-2">{loading ? '...' : stats.pendingWD}</h3>
                                </div>
                                <div className="w-10 h-10 bg-purple-500/10 rounded-xl flex items-center justify-center text-purple-400 border border-purple-500/20">
                                    <i className="fas fa-wallet text-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // PERBAIKAN: Fitur Baru - Posting Manual Member menggantikan Visual Pohon Jaringan yang berat
        const AdminManualPost = ({ showToast }) => {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [phone, setPhone] = useState('');
            const [password, setPassword] = useState('');
            const [sponsor, setSponsor] = useState('');
            const [upline, setUpline] = useState('');
            const [position, setPosition] = useState('KIRI');
            const [status, setStatus] = useState('ACTIVE'); // Bebas pilih Aktif atau Pending
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                try {
                    const { db, setDoc, doc, secondaryAuth, createUserWithEmailAndPassword, signOut } = window.KreaNovaBackend;
                    
                    // 1. Buat Akun Autentikasi Menggunakan Secondary App (Agar Admin Tidak Ter-Logout)
                    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                    await signOut(secondaryAuth); // Langsung keluarkan dari secondary app
                    
                    // 2. Siapkan Data Database
                    const newUid = cred.user.uid;
                    const refCode = "KN" + Math.floor(10000 + Math.random() * 90000);
                    const billAmount = 150000 + Math.floor(Math.random() * 900) + 100;
                    
                    const userData = {
                        userId: newUid,
                        name: name, 
                        email: email, 
                        phone: phone,
                        sponsor: sponsor.toUpperCase(),
                        upline: upline.toUpperCase(),
                        sponsorLeg: position,
                        position: position,
                        referralCode: refCode,
                        billAmount: billAmount,
                        walletAvailable: 0, leftDirects: 0, rightDirects: 0,
                        isQualified: false, qualifiedPairs: 0, bankName: "", bankAccount: "",
                        status: status, 
                        createdAt: new Date().toISOString()
                    };
                    
                    // 3. Simpan ke Firestore Database
                    await setDoc(doc(db, "users", newUid), userData);
                    showToast(`Berhasil! ${name} diposting di kaki ${position} di bawah ID ${upline.toUpperCase()}`, "success");
                    
                    // Bersihkan Form
                    setName(''); setEmail(''); setPhone(''); setPassword('');
                    setSponsor(''); setUpline(''); setPosition('KIRI'); setStatus('ACTIVE');
                    
                } catch (error) {
                    showToast("Gagal Memposting: " + error.message, "error");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <div>
                        <h2 className="text-xl md:text-2xl font-bold text-white tracking-wide"><i className="fas fa-user-plus text-emerald-500 mr-2"></i> Posting Member Manual</h2>
                        <p className="text-slate-400 text-xs mt-1">Gunakan fitur ini untuk menempatkan akun member baru di kedalaman struktur secara akurat.</p>
                    </div>

                    <div className="glass-panel p-6 md:p-8 rounded-2xl border-t-4 border-t-emerald-500 shadow-xl max-w-3xl mx-auto">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            
                            <div className="col-span-1 md:col-span-2 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-2">
                                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest mb-4"><i className="fas fa-sitemap mr-2 text-blue-400"></i> Penempatan Jaringan</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Kode Referral (Sponsor)</label>
                                        <input type="text" required value={sponsor} onChange={e => setSponsor(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-yellow-500 font-mono rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none" placeholder="ID Sponsor (Contoh: KN12345)" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Kode Upline (Penempatan)</label>
                                        <input type="text" required value={upline} onChange={e => setUpline(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-blue-400 font-mono rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none" placeholder="ID Tempat Menempel" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Posisi Kaki</label>
                                        <select value={position} onChange={e => setPosition(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none appearance-none">
                                            <option value="KIRI">Tim Kiri (Left)</option>
                                            <option value="KANAN">Tim Kanan (Right)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Status Aktivasi</label>
                                        <select value={status} onChange={e => setStatus(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-emerald-400 font-bold rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none appearance-none">
                                            <option value="ACTIVE">Langsung Aktif (ACTIVE)</option>
                                            <option value="PENDING">Menunggu Bayar (PENDING)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="col-span-1 md:col-span-2 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest mb-4"><i className="fas fa-id-card mr-2 text-purple-400"></i> Biodata Akun Baru</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Nama Lengkap</label>
                                        <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none" placeholder="Masukkan nama..." />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">No WhatsApp</label>
                                        <input type="tel" required value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none" placeholder="08..." />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Email Aktif</label>
                                        <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none" placeholder="email@gmail.com" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Password</label>
                                        <input type="text" required value={password} onChange={e => setPassword(e.target.value)} minLength="6" className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none" placeholder="Minimal 6 Karakter" />
                                    </div>
                                </div>
                            </div>
                            
                            <div className="col-span-1 md:col-span-2 pt-2">
                                <button type="submit" disabled={isSubmitting} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/30 transition transform hover:-translate-y-0.5">
                                    {isSubmitting ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : <><i className="fas fa-cloud-upload-alt mr-2"></i> Eksekusi Posting Jaringan</>}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const AdminUsers = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!window.KreaNovaBackend) return;
                const { db, collection, onSnapshot } = window.KreaNovaBackend;

                const unsub = onSnapshot(collection(db, "users"), (snapshot) => {
                    const list = [];
                    snapshot.forEach(docSnap => { list.push({ id: docSnap.id, ...docSnap.data() }); });
                    list.sort((a, b) => {
                        if (a.status === 'PENDING' && b.status !== 'PENDING') return -1;
                        if (a.status !== 'PENDING' && b.status === 'PENDING') return 1;
                        return new Date(b.createdAt) - new Date(a.createdAt);
                    });
                    setUsers(list); setLoading(false);
                }, (err) => { console.error(err); setLoading(false); });

                return () => unsub();
            }, []);

            // PERBAIKAN: Fitur Backup / Export Database ke CSV
            const handleExportCSV = () => {
                let csv = "Nama Lengkap,Email,No WhatsApp,Sponsor,Upline,Posisi,ID Referral,Status,Saldo Tersedia\n";
                users.forEach(u => {
                    // Escape data dengan kutip ganda agar koma di dalam teks tidak merusak kolom
                    csv += `"${u.name}","${u.email}","${u.phone}","${u.sponsor || ''}","${u.upline || ''}","${u.position || ''}","${u.referralCode}","${u.status}","${u.walletAvailable || 0}"\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Backup_Member_KreaNova_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
                showToast("Berhasil mendownload Backup CSV (Excel)!", "success");
            };

            // PERBAIKAN: Fitur Backup / Export Database ke HTML
            const handleExportHTML = () => {
                let html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Backup Data Member KreaNova AI</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
                        h2 { color: #333; text-align: center; }
                        table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
                        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
                        th { background-color: #297839; color: white; }
                        tr:nth-child(even) { background-color: #f9f9f9; }
                        .status-active { color: #10b981; font-weight: bold; }
                        .status-pending { color: #f59e0b; font-weight: bold; }
                        .status-blocked { color: #ef4444; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h2>Database Member KreaNova AI<br><small>Diekstrak pada: ${new Date().toLocaleString('id-ID')}</small></h2>
                    <table>
                        <tr><th>Nama</th><th>Email</th><th>No WhatsApp</th><th>Sponsor</th><th>Upline</th><th>Posisi</th><th>ID Referral</th><th>Status</th><th>Saldo (Rp)</th></tr>
                `;
                users.forEach(u => {
                    const statusClass = u.status === 'ACTIVE' ? 'status-active' : u.status === 'PENDING' ? 'status-pending' : 'status-blocked';
                    html += `<tr>
                        <td>${u.name}</td><td>${u.email}</td><td>${u.phone}</td>
                        <td>${u.sponsor || '-'}</td><td>${u.upline || '-'}</td><td>${u.position || '-'}</td>
                        <td><b>${u.referralCode}</b></td><td class="${statusClass}">${u.status}</td><td>${new Intl.NumberFormat('id-ID').format(u.walletAvailable || 0)}</td>
                    </tr>`;
                });
                html += `
                    </table>
                </body>
                </html>
                `;
                const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Backup_Member_KreaNova_${new Date().toISOString().split('T')[0]}.html`;
                link.click();
                showToast("Berhasil mendownload Backup HTML!", "success");
            };

            const handleActivate = async (user) => {
                try {
                    const { db, doc, updateDoc, collection, query, where, getDocs } = window.KreaNovaBackend;
                    
                    await updateDoc(doc(db, "users", user.id), { status: "ACTIVE" });

                    if (user.sponsor && user.sponsor !== 'KREANOVA') {
                        const qSponsor = query(collection(db, "users"), where("referralCode", "==", user.sponsor));
                        const snapSponsor = await getDocs(qSponsor);
                        
                        snapSponsor.forEach(async (spDoc) => {
                            const spData = spDoc.data();
                            let newLeft = spData.leftDirects || 0;
                            let newRight = spData.rightDirects || 0;
                            const legToIncrement = user.sponsorLeg || user.position;
                            if (legToIncrement === 'KIRI') newLeft += 1;
                            if (legToIncrement === 'KANAN') newRight += 1;

                            const oldPairs = Math.floor(Math.min(spData.leftDirects || 0, spData.rightDirects || 0) / 5);
                            const newPairs = Math.floor(Math.min(newLeft, newRight) / 5);
                            
                            let qualifiedBonus = 0;
                            if (newPairs > oldPairs) qualifiedBonus = (newPairs - oldPairs) * 50000;

                            const newWallet = (spData.walletAvailable || 0) + 40000 + qualifiedBonus;
                            const isQual = newPairs > 0;

                            await updateDoc(doc(db, "users", spDoc.id), {
                                walletAvailable: newWallet,
                                leftDirects: newLeft,
                                rightDirects: newRight,
                                isQualified: isQual,
                                qualifiedPairs: newPairs
                            });
                        });
                    }

                    const list = [];
                    snapshot.forEach(docSnap => {
                        list.push({ id: docSnap.id, ...docSnap.data() });

                </div>
            )
        };

        const AdminLogin = ({ onLogin }) => {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (username === 'admin' && password === 'admin1980') {
                    onLogin();
                } else {
                    setError('Username atau Password salah!');
                }
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center bg-[#0b0f19] p-4 relative overflow-hidden">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-[#0b0f19] to-[#0b0f19] z-0"></div>
                    <div className="glass-panel p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md border-t-4 border-t-blue-500 animate-slide-up relative z-10">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 md:w-20 md:h-20 bg-slate-800 rounded-full flex items-center justify-center border border-yellow-500/50 mx-auto mb-4 shadow-[0_0_20px_rgba(250,204,21,0.2)]">
                                <i className="fas fa-user-shield text-2xl md:text-3xl text-yellow-500"></i>
                            </div>
                            <h2 className="text-xl md:text-2xl font-bold text-white glow-text mb-1">Portal Admin</h2>
                            <p className="text-xs md:text-sm text-slate-400">Silakan login untuk mengakses sistem</p>
                        </div>
                        {error && (
                            <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs md:text-sm p-3 rounded-xl mb-6 text-center flex items-center justify-center animate-fade-in"><i className="fas fa-exclamation-circle mr-2"></i>{error}</div>
                        )}
                        <form onSubmit={handleSubmit} className="space-y-4 md:space-y-5">
                            <div>
                                <label className="text-[10px] md:text-xs font-bold text-slate-400 uppercase block mb-1.5 md:mb-2"><i className="fas fa-user mr-1"></i> Username</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 md:py-3.5 text-sm text-white outline-none transition" placeholder="Masukkan username" required />
                            </div>
                            <div>
                                <label className="text-[10px] md:text-xs font-bold text-slate-400 uppercase block mb-1.5 md:mb-2"><i className="fas fa-lock mr-1"></i> Password</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 md:py-3.5 text-sm text-white outline-none transition" placeholder="••••••••" required />
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-lg shadow-blue-500/30 mt-4 md:mt-6 transition transform hover:-translate-y-0.5 text-sm md:text-base">
                                Masuk ke Dasbor
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(sessionStorage.getItem('adminLoggedIn') === 'true');
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [pendingCount, setPendingCount] = useState(0);
            
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const showToast = (msg, type) => setToast({ msg, type });
            const handleLogin = () => { sessionStorage.setItem('adminLoggedIn', 'true'); setIsLoggedIn(true); };
            const handleLogout = () => { sessionStorage.removeItem('adminLoggedIn'); setIsLoggedIn(false); };

            useEffect(() => {
                if (!window.KreaNovaBackend || !isLoggedIn) return;
                const { db, collection, query, where, onSnapshot } = window.KreaNovaBackend;
                const q = query(collection(db, "users"), where("status", "==", "PENDING"));
                const unsubscribe = onSnapshot(q, (snapshot) => { setPendingCount(snapshot.size); }, (error) => { console.error(error); });
                return () => unsubscribe();
            }, [isLoggedIn]);

            if (!isLoggedIn) return <AdminLogin onLogin={handleLogin} />;

            return (
                <div className="h-[100dvh] w-full flex bg-[#0b0f19] overflow-hidden relative">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}

                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 md:hidden animate-fade-in"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    <aside className={`absolute md:relative top-0 left-0 h-full w-64 md:w-72 bg-[#0d1323]/95 backdrop-blur-xl border-r border-slate-800 flex flex-col z-40 shadow-2xl shrink-0 transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-5 md:p-6 border-b border-slate-800 flex items-center justify-between md:justify-start space-x-4">
                            <div className="flex items-center space-x-3 md:space-x-4">
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-slate-900 rounded-xl border border-yellow-500/30 flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.2)]">
                                    <i className="fas fa-robot text-xl md:text-2xl text-yellow-500"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg md:text-xl font-bold text-white tracking-wide glow-text">KreaNova AI</h1>
                                    <p className="text-[9px] md:text-[10px] font-bold text-yellow-500 uppercase tracking-widest mt-0.5">Admin Portal</p>
                                </div>
                            </div>
                            <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-white p-2">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>

                        <nav className="flex-1 p-3 md:p-4 space-y-1.5 md:space-y-2 overflow-y-auto custom-scrollbar">
                            <button onClick={() => { setActiveMenu('dashboard'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-chart-pie w-6"></i> Dashboard
                            </button>
                            <button onClick={() => { setActiveMenu('manual_post'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'manual_post' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-user-plus w-6"></i> Posting Manual
                            </button>
                            <button onClick={() => { setActiveMenu('users'); setIsSidebarOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'users' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <div className="flex items-center"><i className="fas fa-users w-6"></i> Database Member</div>
                                {pendingCount > 0 && <span className="bg-red-500 text-white text-[9px] md:text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse">{pendingCount}</span>}
                            </button>
                            <button onClick={() => { setActiveMenu('links'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'links' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-link w-6"></i> Manajemen Tautan
                            </button>
                            <button onClick={() => { setActiveMenu('wd'); setIsSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-xs md:text-sm font-semibold transition-all duration-200 ${activeMenu === 'wd' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}>
                                <i className="fas fa-money-bill-wave w-6"></i> Keuangan (WD)
                            </button>
                        </nav>

                        <div className="p-3 md:p-4 border-t border-slate-800">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 bg-slate-800/50 hover:bg-red-500/20 text-slate-400 hover:text-red-400 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all border border-transparent hover:border-red-500/30">
                                <i className="fas fa-sign-out-alt"></i> <span>Keluar</span>
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 w-full relative">
                        <header className="h-16 md:h-20 border-b border-slate-800 flex items-center justify-between px-4 md:px-8 bg-[#0b0f19]/80 backdrop-blur-md z-10 shrink-0">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden text-slate-300 hover:text-white bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                                    <i className="fas fa-bars text-lg"></i>
                                </button>
                                <div className="text-slate-400 text-xs md:text-sm font-medium hidden sm:block">
                                    <span className="text-blue-500">Super Admin</span> <i className="fas fa-chevron-right text-[10px] mx-2 opacity-50"></i> <span className="capitalize">{activeMenu === 'wd' ? 'Keuangan' : activeMenu.replace('_', ' ')}</span>
                                </div>
                            </div>

                            <div className="flex items-center space-x-4 md:space-x-6">
                                <div className="relative cursor-pointer" onClick={() => setActiveMenu('users')}>
                                    <i className="fas fa-bell text-slate-400 text-lg md:text-xl hover:text-white transition"></i>
                                    {pendingCount > 0 && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 md:w-3 md:h-3 bg-red-500 rounded-full border-2 border-[#0b0f19] animate-pulse"></span>}
                                </div>
                                <div className="flex items-center space-x-2 md:space-x-3 pl-4 md:pl-6 border-l border-slate-700">
                                    <div className="text-right hidden sm:block">
                                        <p className="text-xs md:text-sm font-bold text-white">DELTAFORCE</p>
                                        <p className="text-[9px] md:text-[10px] text-yellow-500 font-bold uppercase tracking-wider">Founder</p>
                                    </div>
                                    <div className="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-tr from-slate-700 to-slate-600 rounded-full flex items-center justify-center border border-slate-500 shadow-sm">
                                        <i className="fas fa-user-shield text-white text-xs md:text-sm"></i>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                            <div className="max-w-7xl mx-auto pb-8">
                                {activeMenu === 'dashboard' && <DashboardOverview />}
                                {activeMenu === 'manual_post' && <AdminManualPost showToast={showToast} />}
                                {activeMenu === 'users' && <AdminUsers showToast={showToast} />}
                                {activeMenu === 'links' && <AdminLinks showToast={showToast} />}
                                {activeMenu === 'wd' && <AdminWD showToast={showToast} />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
