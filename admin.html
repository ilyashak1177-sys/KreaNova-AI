<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI | Super Admin V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glow-text { text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* MLM Tree CSS */
        .tree-node { display: flex; flex-direction: column; items-center; position: relative; padding: 20px 0; transition: all 0.3s; }
        .tree-node::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #334155; width: 0; height: 20px; }
        .tree-root::before { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
        } catch (error) { console.error("Firebase Error:", error); }
        window.KreaNovaBackend = { auth, db, collection, getDocs, updateDoc, deleteDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTS ---

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            return (
                <div className={`fixed top-5 right-5 ${bgColor} text-white px-6 py-3 rounded-lg shadow-2xl z-50 animate-slide-up flex items-center gap-3`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-xl`}></i>
                    <span className="font-semibold text-sm">{message}</span>
                </div>
            );
        };

        const DashboardOverview = () => (
            <div className="animate-fade-in space-y-6">
                <div className="flex justify-between items-end mb-8">
                    <div>
                        <h2 className="text-2xl font-bold text-white mb-1 glow-text">Pusat Komando</h2>
                        <p className="text-sm text-slate-400">Ringkasan performa KreaNova AI secara Real-Time.</p>
                    </div>
                    <button className="bg-yellow-500/10 text-yellow-500 border border-yellow-500/30 px-4 py-2 rounded-lg text-sm font-bold hover:bg-yellow-500 hover:text-slate-900 transition"><i className="fas fa-sync-alt mr-2"></i>Refresh Data</button>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div className="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                        <div className="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/20 rounded-full blur-xl group-hover:bg-blue-500/30 transition"></div>
                        <div className="flex justify-between items-center mb-4">
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider">Total Member</p>
                            <i className="fas fa-users text-blue-400 text-xl"></i>
                        </div>
                        <h3 className="text-4xl font-black text-white">1,204</h3>
                        <p className="text-xs text-emerald-400 mt-2"><i className="fas fa-arrow-up mr-1"></i>+12 minggu ini</p>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                        <div className="absolute -right-4 -top-4 w-24 h-24 bg-emerald-500/20 rounded-full blur-xl group-hover:bg-emerald-500/30 transition"></div>
                        <div className="flex justify-between items-center mb-4">
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider">Member Aktif</p>
                            <i className="fas fa-user-check text-emerald-400 text-xl"></i>
                        </div>
                        <h3 className="text-4xl font-black text-white">856</h3>
                        <p className="text-xs text-emerald-400 mt-2"><i className="fas fa-arrow-up mr-1"></i>71% conversion rate</p>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                        <div className="absolute -right-4 -top-4 w-24 h-24 bg-orange-500/20 rounded-full blur-xl group-hover:bg-orange-500/30 transition"></div>
                        <div className="flex justify-between items-center mb-4">
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider">Antrean WD</p>
                            <i className="fas fa-wallet text-orange-400 text-xl"></i>
                        </div>
                        <h3 className="text-4xl font-black text-white">5</h3>
                        <p className="text-xs text-orange-400 mt-2">Menunggu diproses</p>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                        <div className="absolute -right-4 -top-4 w-24 h-24 bg-yellow-500/20 rounded-full blur-xl group-hover:bg-yellow-500/30 transition"></div>
                        <div className="flex justify-between items-center mb-4">
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider">Revenue Jaringan</p>
                            <i className="fas fa-chart-line text-yellow-400 text-xl"></i>
                        </div>
                        <h3 className="text-3xl font-black text-white">Rp 12.4M</h3>
                        <p className="text-xs text-emerald-400 mt-2"><i className="fas fa-arrow-up mr-1"></i>Bulan ini</p>
                    </div>
                </div>
            </div>
        );

        const AdminUsers = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState("");

            useEffect(() => { fetchUsers(); }, []);

            const fetchUsers = async () => {
                setLoading(true);
                if(!window.KreaNovaBackend) {
                    setTimeout(() => setLoading(false), 1000);
                    return;
                }
                try {
                    const { db, collection, getDocs } = window.KreaNovaBackend;
                    const querySnapshot = await getDocs(collection(db, "users"));
                    const userList = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsers(userList);
                } catch (error) { console.error(error); }
                setLoading(false);
            };

            const handleAction = async (docId, action) => {
                const { db, doc, updateDoc, deleteDoc } = window.KreaNovaBackend;
                try {
                    if (action === 'DELETE') {
                        if(confirm('Data akan hangus. Lanjutkan?')) {
                            await deleteDoc(doc(db, "users", docId));
                            showToast('Member dihapus permanen!', 'success');
                        }
                    } else if (action === 'ACTIVE') {
                        await updateDoc(doc(db, "users", docId), { status: "ACTIVE" });
                        showToast('Akun Member Diaktifkan!', 'success');
                    } else if (action === 'LOCK') {
                        await updateDoc(doc(db, "users", docId), { status: "LOCKED" });
                        showToast('Akun dikunci demi keamanan.', 'error');
                    }
                    fetchUsers();
                } catch (e) { showToast("Gagal: " + e.message, 'error'); }
            };

            const filteredUsers = users.filter(u => 
                (u.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
                (u.email || '').toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h2 className="text-2xl font-bold text-white"><i className="fas fa-database text-blue-500 mr-2"></i> Database Member</h2>
                        <div className="relative w-full md:w-64">
                            <i className="fas fa-search absolute left-3 top-3 text-slate-500"></i>
                            <input 
                                type="text" 
                                placeholder="Cari nama atau email..." 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 text-white rounded-full py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500 transition"
                            />
                        </div>
                    </div>
                    
                    <div className="glass-panel rounded-2xl shadow-lg overflow-hidden custom-scrollbar overflow-x-auto">
                        <table className="w-full text-left text-sm text-slate-300 min-w-[900px]">
                            <thead className="bg-slate-900/80 border-b border-slate-700 text-xs uppercase text-slate-400 font-bold tracking-wider">
                                <tr>
                                    <th className="px-6 py-5">Profil Member</th>
                                    <th className="px-6 py-5">Kontak & Keamanan</th>
                                    <th className="px-6 py-5">Data Pencairan (Bank)</th>
                                    <th className="px-6 py-5 text-center">Status Jaringan</th>
                                    <th className="px-6 py-5 text-center">Tindakan Admin</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {loading ? (<tr><td colSpan="5" className="text-center py-16"><i className="fas fa-circle-notch fa-spin text-blue-500 text-3xl mb-3"></i><p>Sinkronisasi Database...</p></td></tr>) : 
                                 filteredUsers.length === 0 ? (<tr><td colSpan="5" className="text-center py-16 text-slate-500">Tidak ada data ditemukan.</td></tr>) :
                                 filteredUsers.map((u) => (
                                    <tr key={u.id} className="hover:bg-slate-800/30 transition duration-150 group">
                                        <td className="px-6 py-4">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-white font-bold shadow-lg">
                                                    {(u.name || 'U').charAt(0).toUpperCase()}
                                                </div>
                                                <div>
                                                    <div className="font-bold text-white text-base">{u.name || 'N/A'}</div>
                                                    <div className="text-xs text-slate-400 mt-0.5">{u.email || 'N/A'}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="text-emerald-400 font-mono text-sm mb-1"><i className="fab fa-whatsapp mr-1"></i>{u.phone || 'N/A'}</div>
                                            <div className="text-[10px] text-slate-500">Sponsor: <span className="text-blue-400 font-bold">{u.sponsor || 'KREANOVA'}</span></div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="text-sm font-bold text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded inline-block mb-1">{u.bankName || 'Belum diatur'}</div>
                                            <div className="text-xs font-mono text-slate-300">{u.bankAccount || '---'}</div>
                                        </td>
                                        <td className="px-6 py-4 text-center">
                                            <span className={`px-3 py-1.5 rounded-full text-xs font-bold border ${u.status === 'ACTIVE' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : u.status === 'LOCKED' ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-orange-500/10 text-orange-400 border-orange-500/20'}`}>
                                                <i className={`fas ${u.status === 'ACTIVE' ? 'fa-check-circle' : u.status === 'LOCKED' ? 'fa-lock' : 'fa-clock'} mr-1`}></i>
                                                {u.status || 'PENDING'}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="flex justify-center gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                                {u.status !== 'ACTIVE' && <button onClick={() => handleAction(u.id, 'ACTIVE')} className="bg-emerald-600 hover:bg-emerald-500 text-white w-8 h-8 rounded-full shadow-lg tooltip" title="Aktifkan"><i className="fas fa-check"></i></button>}
                                                {u.status === 'ACTIVE' && <button onClick={() => handleAction(u.id, 'LOCK')} className="bg-orange-600 hover:bg-orange-500 text-white w-8 h-8 rounded-full shadow-lg tooltip" title="Kunci Akun"><i className="fas fa-lock"></i></button>}
                                                <button onClick={() => showToast('Fitur Edit Modal dalam pengembangan', 'info')} className="bg-blue-600 hover:bg-blue-500 text-white w-8 h-8 rounded-full shadow-lg" title="Edit"><i className="fas fa-pen"></i></button>
                                                <button onClick={() => handleAction(u.id, 'DELETE')} className="bg-red-600 hover:bg-red-500 text-white w-8 h-8 rounded-full shadow-lg" title="Hapus Permanen"><i className="fas fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const AdminLinks = ({ showToast }) => (
            <div className="animate-fade-in max-w-4xl space-y-6">
                <div>
                    <h2 className="text-2xl font-bold text-white mb-2"><i className="fas fa-link text-blue-500 mr-2"></i> CMS Tautan Global</h2>
                    <p className="text-sm text-slate-400">Ubah link di sini, dan semua perangkat member akan otomatis berubah seketika.</p>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* Kartu 1 */}
                    <div className="glass-panel p-6 rounded-2xl shadow-lg border-t-4 border-t-purple-500">
                        <h3 className="text-lg font-bold text-white mb-4 flex items-center"><i className="fas fa-robot text-purple-400 mr-2"></i> Hub AI Generator</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-1">Slot 1: Text-to-Image AI</label>
                                <input type="text" className="w-full bg-slate-900 border border-slate-700 focus:border-purple-500 rounded-lg p-3 text-sm text-white transition outline-none" defaultValue="https://krea.ai/..." />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-1">Slot 2: AI Video Maker</label>
                                <input type="text" className="w-full bg-slate-900 border border-slate-700 focus:border-purple-500 rounded-lg p-3 text-sm text-white transition outline-none" defaultValue="https://runwayml.com/..." />
                            </div>
                            <button className="w-full mt-2 py-2 border border-dashed border-slate-600 text-slate-400 rounded-lg hover:bg-slate-800 hover:text-white transition text-sm">
                                <i className="fas fa-plus mr-2"></i>Tambah Slot AI Baru
                            </button>
                        </div>
                    </div>

                    {/* Kartu 2 */}
                    <div className="glass-panel p-6 rounded-2xl shadow-lg border-t-4 border-t-emerald-500">
                        <h3 className="text-lg font-bold text-white mb-4 flex items-center"><i className="fas fa-shopping-cart text-emerald-400 mr-2"></i> Monetisasi & Hiburan</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-1">URL Affiliate Produk Utama</label>
                                <input type="text" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-3 text-sm text-white transition outline-none" defaultValue="https://shopee.co.id/kreanova" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-1">URL Drama Short</label>
                                <input type="text" className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg p-3 text-sm text-white transition outline-none" defaultValue="https://youtube.com/shorts/..." />
                            </div>
                        </div>
                    </div>
                </div>

                <div className="flex justify-end mt-6">
                    <button onClick={() => showToast('Semua tautan berhasil disinkronisasi ke server!', 'success')} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1">
                        <i className="fas fa-cloud-upload-alt mr-2"></i> Deploy Perubahan Tautan
                    </button>
                </div>
            </div>
        );

        const AdminNetworkTree = () => (
            <div className="animate-fade-in h-full flex flex-col">
                <h2 className="text-2xl font-bold text-white mb-6"><i className="fas fa-sitemap text-yellow-500 mr-2"></i> Visualisasi Jaringan Binary (MLM)</h2>
                <div className="glass-panel flex-1 rounded-2xl shadow-lg p-8 flex items-center justify-center overflow-auto custom-scrollbar">
                    {/* Simulasi Pohon Jaringan Visual CSS */}
                    <div className="flex flex-col items-center">
                        <div className="tree-node tree-root">
                            <div className="w-16 h-16 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.5)] border-4 border-slate-900 z-10 cursor-pointer hover:scale-110 transition">
                                <span className="font-black text-slate-900">KN</span>
                            </div>
                            <p className="text-xs font-bold text-yellow-400 mt-2">Master</p>
                        </div>
                        <div className="w-full h-8 border-t-2 border-l-2 border-r-2 border-slate-600 rounded-t-xl mx-auto flex justify-between px-16 relative" style={{width: '300px'}}></div>
                        <div className="flex justify-between w-full" style={{width: '350px'}}>
                            <div className="tree-node">
                                <div className="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-900 z-10 text-white font-bold cursor-pointer hover:scale-110 transition">A1</div>
                                <p className="text-xs text-slate-300 mt-2">Budi</p>
                            </div>
                            <div className="tree-node">
                                <div className="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg border-4 border-slate-900 z-10 text-white font-bold cursor-pointer hover:scale-110 transition">A2</div>
                                <p className="text-xs text-slate-300 mt-2">Siti</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [toast, setToast] = useState(null);

            const showToast = (msg, type) => setToast({ msg, type });

            return (
                <div className="h-screen w-full flex bg-[#0b0f19] bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] overflow-hidden">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* Sidebar Modern */}
                    <aside className="w-20 lg:w-72 glass-panel border-r border-slate-800/50 flex flex-col z-20 transition-all duration-300">
                        <div className="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-slate-800/50 shrink-0">
                            <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-10 h-10 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.3)] border border-yellow-500/50" onError={(e) => e.target.style.display='none'} />
                            <div className="ml-3 hidden lg:block">
                                <h1 className="font-black text-lg text-white tracking-wide glow-text">KreaNova AI</h1>
                                <p className="text-[10px] font-bold text-yellow-500 uppercase tracking-widest">Super Admin</p>
                            </div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 flex flex-col gap-2 px-3 custom-scrollbar">
                            <button onClick={() => setActiveMenu('dashboard')} className={`flex items-center p-3 rounded-xl transition group ${activeMenu === 'dashboard' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-[inset_0_0_20px_rgba(37,99,235,0.1)]' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fas fa-chart-pie w-6 text-center text-lg group-hover:scale-110 transition"></i>
                                <span className="ml-3 font-semibold hidden lg:block">Dashboard</span>
                            </button>
                            <button onClick={() => setActiveMenu('network')} className={`flex items-center p-3 rounded-xl transition group ${activeMenu === 'network' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fas fa-sitemap w-6 text-center text-lg group-hover:scale-110 transition"></i>
                                <span className="ml-3 font-semibold hidden lg:block">Pohon Jaringan</span>
                            </button>
                            <button onClick={() => setActiveMenu('users')} className={`flex items-center p-3 rounded-xl transition group ${activeMenu === 'users' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fas fa-users-cog w-6 text-center text-lg group-hover:scale-110 transition"></i>
                                <span className="ml-3 font-semibold hidden lg:block">Database Member</span>
                            </button>
                            <button onClick={() => setActiveMenu('links')} className={`flex items-center p-3 rounded-xl transition group ${activeMenu === 'links' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fas fa-link w-6 text-center text-lg group-hover:scale-110 transition"></i>
                                <span className="ml-3 font-semibold hidden lg:block">Manajemen Tautan</span>
                            </button>
                        </nav>
                        <div className="p-4 border-t border-slate-800/50">
                            <button className="w-full flex items-center justify-center lg:justify-start p-3 rounded-xl text-red-400 hover:bg-red-500/10 hover:text-red-300 transition">
                                <i className="fas fa-sign-out-alt w-6 text-center"></i>
                                <span className="ml-3 font-semibold hidden lg:block">Keluar</span>
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col overflow-hidden relative">
                        {/* Header Navbar */}
                        <header className="h-20 glass-panel border-b border-slate-800/50 flex items-center justify-between px-8 z-10 shrink-0">
