<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI - Business Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #cbd5e1; /* slate-300 */
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 0px; height: 0px; }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        const KreaNovaLogo = ({ className = "w-8 h-8", opacity = "1" }) => (
            <svg viewBox="0 0 100 100" className={className} style={{ opacity: opacity }} xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#1e3a8a" />
                        <stop offset="100%" stopColor="#020617" />
                    </linearGradient>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#fef08a" />
                        <stop offset="50%" stopColor="#d4af37" />
                        <stop offset="100%" stopColor="#92400e" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" strokeWidth="4"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" strokeWidth="0.5" opacity="0.5"/>
                
                {/* Tangan Bawah */}
                <path d="M 20 65 Q 50 90 80 65" fill="none" stroke="url(#goldGrad)" strokeWidth="3" strokeLinecap="round" />
                
                {/* Tangan Atas */}
                <path d="M 30 25 Q 50 10 70 25" fill="none" stroke="url(#goldGrad)" strokeWidth="1.5" opacity="0.4" strokeLinecap="round" />
                
                {/* Huruf K Besar */}
                <text x="48" y="66" fontFamily="Georgia, serif" fontSize="48" fill="url(#goldGrad)" textAnchor="middle" fontWeight="bold">K</text>
                
                {/* AI / Network Nodes */}
                <circle cx="68" cy="36" r="3.5" fill="#60a5fa" />
                <circle cx="76" cy="48" r="2.5" fill="#60a5fa" />
                <circle cx="64" cy="52" r="2" fill="#93c5fd" />
                
                {/* Garis koneksi */}
                <path d="M 68 36 L 76 48 M 68 36 L 54 40 M 64 52 L 76 48" stroke="#60a5fa" strokeWidth="1.5" fill="none" />
            </svg>
        );

        const MOCK_USER = {
            name: "Budi Santoso",
            userId: "KREANOVA001",
            referralCode: "KREAB91K",
            pairingBonus: 4500000,
            leftMember: 124,
            rightMember: 98,
            leftVolume: 18600000,
            rightVolume: 14700000,
            phone: "081234567890",
            email: "budi.santoso@email.com",
            bank: { name: "BCA", accNumber: "8739123456", accName: "BUDI SANTOSO" }
        };

        const MOCK_WALLET = {
            available: 2450000,
            sponsorBonus: 8000000,
            pairingBonus: 4500000
        };

        const MOCK_TREE_DATA = {
            id: "KREANOVA001", name: "Budi Santoso", status: "ACTIVE", pos: "ROOT", leftVol: 1500000, rightVol: 1250000,
            left: {
                id: "KREANOVA002", name: "Andi W.", status: "ACTIVE", pos: "LEFT", leftVol: 300000, rightVol: 150000,
                left: { id: "KREANOVA004", name: "Siti A.", status: "ACTIVE", pos: "LEFT", leftVol: 0, rightVol: 0 },
                right: null
            },
            right: {
                id: "KREANOVA003", name: "Diana P.", status: "ACTIVE", pos: "RIGHT", leftVol: 600000, rightVol: 450000,
                left: null, right: null
            }
        };

        const MemberDashboard = () => {
            const [copied, setCopied] = useState(false);
            const referralLink = `kreanova-ai.com/?ref=${MOCK_USER.referralCode}`;
            const fullLink = `https://${referralLink}`;

            const handleCopy = () => {
                const textArea = document.createElement("textarea");
                textArea.value = fullLink;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Gagal menyalin', err);
                }
                document.body.removeChild(textArea);
            };

            const handleShare = () => {
                const text = `Halo! Bergabunglah dengan KreaNova AI dan ciptakan konten video menggunakan kecerdasan buatan. Daftar melalui link saya: ${fullLink}`;
                if (navigator.share) {
                    navigator.share({ title: 'Undangan KreaNova AI', text: text, url: fullLink })
                    .catch((error) => {
                        if (error.name !== 'AbortError') console.log('Share error:', error);
                    });
                } else {
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                }
            };

            return (
                <div className="space-y-5 animate-fade-in pb-20">
                    <div className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold text-lg border-2 border-slate-800 shadow-md">
                                {MOCK_USER.name.charAt(0)}
                            </div>
                            <div>
                                <h2 className="text-white font-bold text-base leading-tight">{MOCK_USER.name}</h2>
                                <p className="text-xs text-slate-400 font-mono mt-0.5">{MOCK_USER.userId}</p>
                            </div>
                        </div>
                        <div className="text-right">
                            <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded-md text-[10px] font-bold tracking-wider">ACTIVE</span>
                        </div>
                    </div>

                    <div className="bg-gradient-to-r from-blue-600 to-blue-800 rounded-2xl p-5 shadow-lg text-white relative overflow-hidden">
                        <p className="text-sm text-blue-100 mb-1 font-medium">Saldo Tersedia</p>
                        <h3 className="text-3xl font-bold mb-5 tracking-tight">{formatIDR(MOCK_WALLET.available)}</h3>
                        <div className="flex gap-3">
                            <button className="flex-1 bg-white/20 hover:bg-white/30 py-2.5 rounded-xl text-sm font-semibold transition-colors flex items-center justify-center">
                                <i className="fas fa-arrow-up mr-2"></i> Tarik Dana
                            </button>
                            <button className="flex-1 bg-black/20 hover:bg-black/30 py-2.5 rounded-xl text-sm font-semibold transition-colors flex items-center justify-center">
                                <i className="fas fa-history mr-2"></i> Riwayat
                            </button>
                        </div>
                    </div>

                    <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-md">
                        <p className="text-[10px] text-slate-400 uppercase tracking-wider mb-2 font-bold"><i className="fas fa-link mr-1"></i> Link Referral Anda</p>
                        <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-3 text-center">
                            <p className="text-sm text-slate-300 font-mono truncate select-all">{referralLink}</p>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleCopy} className={`flex-1 h-11 rounded-xl flex items-center justify-center shadow-md active:scale-95 transition-all text-sm font-bold ${copied ? 'bg-emerald-600 text-white' : 'bg-blue-600 text-white'}`}>
                                <i className={copied ? "fas fa-check mr-2" : "fas fa-copy mr-2"}></i>
                                {copied ? 'Tersalin!' : 'Copy Link'}
                            </button>
                            <button onClick={handleShare} className="flex-1 h-11 bg-slate-800 text-white rounded-xl flex items-center justify-center shadow-md active:scale-95 transition-all text-sm font-bold border border-slate-700">
                                <i className="fas fa-share-nodes mr-2"></i> Bagikan
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col justify-center shadow-sm">
                            <p className="text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Total Sponsor</p>
                            <h4 className="text-xl font-bold text-white mb-1">{formatIDR(MOCK_WALLET.sponsorBonus)}</h4>
                            <p className="text-[10px] text-emerald-400"><i className="fas fa-arrow-up mr-1"></i>Bonus Aktif</p>
                        </div>
                        <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col justify-center shadow-sm">
                            <p className="text-[10px] text-slate-400 mb-1 uppercase tracking-wider">Total Pairing</p>
                            <h4 className="text-xl font-bold text-white mb-1">{formatIDR(MOCK_WALLET.pairingBonus)}</h4>
                            <p className="text-[10px] text-emerald-400"><i className="fas fa-arrow-up mr-1"></i>Bonus Aktif</p>
                        </div>
                    </div>
                </div>
            );
        };

        const TreeNode = ({ node }) => {
            if (!node) {
                return (
                    <div className="flex flex-col items-center mx-2 my-4">
                        <div className="w-12 h-12 rounded-full bg-slate-800/50 border border-slate-700 border-dashed flex items-center justify-center">
                            <i className="fas fa-plus text-slate-600 text-sm"></i>
                        </div>
                    </div>
                );
            }

            const isActive = node.status === 'ACTIVE';

            return (
                <div className="flex flex-col items-center">
                    <div className="relative group cursor-pointer mb-2">
                        <div className="flex flex-col items-center">
                            <div className={`w-16 h-16 rounded-full flex items-center justify-center shadow-lg relative z-10 bg-slate-900 ${node.pos === 'ROOT' ? 'border-[3px] border-[#d4af37] shadow-[0_0_15px_rgba(212,175,55,0.4)]' : isActive ? 'border-2 border-[#d4af37]' : 'border-2 border-red-500/50'}`}>
                                <KreaNovaLogo className="w-14 h-14" />
                            </div>
                            
                            <div className="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg -mt-3 z-20 shadow-xl text-center min-w-[90px]">
                                <div className="text-[9px] text-slate-400 font-mono mb-0.5">{node.id}</div>
                                <div className="text-[10px] font-bold text-white truncate max-w-[80px]">{node.name}</div>
                                <div className="flex justify-between mt-1 pt-1 border-t border-slate-800 text-[8px] font-mono font-bold">
                                    <div className="text-emerald-400">{(node.leftVol/1000).toFixed(0)}k</div>
                                    <div className="text-emerald-400">{(node.rightVol/1000).toFixed(0)}k</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {(node.left !== undefined || node.right !== undefined) && (
                        <div className="flex flex-col items-center w-full">
                            <div className="w-[2px] h-4 bg-slate-700"></div>
                            <div className="w-full flex justify-center relative">
                                <div className="absolute top-0 w-[calc(50%+1rem)] h-[2px] bg-slate-700 rounded-full"></div>
                                <div className="flex justify-between w-full min-w-[140px] gap-4 pt-3">
                                    <div className="flex-1 flex justify-center relative">
                                        <div className="absolute -top-3 w-[2px] h-3 bg-slate-700"></div>
                                        <TreeNode node={node.left} />
                                    </div>
                                    <div className="flex-1 flex justify-center relative">
                                        <div className="absolute -top-3 w-[2px] h-3 bg-slate-700"></div>
                                        <TreeNode node={node.right} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const BinaryTreeVisualizer = () => {
            return (
                <div className="animate-fade-in flex flex-col h-full pb-20">
                    <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 mb-4 shadow-sm flex items-center justify-between">
                        <div>
                            <h2 className="text-sm font-bold text-white"><i className="fas fa-network-wired text-blue-500 mr-2"></i>Pohon Jaringan</h2>
                            <p className="text-[10px] text-slate-400 mt-1">Struktur downline binary Anda</p>
                        </div>
                        <button className="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center text-slate-400 border border-slate-700"><i className="fas fa-search"></i></button>
                    </div>

                    <div className="flex-1 bg-slate-900/50 rounded-2xl border border-slate-800 overflow-auto relative p-4 flex justify-center custom-scrollbar">
                        <div className="min-w-max pb-10 pt-4">
                            <TreeNode node={MOCK_TREE_DATA} />
                        </div>
                    </div>
                </div>
            );
        };

        const MemberAiStudio = () => {
            const [products, setProducts] = useState([]);

            useEffect(() => {
                const saved = localStorage.getItem('kreanova_ai_products');
                const defaultProducts = [
                    { id: 'tutorial', title: 'Tutorial Produk AI', icon: 'fa-youtube', color: 'from-red-600 to-red-800', url: '', active: true },
                    { id: 1, title: 'Affiliate Produk', icon: 'fa-box-open', color: 'from-blue-500 to-cyan-500', url: '', active: true },
                    { id: 2, title: 'Drama Short', icon: 'fa-masks-theater', color: 'from-purple-500 to-pink-500', url: '', active: true },
                    { id: 3, title: 'Motivasi Islami', icon: 'fa-moon', color: 'from-emerald-500 to-teal-500', url: '', active: true },
                    { id: 4, title: "Qur'an Overlay", icon: 'fa-book-quran', color: 'from-green-500 to-emerald-600', url: '', active: true },
                    { id: 5, title: 'Animal Creature', icon: 'fa-paw', color: 'from-orange-500 to-amber-500', url: '', active: true },
                    { id: 6, title: 'Animal Human Activity', icon: 'fa-person-walking-with-cane', color: 'from-yellow-500 to-orange-400', url: '', active: true },
                    { id: 7, title: 'CineAI', icon: 'fa-clapperboard', color: 'from-rose-500 to-red-600', url: '', active: true },
                    { id: 8, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                    { id: 9, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                    { id: 10, title: 'Coming Soon', icon: 'fa-lock', color: 'from-slate-700 to-slate-800', url: '', active: false },
                ];
                
                if (saved) {
                    let parsedSaved = JSON.parse(saved);
                    if (parsedSaved.length > 0 && parsedSaved[0].id !== 'tutorial') {
                        parsedSaved.unshift(defaultProducts[0]);
                    }
                    setProducts(parsedSaved);
                } else {
                    setProducts(defaultProducts);
                }
            }, []);

            return (
                <div className="animate-fade-in pb-20">
                    <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-5 rounded-2xl border border-slate-800 shadow-lg relative overflow-hidden mb-5">
                        <div className="absolute right-0 top-0 w-32 h-32 bg-blue-600/20 blur-[40px] rounded-full pointer-events-none"></div>
                        <h2 className="text-xl font-bold text-white flex items-center gap-2 mb-2 relative z-10">
                            <i className="fas fa-sparkles text-blue-500"></i> AI Studio
                        </h2>
                        <p className="text-xs text-slate-400 mb-4 relative z-10">Pilih modul AI Video Generator untuk mulai membuat konten Anda.</p>
                        
                        <div className="flex items-center justify-between bg-slate-950 border border-slate-800 p-3 rounded-xl relative z-10">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-blue-500/10 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-bolt text-blue-400"></i>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 font-medium uppercase">Sisa AI Credit</p>
                                    <p className="text-lg font-bold text-white">450 <span className="text-[10px] font-normal text-slate-500">Credits</span></p>
                                </div>
                            </div>
                            <button className="text-[10px] bg-slate-800 text-white px-3 py-1.5 rounded-lg border border-slate-700 font-bold uppercase tracking-wider">Top Up</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        {products.map((prod, idx) => {
                            const isTutorial = prod.id === 'tutorial';
                            const Wrapper = prod.active ? 'a' : 'div';
                            const linkProps = prod.active ? { href: prod.url || '#', target: '_blank', rel: 'noopener noreferrer' } : {};
                            
                            return (
                                <Wrapper key={idx} {...linkProps} className={`block p-4 rounded-2xl border transition-all relative overflow-hidden ${
                                    isTutorial ? 'col-span-2' : ''
                                } ${
                                    prod.active 
                                    ? 'bg-slate-900 border-slate-700 hover:border-blue-500 active:scale-95 shadow-md group' 
                                    : 'bg-slate-900/50 border-slate-800/50 opacity-75'
                                }`}>
                                    <div className={`absolute top-0 right-0 w-16 h-16 bg-gradient-to-br ${prod.color} opacity-20 rounded-bl-full`}></div>
                                    
                                    <div className="flex flex-col h-full">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${prod.color} flex items-center justify-center text-white shadow-lg`}>
                                                <i className={`${prod.icon === 'fa-youtube' ? 'fab' : 'fas'} ${prod.icon} text-lg`}></i>
                                            </div>
                                            {prod.active && (
                                                <i className="fas fa-external-link-alt text-[10px] text-slate-500 group-hover:text-blue-400 transition-colors"></i>
                                            )}
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold text-white mb-0.5 leading-tight">{prod.title}</h3>
                                            <p className="text-[9px] text-slate-400">
                                                {isTutorial ? 'Tonton panduan penggunaan AI' : prod.active ? 'Buka Generator' : 'Segera Hadir'}
                                            </p>
                                        </div>
                                    </div>
                                </Wrapper>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const MemberProfile = ({ onLogout }) => {
            return (
                <div className="animate-fade-in pb-20 space-y-4">
                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col items-center shadow-md">
                        <div className="relative mb-3">
                            <div className="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold text-3xl border-4 border-slate-950 shadow-lg">
                                {MOCK_USER.name.charAt(0)}
                            </div>
                            <button className="absolute bottom-0 right-0 w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-white border-2 border-slate-900 shadow-sm">
                                <i className="fas fa-camera text-[10px]"></i>
                            </button>
                        </div>
                        <h2 className="text-lg font-bold text-white">{MOCK_USER.name}</h2>
                        <p className="text-xs text-blue-400 font-mono mb-2">{MOCK_USER.userId}</p>
                        <span className="bg-green-500/20 text-green-400 border border-green-500/30 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider">MEMBER AKTIF</span>
                    </div>

                    <div className="bg-slate-900 rounded-2xl border border-slate-800 shadow-md overflow-hidden">
                        <div className="p-4 border-b border-slate-800/50 flex justify-between items-center">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider"><i className="fas fa-user-circle mr-2"></i>Informasi Pribadi</h3>
                        </div>
                        <div className="p-4 space-y-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] text-slate-500 mb-0.5">Nama Lengkap</p>
                                    <p className="text-sm font-medium text-white">{MOCK_USER.name}</p>
                                </div>
                            </div>
                            <div className="h-[1px] bg-slate-800/50"></div>
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] text-slate-500 mb-0.5">Nomor WhatsApp</p>
                                    <p className="text-sm font-medium text-white">{MOCK_USER.phone}</p>
                                </div>
                                <button className="text-blue-400 text-xs font-bold"><i className="fas fa-pen"></i></button>
                            </div>
                            <div className="h-[1px] bg-slate-800/50"></div>
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] text-slate-500 mb-0.5">Alamat Email</p>
                                    <p className="text-sm font-medium text-white">{MOCK_USER.email}</p>
                                </div>
                                <button className="text-blue-400 text-xs font-bold"><i className="fas fa-pen"></i></button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-900 rounded-2xl border border-slate-800 shadow-md overflow-hidden">
                        <div className="p-4 border-b border-slate-800/50 flex justify-between items-center">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider"><i className="fas fa-university mr-2"></i>Data Rekening Bank</h3>
                            <button className="text-blue-400 text-xs font-bold"><i className="fas fa-pen"></i></button>
                        </div>
                        <div className="p-4 flex items-center gap-4">
                            <div className="w-12 h-12 bg-white rounded-lg flex items-center justify-center font-black text-blue-800 text-sm shadow-inner text-center">
                                {MOCK_USER.bank.name}
                            </div>
                            <div>
                                <p className="text-sm font-bold text-white tracking-wider">{MOCK_USER.bank.accNumber}</p>
                                <p className="text-[10px] text-slate-400">A.N. {MOCK_USER.bank.accName}</p>
                            </div>
                        </div>
                    </div>

                    <button onClick={onLogout} className="w-full bg-slate-900 border border-slate-800 hover:bg-red-900/20 text-red-400 py-3.5 rounded-2xl text-sm font-bold transition-colors flex items-center justify-center gap-2 shadow-sm">
                        <i className="fas fa-sign-out-alt"></i> Keluar Akun
                    </button>
                </div>
            );
        };

        const MemberApp = ({ onLogout }) => {
            const [activeMenu, setActiveMenu] = useState('dashboard');

            return (
                <div className="h-screen w-full bg-slate-950 flex flex-col font-sans text-slate-300 relative overflow-hidden">
                    <header className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-20 shadow-md">
                        <div className="flex items-center gap-2 text-white">
                            <KreaNovaLogo className="w-9 h-9" />
                            <div>
                                <h1 className="font-bold text-[13px] tracking-wider leading-none">KREANOVA AI</h1>
                                <p className="text-[8px] text-[#d4af37] font-medium tracking-widest uppercase">Solusi Teknologi Cerdas</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button className="text-slate-400 hover:text-white relative">
                                <i className="fas fa-bell"></i>
                                <span className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900/50 to-slate-950">
                        <div className="max-w-md mx-auto">
                            {activeMenu === 'dashboard' && <MemberDashboard />}
                            {activeMenu === 'network' && <BinaryTreeVisualizer />}
                            {activeMenu === 'ai' && <MemberAiStudio />}
                            {activeMenu === 'profile' && <MemberProfile onLogout={onLogout} />}
                        </div>
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 pb-safe z-40 shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
                        <div className="flex justify-around items-center h-16 max-w-md mx-auto px-2">
                            <button onClick={() => setActiveMenu('dashboard')} className="flex flex-col items-center justify-center w-full h-full gap-1 relative">
                                <i className={`fas fa-home text-lg transition-colors ${activeMenu === 'dashboard' ? 'text-blue-500' : 'text-slate-500'}`}></i>
                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'dashboard' ? 'text-blue-400' : 'text-slate-500'}`}>Home</span>
                            </button>
                            <button onClick={() => setActiveMenu('network')} className="flex flex-col items-center justify-center w-full h-full gap-1">
                                <i className={`fas fa-network-wired text-lg transition-colors ${activeMenu === 'network' ? 'text-blue-500' : 'text-slate-500'}`}></i>
                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'network' ? 'text-blue-400' : 'text-slate-500'}`}>Jaringan</span>
                            </button>
                            <button onClick={() => setActiveMenu('ai')} className="flex flex-col items-center justify-center w-full h-full gap-1">
                                <i className={`fas fa-sparkles text-lg transition-colors ${activeMenu === 'ai' ? 'text-blue-500' : 'text-slate-500'}`}></i>
                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'ai' ? 'text-blue-400' : 'text-slate-500'}`}>AI Video</span>
                            </button>
                            <button onClick={() => setActiveMenu('profile')} className="flex flex-col items-center justify-center w-full h-full gap-1">
                                <i className={`fas fa-user text-lg transition-colors ${activeMenu === 'profile' ? 'text-blue-500' : 'text-slate-500'}`}></i>
                                <span className={`text-[9px] font-bold transition-colors ${activeMenu === 'profile' ? 'text-blue-400' : 'text-slate-500'}`}>Profil</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        };

        const PaymentInstructionPage = ({ nominal, onRefresh, onLogout }) => (
            <div className="h-screen w-full flex flex-col items-center bg-slate-950 p-6 relative overflow-hidden max-w-md mx-auto shadow-2xl">
                <div className="absolute top-[-10%] left-[-10%] w-64 h-64 bg-orange-600/20 rounded-full blur-3xl"></div>
                <div className="w-full z-10 animate-fade-in mt-10">
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center">
                        <div className="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-orange-500/30">
                            <i className="fas fa-clock text-orange-500 text-3xl"></i>
                        </div>
                        <h2 className="text-xl font-bold text-white mb-2">Menunggu Pembayaran</h2>
                        <p className="text-sm text-slate-400 mb-6">Akun Anda telah berhasil didaftarkan. Silakan lakukan transfer untuk mengaktifkan akun dan paket AI Video Anda.</p>
                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 mb-6 relative overflow-hidden">
                            <p className="text-xs text-slate-500 mb-1 font-bold uppercase tracking-widest">Total Transfer</p>
                            <h3 className="text-3xl font-black text-white mb-1">Rp 150.<span className="text-orange-400">{nominal.toString().slice(-3)}</span></h3>
                            <p className="text-[10px] text-orange-400 bg-orange-500/10 py-1.5 px-3 rounded-lg border border-orange-500/20 inline-block font-medium">
                                <i className="fas fa-exclamation-triangle mr-1"></i> Transfer TEPAT hingga 3 digit terakhir
                            </p>
                        </div>
                        <div className="text-left bg-slate-800/50 p-4 rounded-xl border border-slate-700 mb-6">
                            <p className="text-xs text-slate-400 mb-2">Transfer ke Rekening Perusahaan:</p>
                            <div className="flex items-center gap-3 mb-3">
                                <div className="w-10 h-10 bg-white rounded flex items-center justify-center text-blue-800 font-black text-xs">BCA</div>
                                <div>
                                    <p className="font-bold text-white text-sm">8739 1234 5678</p>
                                    <p className="text-xs text-slate-400">A.N. PT KREANOVA AI DIGITAL</p>
                                </div>
                            </div>
                            <button className="w-full bg-slate-900 hover:bg-slate-800 text-blue-400 text-xs py-2 rounded-lg border border-slate-700 font-bold transition-colors">
                                <i className="fas fa-copy mr-1"></i> Salin Nomor Rekening
                            </button>
                        </div>
                        <button onClick={onRefresh} className="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-[0_0_15px_rgba(37,99,235,0.3)] mb-4 flex items-center justify-center">
                            <i className="fas fa-sync-alt mr-2"></i> Cek Status Pembayaran
                        </button>
                        <button onClick={onLogout} className="text-xs text-slate-500 hover:text-slate-300 transition-colors">Keluar Akun</button>
                    </div>
                </div>
            </div>
        );

        const RegisterPage = ({ onRegisterSuccess, onBackToLogin, initialReferralCode }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [refCode, setRefCode] = useState(initialReferralCode || '');
            const isLocked = !!initialReferralCode;

            const handleSubmit = (e) => {
                e.preventDefault();
                setIsLoading(true);
                const uniqueCode = Math.floor(Math.random() * 900) + 100; 
                const totalTransfer = 150000 + uniqueCode;
                setTimeout(() => {
                    setIsLoading(false);
                    onRegisterSuccess(totalTransfer);
                }, 1500);
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-950 p-6 relative overflow-y-auto custom-scrollbar max-w-md mx-auto shadow-2xl">
                    <div className="w-full z-10 animate-fade-in py-8 mt-10">
                        <div className="flex flex-col items-center mb-6">
                            <KreaNovaLogo className="w-20 h-20 mb-2 drop-shadow-[0_0_15px_rgba(212,175,55,0.4)]" />
                            <h1 className="text-xl font-bold text-white tracking-widest mt-2">REGISTRASI</h1>
                        </div>
                        <div className="bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-2xl">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className="block text-[10px] font-bold text-slate-400 mb-1 ml-1 uppercase">Nama Lengkap</label><div className="relative"><i className="fas fa-id-card absolute left-4 top-3 text-slate-500 text-sm"></i><input type="text" required className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500" placeholder="Sesuai KTP/Rekening" /></div></div>
                                <div><label className="block text-[10px] font-bold text-slate-400 mb-1 ml-1 uppercase">Email Aktif</label><div className="relative"><i className="fas fa-envelope absolute left-4 top-3 text-slate-500 text-sm"></i><input type="email" required className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500" placeholder="email@anda.com" /></div></div>
                                <div><label className="block text-[10px] font-bold text-slate-400 mb-1 ml-1 uppercase">Nomor WhatsApp</label><div className="relative"><i className="fab fa-whatsapp absolute left-4 top-3 text-emerald-500 text-sm"></i><input type="tel" required className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500" placeholder="0812xxxxxx" /></div></div>
                                <div><label className="block text-[10px] font-bold text-slate-400 mb-1 ml-1 uppercase">Kata Sandi Baru</label><div className="relative"><i className="fas fa-lock absolute left-4 top-3 text-slate-500 text-sm"></i><input type="password" required className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500" placeholder="Minimal 6 karakter" /></div></div>
                                
                                {isLocked ? (
                                    <div className="p-3 bg-blue-500/10 rounded-xl border border-blue-500/20 mt-2">
                                        <label className="block text-[10px] font-bold text-blue-400 mb-1 uppercase">Sponsor Anda (Otomatis)</label>
                                        <div className="flex items-center justify-between">
                                            <span className="text-white font-bold text-sm"><i className="fas fa-lock text-emerald-400 mr-1"></i> Terkunci</span>
                                            <span className="text-xs text-blue-400 font-mono bg-blue-900/50 px-2 py-0.5 rounded">{refCode}</span>
                                        </div>
                                    </div>
                                ) : (
                                    <div><label className="block text-[10px] font-bold text-slate-400 mb-1 ml-1 uppercase mt-2">Kode Referral Sponsor</label><div className="relative"><i className="fas fa-users absolute left-4 top-3 text-slate-500 text-sm"></i><input type="text" required value={refCode} onChange={(e) => setRefCode(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan kode sponsor" /></div></div>
                                )}

                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 mb-1 ml-1 uppercase mt-3">Pilih Penempatan Jaringan</label>
                                    <div className="flex gap-3">
                                        <label className="flex-1 cursor-pointer">
                                            <input type="radio" name="position" value="LEFT" defaultChecked className="peer sr-only" />
                                            <div className="w-full text-center py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-400 text-xs font-bold peer-checked:border-blue-500 peer-checked:text-blue-400 peer-checked:bg-blue-500/15 transition-all shadow-sm">KIRI (LEFT)</div>
                                        </label>
                                        <label className="flex-1 cursor-pointer">
                                            <input type="radio" name="position" value="RIGHT" className="peer sr-only" />
                                            <div className="w-full text-center py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-400 text-xs font-bold peer-checked:border-blue-500 peer-checked:text-blue-400 peer-checked:bg-blue-500/15 transition-all shadow-sm">KANAN (RIGHT)</div>
                                        </label>
                                    </div>
                                </div>

                                <button type="submit" disabled={isLoading} className="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg mt-6 flex items-center justify-center">
                                    {isLoading ? <i className="fas fa-circle-notch fa-spin text-lg"></i> : "Daftar & Lanjutkan Pembayaran"}
                                </button>
                            </form>
                            <p className="text-center text-xs text-slate-400 mt-6">Sudah punya akun? <button onClick={onBackToLogin} className="text-blue-400 font-bold hover:underline">Login di sini</button></p>
                        </div>
                    </div>
                </div>
            );
        };

        const LoginPage = ({ onLogin, onGoToRegister }) => {
            const [isLoading, setIsLoading] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                setIsLoading(true);
                setTimeout(() => {
                    setIsLoading(false);
                    onLogin();
                }, 1500);
            };

            return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-950 p-6 relative overflow-hidden max-w-md mx-auto shadow-2xl">
                    <div className="absolute top-[-10%] left-[-10%] w-64 h-64 bg-blue-600/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-purple-600/20 rounded-full blur-3xl"></div>
                    <div className="w-full z-10 animate-fade-in">
                        <div className="flex flex-col items-center mb-8">
                            <KreaNovaLogo className="w-24 h-24 mb-4 drop-shadow-[0_0_15px_rgba(212,175,55,0.4)]" />
                            <h1 className="text-2xl font-bold text-white tracking-widest mt-2">KREANOVA AI</h1>
                            <p className="text-[10px] text-[#d4af37] tracking-[0.2em] font-bold uppercase mt-1">Solusi Teknologi Cerdas</p>
                        </div>
                        <div className="bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-2xl">
                            <h2 className="text-lg font-bold text-white mb-6 text-center">Login ke Akun Anda</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">User ID / Email</label><div className="relative"><i className="fas fa-user absolute left-4 top-3.5 text-slate-500 text-sm"></i><input type="text" required className="w-full bg-slate-950 border border-slate-800 text-white rounded-2xl pl-11 pr-4 py-3.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan User ID atau Email" defaultValue="KREANOVA001" /></div></div>
                                <div><div className="flex justify-between items-center mb-1.5 ml-1 mr-1"><label className="block text-xs font-medium text-slate-400">Kata Sandi</label><a href="#" className="text-[10px] text-blue-400 hover:text-blue-300 transition-colors">Lupa Sandi?</a></div><div className="relative"><i className="fas fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i><input type="password" required className="w-full bg-slate-950 border border-slate-800 text-white rounded-2xl pl-11 pr-4 py-3.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan kata sandi" defaultValue="password123" /></div></div>
                                <button type="submit" disabled={isLoading} className="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-4 rounded-2xl text-sm transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] mt-4 flex items-center justify-center">
                                    {isLoading ? <i className="fas fa-circle-notch fa-spin text-lg"></i> : "Masuk ke Dashboard"}
                                </button>
                            </form>
                            <p className="text-center text-xs text-slate-400 mt-6 mb-2">Belum bergabung? <button onClick={() => onGoToRegister()} className="text-blue-400 font-bold hover:underline">Daftar Sekarang</button></p>
                            
                            <div className="mt-4 pt-4 border-t border-slate-800 text-center">
                                <p className="text-[10px] text-slate-500 mb-2 font-mono">Simulasi Referral Link:</p>
                                <button onClick={() => onGoToRegister('KREAB91K')} className="text-xs bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl border border-slate-700 transition-colors shadow-lg">
                                    <i className="fas fa-link mr-2 text-blue-400"></i> Klik Link dari Budi Santoso
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AppWrapper = () => {
            const [currentView, setCurrentView] = useState('login');
            const [transferNominal, setTransferNominal] = useState(0);
            const [referralCode, setReferralCode] = useState('');

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const ref = urlParams.get('ref');
                if (ref) {
                    setReferralCode(ref);
                    setCurrentView('register');
                }
            }, []);

            const handleGoToRegister = (code = '') => {
                setReferralCode(code);
                setCurrentView('register');
            };

            const handleRegisterSuccess = (nominal) => {
                setTransferNominal(nominal);
                setCurrentView('pending_payment');
            };

            const handleCheckPayment = () => {
                alert("Simulasi: Admin belum memverifikasi. Jika admin sudah klik 'Aktifkan', Anda akan otomatis masuk ke Dashboard.");
            };

            if (currentView === 'login') return <LoginPage onLogin={() => setCurrentView('dashboard')} onGoToRegister={handleGoToRegister} />;
            if (currentView === 'register') return <RegisterPage onRegisterSuccess={handleRegisterSuccess} onBackToLogin={() => setCurrentView('login')} initialReferralCode={referralCode} />;
            if (currentView === 'pending_payment') return <PaymentInstructionPage nominal={transferNominal} onRefresh={handleCheckPayment} onLogout={() => setCurrentView('login')} />;
            
            return <MemberApp onLogout={() => setCurrentView('login')} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppWrapper />);
    </script>
</body>
</html>
