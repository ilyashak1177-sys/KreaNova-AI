<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #cbd5e1; margin: 0; padding: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 0px; height: 0px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            window.KreaNovaBackend = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, doc, setDoc, getDoc, collection, query, where, getDocs, serverTimestamp };
        } catch (error) {
            console.error("Firebase Initialization Error:", error);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);

        const KreaNovaLogo = ({ className = "w-12 h-12" }) => (
            <img 
                src="IMG_20260820_224441.jpg" 
                alt="KreaNova AI Logo" 
                className={`${className} object-cover rounded-full shadow-[0_0_15px_rgba(212,175,55,0.4)] border-2 border-[#d4af37]/60 bg-slate-900 transition-all duration-300`}
                onError={(e) => {
                    e.target.onerror = null; 
                    e.target.src = "https://ui-avatars.com/api/?name=KreaNova+AI&background=020617&color=d4af37&rounded=true&bold=true&border=1";
                }}
            />
        );

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { 
                this.setState({ errorMsg: error.toString() });
                console.error("React Error Caught:", error); 
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
                            <i className="fas fa-tools text-orange-500 text-5xl mb-4"></i>
                            <h1 className="text-white text-xl font-bold mb-2">Pembaruan Sistem Berlangsung</h1>
                            <p className="text-slate-400 text-xs mb-6 max-w-xs">{this.state.errorMsg}</p>
                            <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Muat Ulang Layar</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const LoginPage = ({ onLogin, onNavigateRegister }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [isResetting, setIsResetting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true); 
                setErrorMsg('');
                
                let retries = 0;
                while (!window.KreaNovaBackend && retries < 20) {
                    await new Promise(r => setTimeout(r, 500));
                    retries++;
                }

                if (!window.KreaNovaBackend) {
                    setErrorMsg("Gagal memuat sistem. Pastikan internet stabil."); 
                    setIsLoading(false); 
                    return;
                }

                try {
                    const { auth, signInWithEmailAndPassword } = window.KreaNovaBackend;
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    onLogin(userCredential.user);
                } catch (error) {
                    setErrorMsg("Email atau kata sandi salah. Silakan periksa kembali.");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleResetPassword = async () => {
                if (!email) {
                    setErrorMsg("Masukkan alamat email Anda terlebih dahulu di kolom email.");
                    return;
                }
                setIsResetting(true);
                setErrorMsg('');
                setSuccessMsg('');
                try {
                    const { auth, sendPasswordResetEmail } = window.KreaNovaBackend;
                    await sendPasswordResetEmail(auth, email);
                    setSuccessMsg("Tautan reset password telah dikirim ke email Anda!");
                } catch (error) {
                    setErrorMsg("Gagal mereset password. Pastikan email terdaftar.");
                } finally {
                    setIsResetting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 z-0"></div>
                    
                    <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 overflow-hidden">
                        <div className="flex justify-center mb-4"><KreaNovaLogo className="w-24 h-24" /></div>
                        <h2 className="text-2xl font-bold text-center text-white mb-1">KreaNova AI</h2>
                        <p className="text-center text-slate-400 text-xs mb-8 uppercase tracking-widest">Portal Member</p>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in"><i className="fas fa-exclamation-circle mr-1"></i> {errorMsg}</div>}
                        {successMsg && <div className="bg-emerald-500/10 border border-emerald-500/50 text-emerald-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in"><i className="fas fa-check-circle mr-1"></i> {successMsg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="space-y-3">
                                <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Email</label>
                                    <input type="email" placeholder="Masukkan email..." value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-[10px] text-slate-400 font-bold uppercase">Kata Sandi</label>
                                        <button type="button" onClick={handleResetPassword} disabled={isResetting} className="text-[10px] font-bold text-blue-400 hover:text-blue-300">
                                            {isResetting ? 'Mengirim...' : 'Lupa Password?'}
                                        </button>
                                    </div>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 pr-12 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300 transition-colors">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-6 flex items-center justify-center">
                                {isLoading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : "Masuk ke Akun"}
                            </button>
                        </form>
                        <div className="mt-6 text-center border-t border-slate-800 pt-5">
                            <button type="button" onClick={onNavigateRegister} className="text-slate-400 text-sm">Belum punya akun? <span className="text-yellow-500 font-bold">Daftar Sekarang</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const RegisterPage = ({ onRegister, onNavigateLogin }) => {
            const params = new URLSearchParams(window.location.search);
            const initialRef = params.get('ref') ? params.get('ref').toUpperCase() : 'KREANOVA';

            const [sponsor, setSponsor] = useState(initialRef);
            const [position, setPosition] = useState('KIRI');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true); 
                setErrorMsg('');
                
                try {
                    const { auth, db, createUserWithEmailAndPassword, doc, setDoc } = window.KreaNovaBackend;
                    
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    const finalSponsor = (!sponsor || sponsor.trim() === '') ? 'KREANOVA' : sponsor.toUpperCase();
                    const refCode = "KN" + Math.floor(10000 + Math.random() * 90000);
                    const uniqueCode = Math.floor(Math.random() * 900) + 100;
                    const billAmount = 150000 + uniqueCode;

                    await setDoc(doc(db, "users", user.uid), {
                        userId: user.uid,
                        name: name,
                        email: email,
                        phone: phone,
                        sponsor: finalSponsor,
                        position: position,
                        referralCode: refCode,
                        billAmount: billAmount,
                        walletAvailable: 0,
                        leftDirects: 0,
                        rightDirects: 0,
                        isQualified: false,
                        bankName: "",
                        bankAccount: "",
                        status: "PENDING",
                        createdAt: new Date().toISOString()
                    });

                    onRegister(user);
                } catch (error) {
                    setErrorMsg("Gagal mendaftar: " + error.message.replace("Firebase: ", ""));
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative py-10">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-900/10 via-slate-950 to-slate-950 z-0"></div>
                    
                    <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 overflow-hidden">
                        <div className="flex justify-center mb-4"><KreaNovaLogo className="w-20 h-20" /></div>
                        <h2 className="text-2xl font-bold text-center text-white mb-1">Pendaftaran Baru</h2>
                        <p className="text-center text-slate-400 text-xs mb-8 uppercase tracking-widest">KreaNova AI</p>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in"><i className="fas fa-exclamation-circle mr-1"></i> {errorMsg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-2">Kode Referral (Sponsor)</label>
                                <div className="relative mb-3">
                                    <i className="fas fa-users absolute left-3 top-3.5 text-slate-500"></i>
                                    <input type="text" placeholder="KREANOVA" value={sponsor} onChange={(e) => setSponsor(e.target.value.toUpperCase())} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:border-blue-500 focus:outline-none uppercase font-mono" required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => setPosition('KIRI')} className={`py-2.5 text-xs font-bold rounded-xl border transition-all ${position === 'KIRI' ? 'bg-blue-600 border-blue-500 text-white shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>POSISI KIRI</button>
                                    <button type="button" onClick={() => setPosition('KANAN')} className={`py-2.5 text-xs font-bold rounded-xl border transition-all ${position === 'KANAN' ? 'bg-blue-600 border-blue-500 text-white shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>POSISI KANAN</button>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Nama Sesuai KTP</label>
                                    <input type="text" placeholder="Masukkan nama..." value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">No WhatsApp</label>
                                    <input type="tel" placeholder="0812..." value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Email Aktif</label>
                                    <input type="email" placeholder="email@anda.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Buat Kata Sandi</label>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} placeholder="Minimal 6 karakter" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 pr-12 text-sm focus:border-blue-500 focus:outline-none transition" required minLength="6" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300 transition-colors">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-6 flex items-center justify-center">
                                {isLoading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : "Daftar Akun Baru"}
                            </button>
                        </form>
                        <div className="mt-6 text-center border-t border-slate-800 pt-5">
                            <button type="button" onClick={onNavigateLogin} className="text-slate-400 text-sm">Sudah punya akun? <span className="text-blue-400 font-bold">Masuk</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user }) => {
            const [copied, setCopied] = useState(false);
            
            // PERBAIKAN 1: Membuat Link yang Sangat Pendek dan Dinamis
            // Ini akan menghasilkan: https://krea-nova-ai.vercel.app/?ref=KN12345
            const fullLink = `${window.location.origin}/?ref=${user?.referralCode}`;
            
            // Teks promosi untuk dishare ke WA/Telegram
            const shareText = encodeURIComponent(`Halo! Mari bergabung dengan KreaNova AI, platform cerdas untuk solusi digital Anda. Daftar menggunakan link rujukan saya di bawah ini:\n\n${fullLink}`);
            
            // PERBAIKAN 2: Sistem Salin Link yang Tahan Banting (Anti-Eror)
            const handleCopy = () => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(fullLink).then(() => showCopied()).catch(() => fallbackCopy());
                } else {
                    fallbackCopy();
                }
            };

            const fallbackCopy = () => {
                const textArea = document.createElement("textarea");
                textArea.value = fullLink;
                textArea.style.position = "fixed"; // Hindari scroll ke bawah saat dicopy di HP
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopied();
                } catch (err) {
                    console.error('Gagal menyalin', err);
                }
                document.body.removeChild(textArea);
            };

            const showCopied = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
            
            const handleShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'KreaNova AI',
                            text: 'Halo! Mari bergabung dengan KreaNova AI, platform cerdas untuk solusi digital Anda. Daftar menggunakan link rujukan saya di bawah ini:',
                            url: fullLink
                        });
                    } catch (error) {
                        console.log('Berbagi dibatalkan atau terjadi error', error);
                    }
                } else {
                    alert("Browser Anda tidak mendukung fitur bagikan otomatis. Silakan gunakan tombol Salin Link.");
                }
            };
            
            return (
                <div className="animate-fade-in relative pb-10">
                    <div className="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-6 mb-6 shadow-xl border border-slate-700/50 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-20"><KreaNovaLogo className="w-24 h-24 grayscale" /></div>
                        <div className="relative z-10 flex items-center justify-between">
                            <div>
                                <p className="text-blue-300 text-xs mb-1 font-medium">Selamat datang kembali,</p>
                                <h2 className="text-xl font-bold text-white capitalize">{user?.name}</h2>
                                <div className="inline-block mt-2 bg-black/40 px-3 py-1 rounded-full border border-white/10 text-xs font-mono text-emerald-400 font-bold">
                                    ID: {user?.referralCode}
                                </div>
                            </div>
                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20"><i className="fas fa-user text-white"></i></div>
                        </div>
                    </div>
                    <div className="bg-slate-900 rounded-2xl p-6 mb-6 border border-slate-800 shadow-lg">
                        <h3 className="text-slate-400 text-sm font-medium uppercase">Saldo Tersedia</h3>
                        <p className="text-3xl font-extrabold text-white tracking-tight mt-2">{formatIDR(user?.walletAvailable)}</p>
                    </div>
                    <div className="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-lg">
                        <h3 className="text-sm font-bold text-white mb-2"><i className="fas fa-link text-blue-500 mr-2"></i>Link Referral Anda</h3>
                        <div className="bg-slate-950 rounded-xl p-3 mb-4 border border-slate-800 break-all text-xs text-blue-400 font-mono text-center">
                            {fullLink}
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={handleCopy} className={`w-full py-3 rounded-xl text-xs font-bold transition-all shadow-md flex items-center justify-center ${copied ? 'bg-emerald-600 text-white' : 'bg-slate-800 border border-slate-700 text-white hover:bg-slate-700'}`}>
                                <i className={`fas ${copied ? 'fa-check' : 'fa-copy'} mr-2`}></i> {copied ? "Tersalin!" : "Salin Link"}
                            </button>
                            <button onClick={handleShare} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center">
                                <i className="fas fa-share-alt mr-2"></i> Bagikan
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const NetworkTree = ({ user }) => {
            return (
                <div className="animate-fade-in pb-10">
                    <h2 className="text-xl font-bold text-white mb-6"><i className="fas fa-sitemap text-yellow-500 mr-2"></i> Pohon Jaringan Anda</h2>
                    <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-lg mb-6 text-center">
                        <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 border-2 border-yellow-500 shadow-lg">
                            <KreaNovaLogo className="w-12 h-12" />
                        </div>
                        <h3 className="font-bold text-white text-base">{user?.name}</h3>
                        <p className="text-xs text-yellow-400 font-mono mt-1">ID: {user?.referralCode}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 text-center">
                            <p className="text-[10px] text-slate-400 uppercase font-bold mb-2">Tim Kiri</p>
                            <p className="text-2xl font-black text-blue-400">{user?.leftDirects || 0}</p>
                            <span className="text-[9px] text-slate-500 mt-1 block">Anggota</span>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 text-center">
                            <p className="text-[10px] text-slate-400 uppercase font-bold mb-2">Tim Kanan</p>
                            <p className="text-2xl font-black text-emerald-400">{user?.rightDirects || 0}</p>
                            <span className="text-[9px] text-slate-500 mt-1 block">Anggota</span>
                        </div>
                    </div>
                </div>
            );
        };

        const AiStudio = () => {
            const [menus, setMenus] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const menuIcons = ['fa-play-circle', 'fa-shopping-cart', 'fa-film', 'fa-fire', 'fa-book-open', 'fa-paw', 'fa-walking', 'fa-star', 'fa-bolt', 'fa-gem'];

            useEffect(() => {
                const fetchMenus = async () => {
                    setIsLoading(true);
                    if (!window.KreaNovaBackend) return;
                    try {
                        const { db, doc, getDoc } = window.KreaNovaBackend;
                        const linkSnap = await getDoc(doc(db, "settings", "global_links"));
                        if (linkSnap.exists() && linkSnap.data().mainMenus) {
                            setMenus(linkSnap.data().mainMenus);
                        } else {
                            setMenus([
                                { id: 1, name: 'Tutorial Penggunaan GenAI', url: '' },
                                { id: 2, name: 'Affiliate Produk', url: '' },
                                { id: 3, name: 'Drama Short', url: '' },
                                { id: 4, name: 'Motivasiku', url: '' },
                                { id: 5, name: 'Qur\'an Overlay', url: '' },
                                { id: 6, name: 'Animal Creature', url: '' },
                                { id: 7, name: 'Animal Human Activity', url: '' }
                            ]);
                        }
                    } catch (error) {
                        console.error("Gagal memuat menu:", error);
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchMenus();
            }, []);

            return (
                <div className="animate-fade-in relative pb-10">
                    <h2 className="text-2xl font-bold text-white mb-6">AI Video Studio</h2>
                    {isLoading ? (
                        <div className="flex justify-center items-center py-20">
                            <i className="fas fa-circle-notch fa-spin text-blue-500 text-3xl"></i>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {menus.map((menu, index) => {
                                const iconClass = menuIcons[index % menuIcons.length];
                                const hasUrl = menu.url && menu.url.trim() !== '';
                                return (
                                    <a key={menu.id || index} 
                                       href={hasUrl ? menu.url : '#'} 
                                       target={hasUrl ? '_blank' : '_self'}
                                       rel="noopener noreferrer"
                                       onClick={(e) => {
                                            if(!hasUrl) {
                                                e.preventDefault();
                                                alert('Menu ini belum diaktifkan oleh Admin.');
                                            }
                                       }}
                                       className={`block rounded-2xl p-4 border shadow-lg transition-all ${hasUrl ? 'bg-slate-900 border-slate-800 hover:border-blue-500/50 hover:bg-slate-800/80 cursor-pointer' : 'bg-slate-900/50 border-slate-800/50 opacity-60 cursor-not-allowed'} flex flex-col items-center justify-center text-center aspect-square group relative`}>
                                        
                                        {!hasUrl && <div className="absolute top-2 right-2 text-slate-500 text-xs"><i className="fas fa-lock"></i></div>}

                                        <div className={`w-14 h-14 rounded-full flex items-center justify-center mb-3 transition-transform ${hasUrl ? 'bg-slate-800 border border-blue-500/20 text-blue-400 group-hover:scale-110' : 'bg-slate-800/50 text-slate-500'}`}>
                                            <i className={`fas ${iconClass} text-2xl`}></i>
                                        </div>
                                        <h3 className={`font-bold text-xs ${hasUrl ? 'text-slate-200 group-hover:text-white' : 'text-slate-500'}`}>{menu.name}</h3>
                                    </a>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const MemberApp = ({ user, onLogout }) => {
            const [activeTab, setActiveTab] = useState('home');

            const renderContent = () => {
                if (user?.status !== 'ACTIVE') {
                    return (
                        <div className="animate-fade-in py-6">
                            <div className="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-6 mb-6 shadow-xl border border-slate-700/50 flex items-center justify-between">
                                <div>
                                    <h2 className="text-lg font-bold text-white capitalize">{user?.name}</h2>
                                    <p className="text-orange-400 text-xs font-bold mt-1"><i className="fas fa-clock mr-1"></i> Status: PENDING (Belum Aktif)</p>
                                </div>
                                <KreaNovaLogo className="w-12 h-12" />
                            </div>
                            <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 text-center mb-6 shadow-lg">
                                <i className="fas fa-lock text-4xl text-orange-500 mb-3 animate-pulse"></i>
                                <h3 className="text-white font-bold text-base mb-2">Aktivasi Akun Member</h3>
                                <p className="text-slate-400 text-xs mb-5">Selesaikan pembayaran untuk membuka seluruh akses menu AI Studio dan Pohon Jaringan.</p>
                                <div className="bg-slate-950 rounded-xl p-4 border border-slate-800 mb-5">
                                    <span className="text-xs text-slate-500 uppercase block mb-1">Total Tagihan Registrasi</span>
                                    <span className="text-2xl font-extrabold text-white">{formatIDR(user?.billAmount)}</span>
                                </div>
                                <a href="https://tripay.co.id/checkout" target="_blank" rel="noopener noreferrer" className="block w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-400 hover:to-red-500 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg mb-4">
                                    <i className="fas fa-credit-card mr-2"></i> Bayar Sekarang via Tripay
                                </a>
                            </div>
                            <button onClick={onLogout} className="w-full bg-slate-900 text-slate-400 hover:text-white border border-slate-800 font-bold py-3 rounded-xl text-xs">Keluar Akun</button>
                        </div>
                    );
                }

                switch(activeTab) {
                    case 'network': return <NetworkTree user={user} />;
                    case 'ai': return <AiStudio />;
                    case 'profile': return (
                        <div className="animate-fade-in pb-10">
                            <div className="flex items-center gap-4 mb-8 bg-slate-900 p-5 rounded-2xl border border-slate-800"><KreaNovaLogo className="w-14 h-14" /><div><h2 className="text-lg font-bold text-white capitalize">{user?.name}</h2><span className="bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full text-[10px] font-bold">AKUN AKTIF</span></div></div>
                            <div className="bg-slate-900 rounded-2xl p-5 border border-slate-800 space-y-4 mb-8 divide-y divide-slate-800/50">
                                <div className="pt-2 first:pt-0"><p className="text-[10px] text-slate-500 uppercase font-bold">Email</p><p className="text-white text-sm">{user?.email}</p></div>
                                <div className="pt-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Nomor WA</p><p className="text-white text-sm">{user?.phone}</p></div>
                                <div className="pt-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Sponsor</p><p className="text-emerald-400 text-sm font-mono">{user?.sponsor}</p></div>
                            </div>
                            <button onClick={onLogout} className="w-full bg-red-950/40 text-red-400 border border-red-900/50 font-bold py-3 rounded-xl text-xs">Keluar Akun</button>
                        </div>
                    );
                    default: return <Dashboard user={user} />;
                }
            };

            return (
                <div 
                    className="w-full max-w-md mx-auto bg-slate-950 flex flex-col relative overflow-hidden font-sans border-x border-slate-800 shadow-2xl" 
                    style={{ height: '100dvh' }}
                >
                    <header className="h-16 bg-slate-900/95 border-b border-slate-800 flex items-center px-4 shrink-0 z-20 backdrop-blur-md justify-between">
                        <div className="flex items-center">
                            <KreaNovaLogo className="w-8 h-8 mr-2.5" />
                            <h1 className="font-bold text-sm tracking-wide text-white">KreaNova AI</h1>
                        </div>
                        <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700">Mobile Portal</span>
                    </header>
                    <main className="flex-1 overflow-y-auto p-4 custom-scrollbar relative z-10">{renderContent()}</main>
                    <nav className="h-16 bg-slate-900/95 border-t border-slate-800 flex justify-around items-center shrink-0 z-20 pb-safe">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'home' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-home text-lg mb-1"></i><span className="text-[9px] font-semibold">Beranda</span></button>
                        <button onClick={() => setActiveTab('network')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'network' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-sitemap text-lg mb-1"></i><span className="text-[9px] font-semibold">Jaringan</span></button>
                        <button onClick={() => setActiveTab('ai')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'ai' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-robot text-lg mb-1"></i><span className="text-[9px] font-semibold">AI Studio</span></button>
                        <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'profile' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-user-circle text-lg mb-1"></i><span className="text-[9px] font-semibold">Profil</span></button>
                    </nav>
                </div>
            );
        };

        const AppWrapper = () => {
            const params = new URLSearchParams(window.location.search);
            const initialView = params.has('ref') ? 'REGISTER' : 'LOGIN';

            const [view, setView] = useState(initialView); 
            const [user, setUser] = useState(null);
            const [loadingApp, setLoadingApp] = useState(true);

            useEffect(() => {
                const checkAuth = () => {
                    if (window.KreaNovaBackend && window.KreaNovaBackend.auth) {
                        const unsub = window.KreaNovaBackend.auth.onAuthStateChanged(async (firebaseUser) => {
                            if (firebaseUser) {
                                try {
                                    const userDocRef = window.KreaNovaBackend.doc(window.KreaNovaBackend.db, "users", firebaseUser.uid);
                                    const userDoc = await window.KreaNovaBackend.getDoc(userDocRef);
                                    if(userDoc.exists()) {
                                        setUser(userDoc.data()); setView('APP');
                                    } else { window.KreaNovaBackend.signOut(window.KreaNovaBackend.auth); }
                                } catch (err) { console.error(err); }
                            }
                            setLoadingApp(false);
                        });
                        return unsub;
                    } else { setTimeout(checkAuth, 500); }
                };
                const unsubscribe = checkAuth();
                return () => { if(typeof unsubscribe === 'function') unsubscribe(); };
            }, []);

            const handleLogout = async () => {
                if (window.KreaNovaBackend) {
                    await window.KreaNovaBackend.signOut(window.KreaNovaBackend.auth);
                    setUser(null); setView('LOGIN');
                }
            };

            if (loadingApp) return <div className="min-h-screen bg-slate-950 flex justify-center items-center"><KreaNovaLogo className="w-16 h-16 animate-pulse" /></div>;

            if (view === 'LOGIN') return <ErrorBoundary><LoginPage onLogin={(u) => { setUser(u); setView('APP'); }} onNavigateRegister={() => setView('REGISTER')} /></ErrorBoundary>;
            if (view === 'REGISTER') return <ErrorBoundary><RegisterPage onRegister={(u) => { setUser(u); setView('APP'); }} onNavigateLogin={() => setView('LOGIN')} /></ErrorBoundary>;
            
            return <ErrorBoundary><MemberApp user={user} onLogout={handleLogout} /></ErrorBoundary>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppWrapper />);
    </script>
</body>
</html>
