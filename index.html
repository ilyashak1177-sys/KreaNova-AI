<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #cbd5e1; margin: 0; padding: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 0px; height: 0px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            window.KreaNovaBackend = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, doc, setDoc, getDoc, collection, query, where, getDocs, serverTimestamp };
        } catch (error) {
            console.error("Firebase Initialization Error:", error);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);

        // --- SISTEM NOTIFIKASI TELEGRAM ---
        window.sendTelegramNotification = (userData) => {
            // GANTI DUA BARIS INI DENGAN DATA ASLI ANDA
            const botToken = "8891581094:AAEoyvV_4f4OFOL3_cL5pMNAy3q93nd5duo"; // <-- Paste Token Anda di sini
            const chatId = "8920622995"; // <-- Paste Angka Chat ID Anda di sini

            // JANGAN UBAH KODE DI BAWAH INI
            if (!botToken || botToken.includes('TOKEN_BOT_TELEGRAM_ANDA')) return;
            
            const message = `
🔔 *PENDAFTAR KREANOVA BARU!* 🔔
====================
👤 Nama: ${userData.name}
📱 No WA: ${userData.phone}
📧 Email: ${userData.email}
🤝 Sponsor: ${userData.sponsor}
📍 Posisi: ${userData.position}
💰 Tagihan: Rp ${new Intl.NumberFormat('id-ID').format(userData.billAmount)}
====================
Silakan cek Panel Admin untuk Aktivasi!`;

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(e => console.error("Gagal kirim Telegram:", e));
        };
        // --- AKHIR SISTEM NOTIFIKASI TELEGRAM ---

        const KreaNovaLogo = ({ className = "w-12 h-12" }) => (
            <img 
                src="IMG_20260820_224441.jpg" 
                alt="KreaNova AI Logo" 
                className={`${className} object-cover rounded-full shadow-[0_0_15px_rgba(212,175,55,0.4)] border-2 border-[#d4af37]/60 bg-slate-900 transition-all duration-300`}
                onError={(e) => {
                    e.target.onerror = null; 
                    e.target.src = "https://ui-avatars.com/api/?name=KreaNova+AI&background=020617&color=d4af37&rounded=true&bold=true&border=1";
                }}
            />
        );

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { 
                this.setState({ errorMsg: error.toString() });
                console.error("React Error Caught:", error); 
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
                            <i className="fas fa-tools text-orange-500 text-5xl mb-4"></i>
                            <h1 className="text-white text-xl font-bold mb-2">Pembaruan Sistem Berlangsung</h1>
                            <p className="text-slate-400 text-xs mb-6 max-w-xs">{this.state.errorMsg}</p>
                            <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Muat Ulang Layar</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const LoginPage = ({ onLogin, onNavigateRegister }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [isResetting, setIsResetting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true); 
                setErrorMsg('');
                
                let retries = 0;
                while (!window.KreaNovaBackend && retries < 20) {
                    await new Promise(r => setTimeout(r, 500));
                    retries++;
                }

                if (!window.KreaNovaBackend) {
                    setErrorMsg("Gagal memuat sistem. Pastikan internet stabil."); 
                    setIsLoading(false); 
                    return;
                }

                try {
                    const { auth, signInWithEmailAndPassword } = window.KreaNovaBackend;
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    onLogin(userCredential.user);
                } catch (error) {
                    setErrorMsg("Email atau kata sandi salah. Silakan periksa kembali.");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleResetPassword = async () => {
                if (!email) {
                    setErrorMsg("Masukkan alamat email Anda terlebih dahulu di kolom email.");
                    return;
                }
                setIsResetting(true);
                setErrorMsg('');
                setSuccessMsg('');
                try {
                    const { auth, sendPasswordResetEmail } = window.KreaNovaBackend;
                    await sendPasswordResetEmail(auth, email);
                    setSuccessMsg("Tautan reset password telah dikirim ke email Anda!");
                } catch (error) {
                    setErrorMsg("Gagal mereset password. Pastikan email terdaftar.");
                } finally {
                    setIsResetting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 z-0"></div>
                    
                    <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 overflow-hidden">
                        <div className="flex justify-center mb-4"><KreaNovaLogo className="w-24 h-24" /></div>
                        <h2 className="text-2xl font-bold text-center text-white mb-1">KreaNova AI</h2>
                        <p className="text-center text-slate-400 text-xs mb-8 uppercase tracking-widest">Portal Member</p>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in"><i className="fas fa-exclamation-circle mr-1"></i> {errorMsg}</div>}
                        {successMsg && <div className="bg-emerald-500/10 border border-emerald-500/50 text-emerald-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in"><i className="fas fa-check-circle mr-1"></i> {successMsg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="space-y-3">
                                <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Email</label>
                                    <input type="email" placeholder="Masukkan email..." value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-[10px] text-slate-400 font-bold uppercase">Kata Sandi</label>
                                        <button type="button" onClick={handleResetPassword} disabled={isResetting} className="text-[10px] font-bold text-blue-400 hover:text-blue-300">
                                            {isResetting ? 'Mengirim...' : 'Lupa Password?'}
                                        </button>
                                    </div>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 pr-12 text-sm focus:border-blue-500 focus:outline-none transition" required />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300 transition-colors">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-6 flex items-center justify-center">
                                {isLoading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : "Masuk ke Akun"}
                            </button>
                        </form>
                        <div className="mt-6 text-center border-t border-slate-800 pt-5">
                            <button type="button" onClick={onNavigateRegister} className="text-slate-400 text-sm">Belum punya akun? <span className="text-yellow-500 font-bold">Daftar Sekarang</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const RegisterPage = ({ onRegister, onNavigateLogin }) => {
            const params = new URLSearchParams(window.location.search);
            const initialRef = params.get('ref') ? params.get('ref').toUpperCase() : 'KREANOVA';

            const [sponsor, setSponsor] = useState(initialRef);
            const [position, setPosition] = useState('KIRI');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true); 
                setErrorMsg('');
                
                try {
                    const { auth, db, createUserWithEmailAndPassword, doc, setDoc } = window.KreaNovaBackend;
                    
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    const finalSponsor = (!sponsor || sponsor.trim() === '') ? 'KREANOVA' : sponsor.toUpperCase();
                    const refCode = "KN" + Math.floor(10000 + Math.random() * 90000);
                    const uniqueCode = Math.floor(Math.random() * 900) + 100;
                    const billAmount = 150000 + uniqueCode;

                    const userData = {
                        userId: user.uid,
                        name: name,
                        email: email,
                        phone: phone,
                        sponsor: finalSponsor,
                        upline: finalSponsor, 
                        position: position,
                        referralCode: refCode,
                        billAmount: billAmount,
                        walletAvailable: 0,
                        leftDirects: 0,
                        rightDirects: 0,
                        isQualified: false,
                        bankName: "",
                        bankAccount: "",
                        status: "PENDING",
                        createdAt: new Date().toISOString()
                    };

                    await setDoc(doc(db, "users", user.uid), userData);
                    
                    if (typeof window.sendTelegramNotification === 'function') {
                        window.sendTelegramNotification(userData);
                    }

                    onRegister(userData);
                } catch (error) {
                    setErrorMsg("Gagal mendaftar: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 z-0"></div>
                    <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 overflow-hidden my-8">
                        <div className="flex justify-center mb-4"><KreaNovaLogo className="w-20 h-20" /></div>
                        <h2 className="text-2xl font-bold text-center text-white mb-1">Daftar Akun</h2>
                        <p className="text-center text-slate-400 text-xs mb-6">Bergabung dengan KreaNova AI</p>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4 text-center"><i className="fas fa-exclamation-circle mr-1"></i> {errorMsg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Kode Referral</label>
                                <input type="text" value={sponsor} onChange={e => setSponsor(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-yellow-500 font-mono rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none" placeholder="KREANOVA" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Posisi Kaki</label>
                                <select value={position} onChange={e => setPosition(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none appearance-none">
                                    <option value="KIRI">Kiri (Left)</option>
                                    <option value="KANAN">Kanan (Right)</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Nama Sesuai KTP</label>
                                <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none" placeholder="Nama Lengkap" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">No WhatsApp</label>
                                <input type="tel" required value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none" placeholder="08..." />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Email</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none" placeholder="email@gmail.com" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Password</label>
                                <div className="relative">
                                    <input type={showPassword ? "text" : "password"} required value={password} onChange={e => setPassword(e.target.value)} minLength="6" className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 pr-12 text-sm focus:border-blue-500 outline-none" placeholder="Minimal 6 karakter" />
                                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300">
                                        <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-4 flex items-center justify-center">
                                {isLoading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : "Daftar Sekarang"}
                            </button>
                        </form>
                        <div className="mt-6 text-center border-t border-slate-800 pt-5">
                            <button type="button" onClick={onNavigateLogin} className="text-slate-400 text-sm">Sudah punya akun? <span className="text-blue-500 font-bold">Masuk</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user }) => {
            const [copied, setCopied] = useState(false);
            const fullLink = `${window.location.origin}/?ref=${user?.referralCode || ''}`;
            const shareText = encodeURIComponent(`Halo! Mari bergabung dengan KreaNova AI, platform cerdas untuk solusi digital Anda. Daftar menggunakan link rujukan saya di bawah ini:\n\n${fullLink}`);

            const handleCopy = () => {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(fullLink)
                        .then(() => showCopied())
                        .catch(() => fallbackCopy());
                } else {
                    fallbackCopy();
                }
            };

            const fallbackCopy = () => {
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = fullLink;
                    textArea.style.position = "fixed"; document.body.appendChild(textArea);
                    textArea.focus(); textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showCopied();
                } catch (err) { console.error('Fallback copy error', err); }
            };

            const showCopied = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };

            const handleShare = () => {
                if (navigator.share) {
                    navigator.share({
                        title: 'Undangan KreaNova AI',
                        text: shareText,
                        url: fullLink
                    }).catch(console.error);
                }
            };

            return (
                <div className="bg-white -m-4 p-5 min-h-[100dvh] animate-fade-in pb-24 text-slate-900 font-sans">
                    {/* Welcome Text */}
                    <div className="mb-5 flex justify-between items-start">
                        <div>
                            <p className="text-sm text-slate-600 mb-1">Selamat datang kembali,</p>
                            <h2 className="text-3xl font-extrabold text-[#113f28] tracking-tight">Hi {user?.name?.split(' ')[0]}!</h2>
                            <p className="text-xs font-bold text-slate-500 mt-1 uppercase">ID: {user?.referralCode}</p>
                        </div>
                        <div className="w-12 h-12 rounded-full border-2 border-[#113f28] overflow-hidden shadow-md bg-slate-100 flex items-center justify-center">
                            <i className="fas fa-user-tie text-2xl text-slate-400"></i>
                        </div>
                    </div>

                    {/* Search Bar */}
                    <div className="bg-slate-100 rounded-full py-3 px-5 flex items-center mb-6 border border-slate-200 shadow-inner">
                        <i className="fas fa-search text-slate-400 mr-3 text-lg"></i>
                        <input type="text" placeholder="Search" className="bg-transparent outline-none w-full text-sm text-slate-700 font-medium placeholder-slate-400" />
                    </div>

                    {/* Promo Card */}
                    <div className="border-2 border-[#113f28] rounded-3xl p-5 mb-6 relative bg-white shadow-xl overflow-hidden">
                        <div className="absolute right-[-20px] top-[-10px] opacity-5">
                            <i className="fas fa-robot text-9xl text-[#113f28]"></i>
                        </div>
                        
                        <div className="w-2/3 relative z-10">
                            <h3 className="text-2xl font-black text-[#113f28] leading-tight mb-2">KreaNova AI<br/>Mobile Portal</h3>
                            <p className="text-xs text-slate-600 font-medium mb-5 pr-2">Optimalkan jaringan Anda.</p>
                        </div>
                        
                        <div className="bg-slate-200 p-3 rounded-xl text-center text-[10px] sm:text-xs text-slate-800 font-mono mb-4 truncate border border-slate-300 relative z-10 shadow-inner">
                            {fullLink}
                        </div>
                        
                        <div className="flex gap-3 relative z-10">
                            <button onClick={handleCopy} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-xs font-bold shadow-md transition-all flex justify-center items-center">
                                <i className={`fas ${copied ? 'fa-check' : 'fa-copy'} mr-2`}></i> {copied ? "Tersalin!" : "Salin Link"}
                            </button>
                            <button onClick={handleShare} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-xs font-bold shadow-md transition-all flex justify-center items-center">
                                <i className="fas fa-share-nodes mr-2"></i> Bagikan
                            </button>
                        </div>
                    </div>

                    {/* Wallet Card */}
                    <div className="bg-[#297839] rounded-3xl p-6 mb-6 text-white shadow-2xl relative overflow-hidden">
                        <div className="absolute right-0 bottom-0 opacity-10 transform translate-x-1/4 translate-y-1/4">
                            <i className="fas fa-wallet text-9xl"></i>
                        </div>
                        <p className="text-xs uppercase font-bold text-green-100 tracking-wider mb-2 relative z-10">Saldo Tersedia</p>
                        <h3 className="text-4xl font-black relative z-10 text-white drop-shadow-md">{formatIDR(user?.walletAvailable)}</h3>
                    </div>

                    {/* Statistics */}
                    <div className="flex justify-between items-end mb-4 px-1">
                        <h3 className="font-extrabold text-[#113f28] text-xl tracking-tight">Statistik Jaringan Anda</h3>
                        <span className="text-xs font-bold text-slate-500 cursor-pointer hover:text-[#113f28]">View all</span>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                        {/* Stat 1 */}
                        <div className="bg-[#297839] p-4 rounded-3xl text-white shadow-lg flex flex-col justify-center">
                             <div className="flex items-center gap-3 mb-3">
                                 <div className="w-8 h-8 bg-white text-[#297839] rounded-full flex items-center justify-center shadow"><i className="fas fa-dollar-sign font-black text-sm"></i></div>
                                 <p className="text-[10px] font-semibold leading-tight text-green-50">Jumlah Bonus<br/>Sponsor</p>
                             </div>
                             <p className="font-black text-lg pl-1 drop-shadow-sm">{formatIDR(((user?.leftDirects || 0) + (user?.rightDirects || 0)) * 40000)}</p>
                        </div>
                        {/* Stat 2 */}
                        <div className="bg-[#e6f0e9] p-4 rounded-3xl text-[#113f28] shadow border border-green-200/50 flex flex-col justify-center">
                             <div className="flex items-center gap-3 mb-3">
                                 <div className="w-8 h-8 bg-[#113f28] text-white rounded-full flex items-center justify-center shadow"><i className="fas fa-medal text-sm"></i></div>
                                 <p className="text-[10px] font-bold leading-tight">Bonus<br/>Qualified</p>
                             </div>
                             <p className="font-black text-sm pl-1">Level: <span className="text-yellow-600">{user?.isQualified ? 'Gold' : 'Basic'}</span></p>
                        </div>
                        {/* Stat 3 */}
                        <div className="bg-[#e6f0e9] p-4 rounded-3xl text-[#113f28] shadow border border-green-200/50 flex flex-col justify-center">
                             <div className="flex items-center gap-3 mb-3">
                                 <div className="w-8 h-8 bg-[#113f28] text-white rounded-full flex items-center justify-center shadow"><i className="fas fa-users text-sm"></i></div>
                                 <p className="text-[10px] font-bold leading-tight">Jumlah<br/>Referral</p>
                             </div>
                             <p className="font-black text-sm pl-1">{(user?.leftDirects || 0) + (user?.rightDirects || 0)} Referral</p>
                        </div>
                        {/* Stat 4 */}
                        <div className="bg-[#e6f0e9] p-4 rounded-3xl text-[#113f28] shadow border border-green-200/50 flex flex-col justify-center">
                             <div className="flex items-center gap-3 mb-3">
                                 <div className="w-8 h-8 bg-[#113f28] text-white rounded-full flex items-center justify-center shadow"><i className="fas fa-chart-line text-sm"></i></div>
                                 <p className="text-[10px] font-bold leading-tight">Total Komisi<br/>Bulan Ini</p>
                             </div>
                             <p className="font-black text-sm pl-1">{formatIDR(user?.walletAvailable)}</p>
                        </div>
                    </div>
                </div>
            );
        };

        const NetworkTree = ({ user }) => {
            const [viewRoot, setViewRoot] = useState(user);
            const [history, setHistory] = useState([]);
            const [leftNode, setLeftNode] = useState(null);
            const [rightNode, setRightNode] = useState(null);
            const [loadingTree, setLoadingTree] = useState(false);
            
            const [showModal, setShowModal] = useState(false);
            const [modalPos, setModalPos] = useState('');
            const [regName, setRegName] = useState('');
            const [regPhone, setRegPhone] = useState('');
            const [regEmail, setRegEmail] = useState('');
            const [regPass, setRegPass] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [regMsg, setRegMsg] = useState({ type: '', text: '' });

            useEffect(() => {
                const fetchTree = async () => {
                    if (!window.KreaNovaBackend || !viewRoot) return;
                    setLoadingTree(true);
                    setLeftNode(null); setRightNode(null);
                    try {
                        const { db, collection, query, where, getDocs } = window.KreaNovaBackend;
                        const q = query(collection(db, "users"), where("upline", "==", viewRoot.referralCode), where("status", "==", "ACTIVE"));
                        const snap = await getDocs(q);
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.position === 'KIRI') setLeftNode(data);
                            if (data.position === 'KANAN') setRightNode(data);
                        });
                    } catch (e) { console.error("Error tree:", e); }
                    setLoadingTree(false);
                };
                fetchTree();
            }, [viewRoot]);

            const handleDrillDown = (nodeData) => {
                if(!nodeData) return;
                setHistory([...history, viewRoot]);
                setViewRoot(nodeData);
            };

            const handleGoUp = () => {
                if(history.length === 0) return;
                const newHistory = [...history];
                const prev = newHistory.pop();
                setHistory(newHistory);
                setViewRoot(prev);
            };

            const handleRegisterDownline = async (e) => {
                e.preventDefault(); setIsSubmitting(true); setRegMsg({ type: '', text: '' });
                try {
                    const { db, doc, setDoc } = window.KreaNovaBackend;
                    // Mock UID for downline to prevent primary account logout
                    const newUid = "mock_uid_" + Date.now(); 
                    const refCode = "KN" + Math.floor(10000 + Math.random() * 90000);
                    const billAmount = 150000 + Math.floor(Math.random() * 900) + 100;

                    const downlineData = {
                        userId: newUid,
                        name: regName, email: regEmail, phone: regPhone,
                        sponsor: user.referralCode,
                        upline: viewRoot.referralCode,
                        position: modalPos,
                        referralCode: refCode,
                        billAmount: billAmount,
                        walletAvailable: 0, leftDirects: 0, rightDirects: 0,
                        isQualified: false, bankName: "", bankAccount: "",
                        status: "PENDING",
                        createdAt: new Date().toISOString()
                    };

                    await setDoc(doc(db, "users", newUid), downlineData);
                    if (typeof window.sendTelegramNotification === 'function') {
                        window.sendTelegramNotification(downlineData);
                    }

                    setRegMsg({ type: 'success', text: `Sukses! ${regName} terdaftar di kaki ${modalPos}.` });
                    setRegName(''); setRegPhone(''); setRegEmail(''); setRegPass('');
                    setTimeout(() => { setShowModal(false); setRegMsg({type:'', text:''}); }, 2500);
                } catch (error) {
                    setRegMsg({ type: 'error', text: error.message });
                } finally { setIsSubmitting(false); }
            };

            const renderNode = (nodeData, position) => {
                const posColor = position === 'KIRI' ? 'blue' : 'emerald';
                
                if (loadingTree) return (
                    <div className="flex flex-col items-center w-[45%]"><div className="bg-slate-900/50 border border-slate-800 p-4 rounded-xl text-center w-full h-[100px] flex items-center justify-center"><i className="fas fa-spinner fa-spin text-slate-500"></i></div></div>
                );

                if (nodeData) return (
                    <div className="flex flex-col items-center w-[45%] relative cursor-pointer group" onClick={() => handleDrillDown(nodeData)}>
                        <div className="w-0.5 h-4 bg-slate-600 mb-0"></div>
                        <div className={`bg-slate-950/80 border-2 border-${posColor}-500/50 p-3 rounded-xl text-center w-full shadow-lg relative transition-all group-hover:scale-105 group-hover:border-${posColor}-400`}>
                            <div className={`w-8 h-8 mx-auto bg-${posColor}-600 rounded-full flex items-center justify-center mb-2 shadow-inner border border-${posColor}-400`}><i className="fas fa-user text-white text-xs"></i></div>
                            <p className="text-[10px] text-white font-bold truncate max-w-full" title={nodeData.name}>{nodeData.name}</p>
                            <p className={`text-[8px] text-${posColor}-400 font-mono mt-0.5`}>ID: {nodeData.referralCode}</p>
                            <div className="mt-2 pt-2 border-t border-slate-800 text-[8px] text-slate-400 group-hover:text-white transition-colors"><i className="fas fa-sitemap mr-1"></i> Lihat Tim</div>
                        </div>
                        <div className="w-16 h-4 border-t border-l border-r border-slate-700 mt-0 opacity-50"></div>
                    </div>
                );

                return (
                    <div className="flex flex-col items-center w-[45%]">
                        <div className="w-0.5 h-4 bg-slate-600 mb-0"></div>
                        <div className={`bg-slate-950/80 border border-slate-700 border-dashed p-4 rounded-xl text-center w-full shadow-lg relative group transition-all hover:border-${posColor}-500/50`}>
                            <p className="text-[10px] text-slate-500 uppercase font-bold mb-3">Tim {position}</p>
                            <button onClick={() => { setModalPos(position); setShowModal(true); }} className={`w-full bg-${posColor}-600/20 hover:bg-${posColor}-600 text-${posColor}-400 hover:text-white border border-${posColor}-500/50 text-[10px] font-bold py-2 rounded-lg transition-all shadow-md flex justify-center items-center`}><i className="fas fa-user-plus mr-1"></i>Isi {position}</button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in pb-10">
                    <h2 className="text-xl font-bold text-white mb-6"><i className="fas fa-sitemap text-yellow-500 mr-2"></i> Pohon Jaringan</h2>
                    <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-lg mb-6 flex flex-col items-center relative overflow-hidden">
                        {history.length > 0 && (
                            <button onClick={handleGoUp} className="absolute top-4 left-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-2 rounded-lg text-xs font-bold transition flex items-center z-20 shadow-md"><i className="fas fa-arrow-up mr-2"></i> Naik</button>
                        )}
                        <div className={`bg-slate-800 border-2 ${history.length > 0 ? 'border-blue-500' : 'border-yellow-500'} rounded-full w-16 h-16 flex items-center justify-center z-10 shadow-lg relative mt-4`}><i className="fas fa-user-tie text-2xl text-white"></i></div>
                        <div className="text-center mt-2 z-10">
                            <p className="font-bold text-white text-base">{viewRoot?.name}</p>
                            <p className="text-[10px] text-yellow-400 font-mono bg-yellow-500/10 px-2 rounded border border-yellow-500/30 mt-1 inline-block">ID: {viewRoot?.referralCode}</p>
                        </div>
                        <div className="w-full max-w-[200px] h-6 border-t-2 border-l-2 border-r-2 border-slate-600 rounded-t-xl mt-2 z-0"></div>
                        <div className="flex justify-between w-full max-w-[280px] z-10 -mt-1">
                            {renderNode(leftNode, 'KIRI')}
                            {renderNode(rightNode, 'KANAN')}
                        </div>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
                                <div className="absolute top-0 right-0 p-4"><button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-red-400 transition"><i className="fas fa-times text-xl"></i></button></div>
                                <h3 className="text-xl font-bold text-white mb-1">Isi Tim {modalPos}</h3>
                                <p className="text-xs text-slate-400 mb-4">Penempatan di bawah <strong>{viewRoot?.name}</strong>.</p>
                                {regMsg.text && (<div className={`p-3 rounded-xl mb-4 text-xs text-center border font-bold ${regMsg.type === 'success' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>{regMsg.text}</div>)}
                                <form onSubmit={handleRegisterDownline} className="space-y-3">
                                    <input type="text" required value={regName} onChange={(e) => setRegName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-3 text-sm focus:border-blue-500 outline-none" placeholder="Nama Lengkap" />
                                    <input type="tel" required value={regPhone} onChange={(e) => setRegPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-3 text-sm focus:border-blue-500 outline-none" placeholder="08..." />
                                    <input type="email" required value={regEmail} onChange={(e) => setRegEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-3 text-sm focus:border-blue-500 outline-none" placeholder="Email" />
                                    <div className="relative">
                                        <input type={showRegPass ? "text" : "password"} required value={regPass} onChange={e => setRegPass(e.target.value)} minLength="6" className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl p-3 pr-12 text-sm focus:border-blue-500 outline-none" placeholder="Password (Min 6)" />
                                        <button type="button" onClick={() => setShowRegPass(!showRegPass)} className="absolute right-4 top-3 text-slate-500 hover:text-slate-300"><i className={`fas ${showRegPass ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow mt-2">{isSubmitting ? "Memproses..." : "Daftarkan"}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AiStudio = () => {
            const [tools, setTools] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [notification, setNotification] = useState('');

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3500);
            };

            useEffect(() => {
                const fetchTools = async () => {
                    const defaultTools = [
                        { id: 1, name: 'Tutorial Penggunaan GenAI', icon: 'fa-graduation-cap', colorIdx: 0 },
                        { id: 2, name: 'Affiliate Produk', icon: 'fa-store', colorIdx: 1 },
                        { id: 3, name: 'Drama Short', icon: 'fa-film', colorIdx: 2 },
                        { id: 4, name: 'Motivasiku', icon: 'fa-lightbulb', colorIdx: 3 },
                        { id: 5, name: 'Qur\'an Overlay', icon: 'fa-book-open', colorIdx: 4 },
                        { id: 6, name: 'Animal Creature', icon: 'fa-paw', colorIdx: 5 },
                        { id: 7, name: 'Animal Human Activity', icon: 'fa-users', colorIdx: 6 }
                    ];

                    if (!window.KreaNovaBackend) {
                        setTools(defaultTools);
                        setIsLoading(false);
                        return;
                    }

                    try {
                        const { db, doc, getDoc } = window.KreaNovaBackend;
                        const docSnap = await getDoc(doc(db, "settings", "global_links"));
                        
                        if (docSnap.exists() && docSnap.data().mainMenus) {
                            const fetchedMenus = docSnap.data().mainMenus;
                            const icons = ['fa-robot', 'fa-magic', 'fa-video', 'fa-brain', 'fa-cogs', 'fa-rocket', 'fa-star', 'fa-wand-magic-sparkles', 'fa-microchip', 'fa-atom'];
                            
                            const mergedTools = fetchedMenus.map((menu, index) => ({
                                id: menu.id || index,
                                name: menu.name,
                                url: menu.url,
                                icon: icons[index % icons.length],
                                colorIdx: index % 7 // Asumsi ada 7 kombinasi warna
                            }));
                            setTools(mergedTools);
                        } else {
                            setTools(defaultTools);
                        }
                    } catch (e) {
                        console.error("Gagal memuat link AI Studio:", e);
                        setTools(defaultTools);
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchTools();
            }, []);

            const colorStyles = [
                { bg: 'bg-blue-100', text: 'text-blue-600', border: 'border-blue-200' },
                { bg: 'bg-emerald-100', text: 'text-emerald-600', border: 'border-emerald-200' },
                { bg: 'bg-purple-100', text: 'text-purple-600', border: 'border-purple-200' },
                { bg: 'bg-yellow-100', text: 'text-yellow-600', border: 'border-yellow-200' },
                { bg: 'bg-rose-100', text: 'text-rose-600', border: 'border-rose-200' },
                { bg: 'bg-indigo-100', text: 'text-indigo-600', border: 'border-indigo-200' },
                { bg: 'bg-amber-100', text: 'text-amber-600', border: 'border-amber-200' },
            ];

            return (
                <div className="bg-white -m-4 p-5 min-h-[100dvh] animate-fade-in pb-24 text-slate-900 font-sans">
                    <div className="mb-6 flex justify-between items-start">
                        <div>
                            <h2 className="text-3xl font-extrabold text-[#113f28] tracking-tight">AI Studio</h2>
                            <p className="text-sm font-medium text-slate-500 mt-1">Pusat alat kreasi kecerdasan buatan.</p>
                        </div>
                        <div className="w-12 h-12 rounded-xl bg-[#113f28]/10 text-[#113f28] flex items-center justify-center">
                            <i className="fas fa-microchip text-2xl"></i>
                        </div>
                    </div>

                    {notification && (
                        <div className="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-xl mb-6 shadow-sm flex items-start animate-fade-in">
                            <i className="fas fa-exclamation-circle text-orange-500 mt-0.5 mr-3"></i>
                            <p className="text-xs text-orange-800 font-medium leading-relaxed">{notification}</p>
                        </div>
                    )}

                    {isLoading ? (
                        <div className="flex flex-col items-center justify-center py-20">
                            <i className="fas fa-circle-notch fa-spin text-4xl text-[#297839] mb-4"></i>
                            <p className="text-sm font-bold text-slate-500">Memuat Modul AI...</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 gap-4">
                            {tools.map((tool) => {
                                const style = colorStyles[tool.colorIdx] || colorStyles[0];
                                return (
                                    <div 
                                        key={tool.id}
                                        onClick={() => {
                                            if(tool.url && tool.url.trim() !== '') {
                                                window.open(tool.url, '_blank', 'noopener,noreferrer');
                                            } else {
                                                showNotification(`Akses ke modul "${tool.name}" belum tersedia atau link belum diatur oleh Admin.`);
                                            }
                                        }}
                                        className="bg-white rounded-3xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col items-center text-center cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group relative overflow-hidden"
                                    >
                                        <div className="absolute top-0 right-0 w-16 h-16 bg-slate-50 rounded-bl-full -z-10 group-hover:scale-110 transition-transform"></div>
                                        <div className={`w-16 h-16 rounded-2xl ${style.bg} ${style.text} ${style.border} border flex items-center justify-center mb-4 shadow-sm group-hover:rotate-6 transition-transform duration-300`}>
                                            <i className={`fas ${tool.icon} text-2xl drop-shadow-sm`}></i>
                                        </div>
                                        <h3 className="text-xs font-extrabold text-[#113f28] leading-tight mb-2 line-clamp-2 min-h-[32px]">{tool.name}</h3>
                                        <p className="text-[9px] font-bold uppercase tracking-wider text-slate-400 bg-slate-50 px-3 py-1 rounded-full w-full group-hover:bg-[#113f28] group-hover:text-white transition-colors">Buka Modul</p>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const MemberApp = ({ user, onLogout }) => {
            const [activeTab, setActiveTab] = useState('home');
            const [showBannerPopup, setShowBannerPopup] = useState(false);
            const [bannerUrl, setBannerUrl] = useState('');
            const [tripayUrl, setTripayUrl] = useState('');

            // MENGAMBIL URL GAMBAR BANNER DAN TRIPAY DARI FIREBASE SECARA REALTIME
            useEffect(() => {
                const fetchSettings = async () => {
                    if(!window.KreaNovaBackend) return;
                    try {
                        const { db, doc, getDoc } = window.KreaNovaBackend;
                        const docSnap = await getDoc(doc(db, "settings", "global_links"));
                        if (docSnap.exists()) {
                            if (docSnap.data().bannerLink) setBannerUrl(docSnap.data().bannerLink);
                            if (docSnap.data().tripayLink) setTripayUrl(docSnap.data().tripayLink);
                        }
                    } catch (e) { console.error("Gagal memuat pengaturan:", e); }
                };
                fetchSettings();
            }, []);

            const renderContent = () => {
                // Tampilan khusus jika akun masih tertunda (PENDING)
                if (user?.status === 'PENDING') {
                    return (
                        <div className="animate-fade-in p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl mt-4 text-center">
                            <div className="w-20 h-20 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-orange-500/50">
                                <i className="fas fa-clock text-3xl text-orange-400"></i>
                            </div>
                            <h2 className="text-xl font-bold text-white mb-2">Akun Menunggu Aktivasi</h2>
                            <p className="text-sm text-slate-400 mb-6">Selesaikan pembayaran untuk mengaktifkan akun dan mulai menghasilkan.</p>
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
                                <p className="text-[10px] text-slate-500 uppercase font-bold mb-1">Total Tagihan</p>
                                <p className="text-2xl font-black text-white">{formatIDR(user?.billAmount)}</p>
                            </div>
                            <a href={tripayUrl || "https://tripay.co.id/checkout"} target="_blank" rel="noopener noreferrer" className="block w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-400 hover:to-red-500 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg mb-4 text-center">
                                <i className="fas fa-credit-card mr-2"></i> Bayar Sekarang via Tripay
                            </a>
                            <button onClick={onLogout} className="w-full bg-slate-900 text-slate-400 hover:text-white border border-slate-800 font-bold py-3 rounded-xl text-xs transition-colors">Keluar Akun</button>
                        </div>
                    );
                }

                switch(activeTab) {
                    case 'network': return <NetworkTree user={user} />;
                    case 'ai': return <AiStudio />;
                    case 'profile': return (
                        <div className="animate-fade-in pb-10">
                            <div className="flex items-center gap-4 mb-8 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-md">
                                <KreaNovaLogo className="w-14 h-14" />
                                <div>
                                    <h2 className="text-lg font-bold text-white capitalize">{user?.name}</h2>
                                    <span className="bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full text-[10px] font-bold border border-emerald-500/30">AKUN AKTIF</span>
                                </div>
                            </div>
                            <div className="bg-slate-900 rounded-2xl p-5 border border-slate-800 space-y-4 mb-8 divide-y divide-slate-800/50 shadow-md">
                                <div className="pt-2 first:pt-0"><p className="text-[10px] text-slate-500 uppercase font-bold">Email</p><p className="text-white text-sm">{user?.email}</p></div>
                                <div className="pt-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Nomor WA</p><p className="text-white text-sm">{user?.phone}</p></div>
                                <div className="pt-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Sponsor</p><p className="text-emerald-400 text-sm font-mono">{user?.sponsor}</p></div>
                            </div>
                            <button onClick={onLogout} className="w-full bg-red-950/40 text-red-400 border border-red-900/50 font-bold py-3 rounded-xl text-xs hover:bg-red-900/50 hover:text-white transition-colors shadow-sm">Keluar Akun</button>
                        </div>
                    );
                    default: return <Dashboard user={user} />;
                }
            };

            return (
                <div 
                    className="w-full max-w-md mx-auto bg-slate-950 flex flex-col relative overflow-hidden font-sans shadow-[0_0_40px_rgba(0,0,0,0.5)] border-x border-slate-800/50" 
                    style={{ height: '100dvh' }}
                >
                    <header className="h-16 bg-slate-900/95 border-b border-slate-800 flex items-center px-4 shrink-0 z-20 backdrop-blur-md justify-between shadow-sm">
                        <div className="flex items-center">
                            <KreaNovaLogo className="w-8 h-8 mr-2.5" />
                            <h1 className="font-bold text-sm tracking-wide text-white">KreaNova AI</h1>
                        </div>
                        <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700 shadow-inner">Mobile Portal</span>

                    <main className="flex-1 overflow-y-auto p-4 custom-scrollbar relative z-10 bg-[#f8fafc]">
                        {renderContent()}

                    {showBannerPopup && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-5 bg-slate-950/90 backdrop-blur-sm animate-fade-in">
                            <div className="relative w-full max-w-sm bg-slate-900 border border-slate-700 rounded-3xl overflow-hidden shadow-2xl flex flex-col animate-slide-up">
                                <button onClick={() => setShowBannerPopup(false)} className="absolute top-4 right-4 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center z-10 hover:bg-red-500 transition-colors shadow-lg">
                                    <i className="fas fa-times"></i>
                                </button>
                                {bannerUrl ? (
                                    <img src={bannerUrl} alt="Informasi KreaNova" className="w-full h-auto object-contain max-h-[80vh]" />
                                ) : (
                                    <div className="p-10 text-center text-slate-400 bg-slate-800">
                                        <i className="fas fa-image text-5xl mb-4 text-slate-500"></i>
                                        <p className="text-sm font-medium">Banner informasi belum ditambahkan oleh Admin.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                    
                    <nav className="h-16 bg-slate-900/95 border-t border-slate-800 flex justify-around items-center shrink-0 z-20 pb-safe relative shadow-[0_-5px_15px_rgba(0,0,0,0.3)]">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'home' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-home text-lg mb-1"></i><span className="text-[9px] font-semibold">Beranda</span></button>
                        <button onClick={() => setActiveTab('network')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'network' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-sitemap text-lg mb-1"></i><span className="text-[9px] font-semibold">Jaringan</span></button>
                        
                        {/* Area Tombol Tengah (Logo - Berfungsi sbg tombol Popup Banner) */}
                        <div className="relative -top-6 flex flex-col items-center justify-center cursor-pointer hover:scale-105 transition-transform z-50" onClick={() => setShowBannerPopup(true)}>
                            <div className="w-[60px] h-[60px] bg-gradient-to-b from-[#d4af37] to-yellow-600 rounded-full p-0.5 shadow-[0_5px_15px_rgba(212,175,55,0.4)] flex items-center justify-center">
                                <div className="w-full h-full bg-slate-950 rounded-full flex items-center justify-center overflow-hidden border-[3px] border-slate-900">
                                    <img 
                                        src="IMG_20260820_224441.jpg" 
                                        alt="KreaNova Logo" 
                                        className="w-full h-full object-cover"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://ui-avatars.com/api/?name=KN&background=020617&color=d4af37&bold=true&font-size=0.4";
                                        }}
                                    />
                                </div>
                            </div>
                        </div>

                        <button onClick={() => setActiveTab('ai')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'ai' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-robot text-lg mb-1"></i><span className="text-[9px] font-semibold">AI Studio</span></button>
                        <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center w-16 transition-colors ${activeTab === 'profile' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-300'}`}><i className="fas fa-user-circle text-lg mb-1"></i><span className="text-[9px] font-semibold">Profil</span></button>
                    </nav>
                </div>
            );
        };

        const AppWrapper = () => {
            const params = new URLSearchParams(window.location.search);
            const initialView = params.has('ref') ? 'REGISTER' : 'LOGIN';

            const [view, setView] = useState(initialView); 
            const [user, setUser] = useState(null);
            const [loadingApp, setLoadingApp] = useState(true);

            useEffect(() => {
                const checkAuth = () => {
                    if (window.KreaNovaBackend && window.KreaNovaBackend.auth) {
                        const unsub = window.KreaNovaBackend.auth.onAuthStateChanged(async (firebaseUser) => {
                            if (firebaseUser) {
                                try {
                                    const userDocRef = window.KreaNovaBackend.doc(window.KreaNovaBackend.db, "users", firebaseUser.uid);
                                    const userDoc = await window.KreaNovaBackend.getDoc(userDocRef);
                                    if(userDoc.exists()) {
                                        setUser(userDoc.data()); setView('APP');
                                    } else { window.KreaNovaBackend.signOut(window.KreaNovaBackend.auth); }
                                } catch (err) { console.error(err); }
                            }
                            setLoadingApp(false);
                        });
                        return unsub;
                    } else { setTimeout(checkAuth, 500); }
                };
                const unsubscribe = checkAuth();
                return () => { if(typeof unsubscribe === 'function') unsubscribe(); };
            }, []);

            const handleLogout = async () => {
                if (window.KreaNovaBackend) {
                    await window.KreaNovaBackend.signOut(window.KreaNovaBackend.auth);
                    setUser(null); setView('LOGIN');
                }
            };

            if (loadingApp) return <div className="min-h-screen bg-slate-950 flex justify-center items-center"><KreaNovaLogo className="w-16 h-16 animate-pulse" /></div>;

            if (view === 'LOGIN') return <ErrorBoundary><LoginPage onLogin={(u) => { setUser(u); setView('APP'); }} onNavigateRegister={() => setView('REGISTER')} /></ErrorBoundary>;
            if (view === 'REGISTER') return <ErrorBoundary><RegisterPage onRegister={(u) => { setUser(u); setView('APP'); }} onNavigateLogin={() => setView('LOGIN')} /></ErrorBoundary>;
            
            return <ErrorBoundary><MemberApp user={user} onLogout={handleLogout} /></ErrorBoundary>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppWrapper />);
    </script>
</body>
</html>
