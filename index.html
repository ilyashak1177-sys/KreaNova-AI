<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI | Portal Member</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent;}
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-effect { box-shadow: 0 0 40px rgba(37, 99, 235, 0.15); }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 80px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-[#0b0f19] flex justify-center">
    <div id="root" class="w-full max-w-md min-h-screen relative shadow-2xl bg-[#0b0f19]/90"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            window.KreaNovaWeb = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut, doc, setDoc, getDoc, onSnapshot };
        } catch (error) {
            console.warn("Firebase Init Offline:", error.message);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            return (
                <div className={`fixed top-5 left-1/2 transform -translate-x-1/2 w-11/12 max-w-sm ${bgColor} text-white px-4 py-3 rounded-xl shadow-2xl z-[9999] animate-slide-up flex items-center gap-3`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'} text-lg`}></i>
                    <span className="font-semibold text-sm leading-tight">{message}</span>
                </div>
            );
        };

        const AuthApp = () => {
            const [view, setView] = useState('loading'); 
            const [showPassword, setShowPassword] = useState(false);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            
            const [userAuth, setUserAuth] = useState(null);
            const [userData, setUserData] = useState(null);
            const [appLinks, setAppLinks] = useState({ mainMenus: [], tripayLink: '' });
            const [activeTab, setActiveTab] = useState('home'); 
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');

            const showToast = (msg, type) => setToast({ msg, type });

            useEffect(() => {
                if(!window.KreaNovaWeb) {
                    setView('login');
                    return;
                }
                const { auth, onAuthStateChanged } = window.KreaNovaWeb;
                const unsubAuth = onAuthStateChanged(auth, (user) => {
                    if (user) {
                        setUserAuth(user);
                        setView('dashboard');
                    } else {
                        setUserAuth(null);
                        setUserData(null);
                        setView('login');
                    }
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (view === 'dashboard' && userAuth && window.KreaNovaWeb) {
                    const { db, doc, onSnapshot } = window.KreaNovaWeb;
                    
                    let unsubUser = () => {};
                    try {
                        unsubUser = onSnapshot(doc(db, "users", userAuth.uid), (docSnap) => {
                            if (docSnap.exists()) setUserData(docSnap.data());
                        }, (error) => console.warn("Offline Mode User:", error.message));
                    } catch(e) {}
                    
                    let unsubLinks = () => {};
                    try {
                        unsubLinks = onSnapshot(doc(db, "settings", "global_links"), (docSnap) => {
                            if (docSnap.exists()) setAppLinks(docSnap.data());
                        }, (error) => console.warn("Offline Mode Links:", error.message));
                    } catch(e) {}
                    
                    return () => { unsubUser(); unsubLinks(); };
                }
            }, [view, userAuth]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { auth, signInWithEmailAndPassword } = window.KreaNovaWeb;
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    showToast('Email atau kata sandi salah.', 'error');
                } finally { setLoading(false); }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { auth, db, createUserWithEmailAndPassword, doc, setDoc } = window.KreaNovaWeb;
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, "users", user.uid), {
                        userId: user.uid,
                        name: name,
                        email: email,
                        phone: phone,
                        sponsor: "KREANOVA",
                        bankName: "",
                        bankAccount: "",
                        status: "PENDING",
                        createdAt: new Date().toISOString()
                    });
                    
                    showToast('Pendaftaran sukses!', 'success');
                } catch (error) {
                    showToast('Gagal mendaftar: ' + error.message, 'error');
                } finally { setLoading(false); }
            };

            const handleForgot = async (e) => {
                e.preventDefault();
                if (!email) { showToast('Masukkan alamat email terlebih dahulu.', 'error'); return; }
                setLoading(true);
                try {
                    const { auth, sendPasswordResetEmail } = window.KreaNovaWeb;
                    await sendPasswordResetEmail(auth, email);
                    showToast('Cek email Anda untuk tautan reset password!', 'success');
                    setView('login');
                } catch (error) {
                    showToast('Gagal: Email tidak terdaftar.', 'error');
                } finally { setLoading(false); }
            };

            const handleLogout = async () => {
                try {
                    const { auth, signOut } = window.KreaNovaWeb;
                    await signOut(auth);
                } catch (e) { console.error(e); }
            };

            if (view === 'loading') {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center gap-4">
                        <i className="fas fa-circle-notch fa-spin text-4xl text-blue-500"></i>
                        <p className="text-slate-400 text-sm font-bold animate-pulse">Menghubungkan...</p>
                    </div>
                );
            }

            if (view === 'dashboard') {
                const isLocked = userData?.status !== 'ACTIVE';
                const menuIcons = ['fa-laptop-code', 'fa-shopping-cart', 'fa-film', 'fa-fire', 'fa-book-open', 'fa-paw', 'fa-walking', 'fa-star', 'fa-bolt', 'fa-gem'];

                return (
                    <div className="w-full min-h-screen flex flex-col bg-[#0b0f19] animate-fade-in relative">
                        {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <header className="px-5 pt-8 pb-6 glass-panel rounded-b-[2rem] border-b border-slate-700/50 shadow-lg sticky top-0 z-20">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 p-[2px]">
                                        <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-full h-full rounded-full object-cover border-2 border-[#0b0f19]" onError={(e) => e.target.style.display='none'} />
                                    </div>
                                    <div>
                                        <p className="text-xs text-slate-400">Selamat datang,</p>
                                        <h2 className="text-lg font-bold text-white leading-tight truncate max-w-[150px]">{userData?.name || 'Member'}</h2>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <span className={`px-3 py-1 rounded-full text-[10px] font-bold shadow-lg transition-colors duration-500 ${isLocked ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                                        <i className={`fas ${isLocked ? 'fa-lock' : 'fa-check-circle'} mr-1`}></i>
                                        {isLocked ? 'PENDING' : 'AKTIF'}
                                    </span>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto px-5 pt-6 pb-safe custom-scrollbar">
                            {isLocked && activeTab === 'home' && (
                                <div className="bg-gradient-to-br from-orange-900/40 to-red-900/40 border border-orange-500/30 p-5 rounded-2xl mb-6 shadow-xl relative overflow-hidden animate-slide-up">
                                    <div className="absolute -right-4 -top-4 text-6xl text-orange-500/10"><i className="fas fa-lock"></i></div>
                                    <h3 className="font-bold text-white mb-1"><i className="fas fa-exclamation-circle text-orange-400 mr-2"></i>Aktivasi Akun</h3>
                                    <p className="text-xs text-slate-300 mb-4 leading-relaxed">Fitur KreaNova masih terkunci. Lakukan pembayaran untuk membuka akses penuh 10 Menu.</p>
                                    
                                    {appLinks.tripayLink ? (
                                        <a href={appLinks.tripayLink} target="_blank" className="block w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-black py-3 rounded-xl shadow-lg text-center text-sm transform transition active:scale-95">
                                            <i className="fas fa-credit-card mr-2"></i>Bayar Sekarang
                                        </a>
                                    ) : (
                                        <button disabled className="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl text-sm"><i className="fas fa-spinner fa-spin mr-2"></i>Menunggu Link Payment...</button>
                                    )}
                                </div>
                            )}

                            {activeTab === 'home' && (
                                <div className="animate-fade-in">
                                    {}
                                    {!isLocked && (
                                        <div className="bg-gradient-to-r from-blue-600/90 to-indigo-800/90 backdrop-blur-md border border-blue-500/30 rounded-2xl p-5 mb-6 shadow-lg shadow-blue-900/20 relative overflow-hidden animate-slide-up">
                                            <div className="absolute -right-2 -top-2 text-7xl text-white/10 transform rotate-12"><i className="fas fa-crown"></i></div>
                                            <h3 className="text-white font-bold text-lg mb-1 flex items-center">
                                                <i className="fas fa-tachometer-alt text-blue-300 mr-2"></i>Dashboard Utama
                                            </h3>
                                            <p className="text-blue-100 text-xs leading-relaxed relative z-10">
                                                Akses Anda sudah terbuka! Silakan jelajahi berbagai fitur cerdas KreaNova AI melalui menu navigasi di bawah ini.
                                            </p>
                                        </div>
                                    )}

                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-white text-lg">Eksplorasi Fitur</h3>
                                        <span className="text-xs font-bold text-blue-400 bg-blue-500/10 px-2 py-1 rounded-md">{appLinks.mainMenus?.length || 0} Menu</span>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        {appLinks.mainMenus && appLinks.mainMenus.length > 0 ? (
                                            appLinks.mainMenus.map((menu, i) => {
                                                const iconClass = menuIcons[i % menuIcons.length];
                                                return (
                                                    <a key={menu.id || i} 
                                                    href={isLocked ? '#' : (menu.url || '#')} 
                                                    target={isLocked || !menu.url ? '_self' : '_blank'} 
                                                    onClick={(e) => { if(isLocked) { e.preventDefault(); showToast('Akses ditolak! Silakan bayar untuk aktivasi akun.', 'error'); } }}
                                                    className={`bg-slate-900/80 border ${isLocked ? 'border-slate-800 opacity-70' : 'border-slate-700 hover:border-blue-500/50 active:scale-95'} p-4 rounded-2xl flex flex-col items-start transition-all duration-300 relative overflow-hidden group`}>
                                                        {isLocked && <div className="absolute top-3 right-3 text-slate-500 text-xs"><i className="fas fa-lock"></i></div>}
                                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center mb-3 shadow-inner transition-transform ${isLocked ? 'bg-slate-800 text-slate-500' : 'bg-gradient-to-br from-blue-500/20 to-purple-500/20 text-blue-400 group-hover:scale-110'}`}>
                                                            <i className={`fas ${iconClass} text-lg`}></i>
                                                        </div>
                                                        <span className={`text-xs font-bold leading-tight ${isLocked ? 'text-slate-400' : 'text-slate-200'}`}>{menu.name || 'Menu'}</span>
                                                    </a>
                                                );
                                            })
                                        ) : (
                                            <div className="col-span-2 text-center py-8 bg-slate-900/50 rounded-2xl border border-dashed border-slate-700">
                                                <i className="fas fa-sync-alt fa-spin text-2xl mb-2 text-slate-500"></i>
                                                <p className="text-xs text-slate-400">Sinkronisasi menu dari server...</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'profile' && (
                                <div className="animate-fade-in space-y-4">
                                    <h3 className="font-bold text-white text-lg mb-4">Profil Saya</h3>
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <p className="text-xs text-slate-400 mb-1">Nama Lengkap</p>
                                        <p className="text-sm text-white font-semibold">{userData?.name}</p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <p className="text-xs text-slate-400 mb-1">Email</p>
                                        <p className="text-sm text-white font-semibold">{userData?.email}</p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <p className="text-xs text-slate-400 mb-1">Nomor WhatsApp</p>
                                        <p className="text-sm text-emerald-400 font-mono">{userData?.phone}</p>
                                    </div>
                                    <button onClick={handleLogout} className="w-full mt-6 bg-red-500/10 border border-red-500/30 text-red-400 font-bold py-3.5 rounded-xl hover:bg-red-500 hover:text-white transition active:scale-95">
                                        <i className="fas fa-sign-out-alt mr-2"></i>Keluar dari Aplikasi
                                    </button>
                                </div>
                            )}
                        </main>

                        <nav className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md bg-slate-900/95 backdrop-blur-md border-t border-slate-800 rounded-t-3xl z-30 pb-2">
                            <div className="flex justify-around items-center h-16 px-2">
                                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center w-16 gap-1 transition-colors ${activeTab === 'home' ? 'text-blue-400' : 'text-slate-500'}`}>
                                    <i className={`fas fa-home ${activeTab === 'home' ? 'text-lg' : 'text-base'}`}></i>
                                    <span className="text-[9px] font-bold">Beranda</span>
                                </button>
                                <button onClick={() => showToast('Fitur Riwayat akan segera hadir!', 'info')} className="flex flex-col items-center justify-center w-16 gap-1 transition-colors text-slate-500 hover:text-slate-400">
                                    <i className="fas fa-history text-base"></i>
                                    <span className="text-[9px] font-bold">Riwayat</span>
                                </button>
                                <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center justify-center w-16 gap-1 transition-colors ${activeTab === 'profile' ? 'text-blue-400' : 'text-slate-500'}`}>
                                    <i className={`fas fa-user ${activeTab === 'profile' ? 'text-lg' : 'text-base'}`}></i>
                                    <span className="text-[9px] font-bold">Profil</span>
                                </button>
                            </div>
                        </nav>
                    </div>
                );
            }

            return (
                <div className="w-full p-4 relative h-screen flex flex-col justify-center">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}

                    <div className="glass-panel p-8 rounded-3xl w-full animate-fade-in glow-effect shadow-2xl relative z-10">
                        <div className="text-center mb-8">
                            <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-20 h-20 mx-auto rounded-full border-2 border-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.3)] mb-4" onError={(e) => e.target.style.display='none'} />
                            <h1 className="text-2xl font-black text-white tracking-wide">KreaNova AI</h1>
                            <p className="text-xs text-yellow-500 font-bold uppercase tracking-widest mt-1">
                                {view === 'login' ? 'Portal Member' : view === 'register' ? 'Pendaftaran Baru' : 'Pulihkan Akun'}
                            </p>
                        </div>

                        {view === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-5 animate-fade-in">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Email</label>
                                    <div className="relative">
                                        <i className="fas fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-4 focus:border-blue-500 outline-none transition" placeholder="Masukkan email..." />
                                    </div>
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-xs font-bold text-slate-400 uppercase">Kata Sandi</label>
                                        <button type="button" onClick={() => setView('forgot')} className="text-[10px] font-bold text-blue-400 hover:text-blue-300">Lupa Password?</button>
                                    </div>
                                    <div className="relative">
                                        <i className="fas fa-lock absolute left-4 top-3.5 text-slate-500"></i>
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-12 focus:border-blue-500 outline-none transition" placeholder="••••••••" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 hover:text-white transition">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash text-blue-400' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center">
                                    {loading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : 'Masuk ke Dashboard'}
                                </button>
                                <p className="text-center text-xs text-slate-400 mt-4">Belum punya akun? <button type="button" onClick={() => setView('register')} className="text-yellow-400 font-bold hover:underline">Daftar Sekarang</button></p>
                            </form>
                        )}

                        {view === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4 animate-fade-in">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Nama Lengkap</label>
                                    <input type="text" required value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 px-4 focus:border-blue-500 outline-none" placeholder="Nama sesuai KTP" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Nomor WhatsApp</label>
                                    <input type="tel" required value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 px-4 focus:border-blue-500 outline-none" placeholder="0812..." />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Email Aktif</label>
                                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 px-4 focus:border-blue-500 outline-none" placeholder="email@anda.com" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Buat Kata Sandi</label>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 px-4 pr-12 focus:border-blue-500 outline-none" placeholder="Minimal 6 karakter" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 hover:text-white transition">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash text-blue-400' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 active:scale-95 transition flex items-center justify-center">
                                    {loading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : 'Daftar Akun Baru'}
                                </button>
                                <button type="button" onClick={() => setView('login')} className="w-full text-xs font-bold text-slate-400 mt-4 hover:text-white transition"><i className="fas fa-arrow-left mr-2"></i>Kembali ke Halaman Login</button>
                            </form>
                        )}

                        {view === 'forgot' && (
                            <form onSubmit={handleForgot} className="space-y-5 animate-fade-in">
                                <div className="text-center mb-2">
                                    <i className="fas fa-unlock-alt text-4xl text-blue-500 mb-3"></i>
                                    <p className="text-xs text-slate-400">Masukkan email Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.</p>
                                </div>
                                <div>
                                    <div className="relative">
                                        <i className="fas fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-4 focus:border-blue-500 outline-none" placeholder="Alamat Email Terdaftar..." />
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center">
                                    {loading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : 'Kirim Tautan Reset'}
                                </button>
                                <button type="button" onClick={() => setView('login')} className="w-full text-xs font-bold text-slate-400 hover:text-white mt-2 transition"><i className="fas fa-arrow-left mr-2"></i>Kembali ke Login</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
