<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI | Portal Member</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-effect { box-shadow: 0 0 40px rgba(37, 99, 235, 0.15); }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-[#0b0f19]">
    <div id="root" class="w-full flex justify-center items-center"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.KreaNovaWeb = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, doc, setDoc, getDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 4000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            return (
                <div className={`fixed top-5 left-1/2 transform -translate-x-1/2 w-11/12 max-w-sm ${bgColor} text-white px-6 py-3 rounded-xl shadow-2xl z-[9999] animate-slide-up flex items-center gap-3`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'} text-xl`}></i>
                    <span className="font-semibold text-sm">{message}</span>
                </div>
            );
        };

        const AuthApp = () => {
            const [view, setView] = useState('login'); 
            const [showPassword, setShowPassword] = useState(false);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            
            // State User & App Links untuk Dashboard
            const [userData, setUserData] = useState(null);
            const [appLinks, setAppLinks] = useState({ mainMenus: [], tripayLink: '' });
            
            // Form Data
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');

            const showToast = (msg, type) => setToast({ msg, type });

            // LOGIKA FETCH DATA OTOMATIS SAAT MASUK DASHBOARD
            useEffect(() => {
                if (view === 'dashboard') {
                    const fetchDashboardData = async () => {
                        try {
                            const { auth, db, doc, getDoc } = window.KreaNovaWeb;
                            const user = auth.currentUser;
                            if(user) {
                                // Ambil Profil
                                const userSnap = await getDoc(doc(db, "users", user.uid));
                                if(userSnap.exists()) setUserData(userSnap.data());
                            }
                            // Ambil Tautan dari Admin
                            const linkSnap = await getDoc(doc(db, "settings", "global_links"));
                            if(linkSnap.exists()) setAppLinks(linkSnap.data());
                        } catch(e) { console.error("Gagal load data:", e); }
                    };
                    fetchDashboardData();
                }
            }, [view]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { auth, signInWithEmailAndPassword } = window.KreaNovaWeb;
                    await signInWithEmailAndPassword(auth, email, password);
                    setView('dashboard');
                    showToast('Login berhasil!', 'success');
                } catch (error) {
                    showToast('Email atau kata sandi salah.', 'error');
                } finally { setLoading(false); }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const { auth, db, createUserWithEmailAndPassword, doc, setDoc } = window.KreaNovaWeb;
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, "users", user.uid), {
                        userId: user.uid,
                        name: name,
                        email: email,
                        phone: phone,
                        sponsor: "KREANOVA",
                        bankName: "",
                        bankAccount: "",
                        status: "PENDING",
                        createdAt: new Date().toISOString()
                    });

                    showToast('Pendaftaran sukses! Mengalihkan ke Dashboard...', 'success');
                    // Langsung masuk ke dashboard setelah daftar
                    setView('dashboard');
                } catch (error) {
                    showToast('Gagal mendaftar: ' + error.message, 'error');
                } finally { setLoading(false); }
            };

            const handleForgot = async (e) => {
                e.preventDefault();
                if (!email) { showToast('Masukkan alamat email terlebih dahulu.', 'error'); return; }
                setLoading(true);
                try {
                    const { auth, sendPasswordResetEmail } = window.KreaNovaWeb;
                    await sendPasswordResetEmail(auth, email);
                    showToast('Tautan reset password terkirim ke email Anda!', 'success');
                    setView('login');
                } catch (error) {
                    showToast('Gagal: Email tidak terdaftar.', 'error');
                } finally { setLoading(false); }
            };

            // Ikon dinamis untuk 10 menu
            const menuIcons = ['fa-play-circle', 'fa-shopping-cart', 'fa-film', 'fa-fire', 'fa-book-open', 'fa-paw', 'fa-walking', 'fa-star', 'fa-bolt', 'fa-gem'];

            // TAMPILAN DASHBOARD (DINAMIS DARI PANEL ADMIN)
            if (view === 'dashboard') {
                const isLocked = userData?.status !== 'ACTIVE';
                return (
                    <div className="w-full max-w-5xl animate-fade-in self-start pt-10">
                        {/* Header Member */}
                        <header className="glass-panel p-5 rounded-2xl flex justify-between items-center mb-8 border-t-4 border-t-blue-500 shadow-lg">
                            <div className="flex items-center gap-4">
                                <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-12 h-12 rounded-full border-2 border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.3)]" onError={(e) => e.target.style.display='none'} />
                                <div>
                                    <h2 className="text-xl font-bold text-white leading-tight">Halo, {userData?.name || 'Member'}</h2>
                                    <p className={`text-[10px] font-bold uppercase tracking-wider ${isLocked ? 'text-orange-400' : 'text-emerald-400'}`}>
                                        <i className={`fas ${isLocked ? 'fa-clock' : 'fa-check-circle'} mr-1`}></i>
                                        {isLocked ? 'Akun Pending' : 'Premium Member'}
                                    </p>
                                </div>
                            </div>
                            <button onClick={() => { window.KreaNovaWeb.signOut(window.KreaNovaWeb.auth); setView('login'); }} className="text-slate-400 hover:text-red-400 transition" title="Keluar">
                                <i className="fas fa-sign-out-alt text-2xl"></i>
                            </button>
                        </header>

                        {/* TRIPAY GATEWAY: Peringatan Pembayaran (Hanya muncul jika PENDING) */}
                        {isLocked && (
                            <div className="bg-gradient-to-r from-orange-900/50 to-red-900/50 border border-orange-500/30 p-6 md:p-8 rounded-2xl mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl shadow-orange-500/10">
                                <div>
                                    <h3 className="text-xl font-bold text-white mb-2"><i className="fas fa-lock text-orange-400 mr-2"></i>Akses Menu Terkunci</h3>
                                    <p className="text-slate-300 text-sm">Akun Anda belum diaktivasi. Selesaikan pendaftaran melalui Payment Gateway untuk membuka akses penuh 10 Menu KreaNova AI.</p>
                                </div>
                                {appLinks.tripayLink ? (
                                    <a href={appLinks.tripayLink} target="_blank" className="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-400 hover:to-red-400 text-white font-black py-4 px-8 rounded-xl shadow-lg transition whitespace-nowrap transform hover:-translate-y-1 w-full md:w-auto text-center">
                                        <i className="fas fa-credit-card mr-2"></i>Bayar Sekarang
                                    </a>
                                ) : (
                                    <button disabled className="bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl cursor-not-allowed whitespace-nowrap">Link Payment Belum Tersedia</button>
                                )}
                            </div>
                        )}

                        {/* 10 MENU UTAMA KREANOVA (Membaca data dari Super Admin) */}
                        <div>
                            <h3 className="text-xl font-bold text-white mb-6"><i className="fas fa-th-large text-blue-500 mr-2"></i>Menu Utama KreaNova AI</h3>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                                {appLinks.mainMenus && appLinks.mainMenus.length > 0 ? (
                                    appLinks.mainMenus.map((menu, i) => {
                                        const iconClass = menuIcons[i % menuIcons.length];
                                        return (
                                            <a key={menu.id || i} 
                                               href={isLocked ? '#' : (menu.url || '#')} 
                                               target={isLocked || !menu.url ? '_self' : '_blank'} 
                                               onClick={(e) => { if(isLocked) { e.preventDefault(); showToast('Akses ditolak! Silakan bayar terlebih dahulu.', 'error'); } }}
                                               className={`glass-panel p-6 rounded-2xl flex flex-col items-center text-center transition group relative ${isLocked ? 'opacity-60 cursor-not-allowed' : 'hover:border-blue-500/50 hover:bg-slate-800/50'}`}>
                                                
                                                {/* Gembok kecil jika belum aktif */}
                                                {isLocked && <div className="absolute top-4 right-4 text-red-400 text-sm drop-shadow-md"><i className="fas fa-lock"></i></div>}
                                                
                                                <div className={`w-14 h-14 rounded-full flex items-center justify-center mb-4 shadow-lg transition-transform ${isLocked ? 'bg-slate-800 text-slate-500' : 'bg-slate-800/80 text-blue-400 group-hover:scale-110 group-hover:text-blue-300'}`}>
                                                    <i className={`fas ${iconClass} text-2xl`}></i>
                                                </div>
                                                <span className={`text-sm font-bold ${isLocked ? 'text-slate-400' : 'text-slate-200'}`}>{menu.name || 'Menu'}</span>
                                            </a>
                                        );
                                    })
                                ) : (
                                    <div className="col-span-full text-center py-10 text-slate-500 glass-panel rounded-2xl">
                                        <i className="fas fa-sync-alt fa-spin text-3xl mb-3 text-blue-500"></i>
                                        <p>Menunggu Admin mengatur Tautan Menu...</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // TAMPILAN AWAL (LOGIN / REGISTER)
            return (
                <div className="w-full max-w-md relative">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}

                    <div className="glass-panel p-8 rounded-3xl w-full animate-fade-in glow-effect">
                        <div className="text-center mb-8">
                            <img src="IMG_20260820_224441.jpg" alt="Logo" className="w-20 h-20 mx-auto rounded-full border border-yellow-500/50 shadow-[0_0_20px_rgba(234,179,8,0.3)] mb-4" onError={(e) => e.target.style.display='none'} />
                            <h1 className="text-2xl font-black text-white tracking-wide">KreaNova AI</h1>
                            <p className="text-xs text-yellow-500 font-bold uppercase tracking-widest mt-1">
                                {view === 'login' ? 'Portal Member' : view === 'register' ? 'Pendaftaran Baru' : 'Pulihkan Akun'}
                            </p>
                        </div>

                        {view === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-5 animate-fade-in">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Email</label>
                                    <div className="relative">
                                        <i className="fas fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-blue-500 transition" placeholder="Masukkan email..." />
                                    </div>
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-xs font-bold text-slate-400 uppercase">Kata Sandi</label>
                                        <button type="button" onClick={() => setView('forgot')} className="text-[10px] font-bold text-blue-400 hover:text-blue-300 transition">Lupa Password?</button>
                                    </div>
                                    <div className="relative">
                                        <i className="fas fa-lock absolute left-4 top-3.5 text-slate-500"></i>
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-12 focus:outline-none focus:border-blue-500 transition" placeholder="••••••••" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 hover:text-white transition">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash text-blue-400' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1">
                                    {loading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : 'Masuk ke Dashboard'}
                                </button>
                                <p className="text-center text-xs text-slate-400 mt-4">Belum punya akun? <button type="button" onClick={() => setView('register')} className="text-yellow-400 font-bold hover:underline">Daftar Sekarang</button></p>
                            </form>
                        )}

                        {view === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4 animate-fade-in">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Nama Lengkap</label>
                                    <input type="text" required value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 px-4 focus:outline-none focus:border-blue-500" placeholder="Nama sesuai KTP" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Nomor WhatsApp</label>
                                    <input type="tel" required value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 px-4 focus:outline-none focus:border-blue-500" placeholder="0812..." />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Email Aktif</label>
                                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 px-4 focus:outline-none focus:border-blue-500" placeholder="email@anda.com" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Buat Kata Sandi</label>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 px-4 pr-12 focus:outline-none focus:border-blue-500" placeholder="Minimal 6 karakter" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-3.5 text-slate-400 hover:text-white">
                                            <i className={`fas ${showPassword ? 'fa-eye-slash text-blue-400' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 flex items-center justify-center">
                                    {loading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : 'Daftar Akun Baru'}
                                </button>
                                <p className="text-center text-xs text-slate-400 mt-4">Sudah punya akun? <button type="button" onClick={() => setView('login')} className="text-blue-400 font-bold hover:underline">Masuk</button></p>
                            </form>
                        )}

                        {view === 'forgot' && (
                            <form onSubmit={handleForgot} className="space-y-5 animate-fade-in">
                                <div className="text-center mb-2">
                                    <i className="fas fa-unlock-alt text-4xl text-blue-500 mb-3"></i>
                                    <p className="text-xs text-slate-400">Masukkan email Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.</p>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase block mb-1">Alamat Email</label>
                                    <div className="relative">
                                        <i className="fas fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-blue-500 transition" placeholder="Masukkan email terdaftar..." />
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center">
                                    {loading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : 'Kirim Tautan Reset'}
                                </button>
                                <button type="button" onClick={() => setView('login')} className="w-full text-xs font-bold text-slate-400 hover:text-white mt-2 transition">
                                    <i className="fas fa-arrow-left mr-2"></i>Kembali ke Halaman Login
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
