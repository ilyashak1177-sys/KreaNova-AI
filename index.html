<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KreaNova AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; margin: 0; padding: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 0px; height: 0px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Asli Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCWpjChuqzjUe4_foM2gCS4_XoCQE33lHk",
            authDomain: "kreanova-ai.firebaseapp.com",
            projectId: "kreanova-ai",
            storageBucket: "kreanova-ai.firebasestorage.app",
            messagingSenderId: "154161008783",
            appId: "1:154161008783:web:26965ec47a5f40b14f20fa",
            measurementId: "G-Q6B30PVTP0"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            window.KreaNovaBackend = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, doc, setDoc, getDoc, collection, query, where, getDocs, serverTimestamp };
        } catch (error) {
            console.error("Firebase Initialization Error:", error);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);

        const KreaNovaLogo = ({ className = "w-12 h-12" }) => (
            <img 
                src="Gemini_Generated_Image_9ytdav9ytdav9ytd_3.jpeg" 
                alt="KreaNova AI Logo" 
                className={`${className} object-cover rounded-full shadow-[0_0_15px_rgba(212,175,55,0.4)] border-2 border-[#d4af37]/60 bg-slate-900 transition-all duration-300`}
                onError={(e) => {
                    // Jika gambar gagal dimuat, barulah sistem ini (KA) menyala
                    e.target.onerror = null; 
                    e.target.src = "https://ui-avatars.com/api/?name=KreaNova+AI&background=020617&color=d4af37&rounded=true&bold=true&border=1";
                }}
            />
        );

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { 
                this.setState({ errorMsg: error.toString() });
                console.error("React Error Caught:", error); 
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
                            <i className="fas fa-tools text-orange-500 text-5xl mb-4"></i>
                            <h1 className="text-white text-xl font-bold mb-2">Pembaruan Sistem Berlangsung</h1>
                            <p className="text-slate-400 text-xs mb-6 max-w-xs">{this.state.errorMsg}</p>
                            <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Muat Ulang Layar</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const LoginPage = ({ onLogin, onNavigateRegister }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault(); setIsLoading(true); setErrorMsg('');
                
                let retries = 0;
                while (!window.KreaNovaBackend && retries < 20) {
                    await new Promise(r => setTimeout(r, 500));
                    retries++;
                }

                if (!window.KreaNovaBackend) {
                    setErrorMsg("Gagal memuat sistem. Pastikan internet stabil."); 
                    setIsLoading(false); return;
                }

                try {
                    const { auth, db, signInWithEmailAndPassword, doc, getDoc } = window.KreaNovaBackend;
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const userUid = userCredential.user.uid;
                    
                    // Delay sejenak agar Firebase selesai sinkronisasi
                    await new Promise(r => setTimeout(r, 1500));
                    
                    const userDocRef = doc(db, "users", userUid);
                    const userDoc = await getDoc(userDocRef);
                    
                    if (userDoc.exists()) {
                        onLogin(userDoc.data());
                    } else {
                        throw new Error("Gagal membaca data dari server. Silakan coba lagi.");
                    }
                } catch (error) {
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        setErrorMsg("Email atau Kata Sandi salah.");
                    } else {
                        setErrorMsg(error.message.replace("Firebase: ", ""));
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 z-0"></div>
                    
                    <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 overflow-hidden">
                        <div className="flex justify-center mb-4"><KreaNovaLogo className="w-32 h-32" /></div>
                        <h2 className="text-2xl font-bold text-center text-white mb-1">KreaNova AI</h2>
                        <p className="text-center text-slate-400 text-xs mb-8 uppercase tracking-widest">Portal Member</p>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in"><i className="fas fa-exclamation-circle mr-1"></i> {errorMsg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="relative">
                                <i className="fas fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
                                <input type="email" placeholder="Alamat Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950/50 border border-slate-800 text-white rounded-xl pl-12 pr-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition-all" required />
                            </div>
                            <div className="relative">
                                <i className="fas fa-lock absolute left-4 top-3.5 text-slate-500"></i>
                                <input type="password" placeholder="Kata Sandi" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950/50 border border-slate-800 text-white rounded-xl pl-12 pr-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition-all" required />
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/30 mt-4 disabled:opacity-50 transition-all flex justify-center items-center">
                                {isLoading ? <i className="fas fa-circle-notch fa-spin text-xl"></i> : "Masuk ke Dashboard"}
                            </button>
                        </form>
                        
                        <div className="mt-8 text-center pt-6 relative">
                            <div className="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-slate-700 to-transparent"></div>
                            <p className="text-slate-400 text-sm">Belum punya akun?</p>
                            <button onClick={() => onNavigateRegister(null)} className="text-blue-400 font-bold mt-2 hover:text-blue-300">Klik di sini untuk mendaftar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const RegisterPage = ({ onRegister, onNavigateLogin }) => {
            const [sponsor, setSponsor] = useState('');
            const [isLocked, setIsLocked] = useState(false);
            const [position, setPosition] = useState('KIRI');
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [phone, setPhone] = useState('');
            const [password, setPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const refCode = urlParams.get('ref');
                if (refCode) { setSponsor(refCode.toUpperCase()); setIsLocked(true); }
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault(); setIsLoading(true); setErrorMsg('');
                
                let retries = 0;
                while (!window.KreaNovaBackend && retries < 20) {
                    await new Promise(r => setTimeout(r, 500)); retries++;
                }
                if (!window.KreaNovaBackend) {
                    setErrorMsg("Gagal memuat sistem."); setIsLoading(false); return;
                }
                if (sponsor.trim() === '') {
                    setErrorMsg("Kode Sponsor wajib diisi."); setIsLoading(false); return;
                }

                try {
                    const { auth, db, createUserWithEmailAndPassword, doc, setDoc, collection, query, where, getDocs, serverTimestamp } = window.KreaNovaBackend;
                    
                    const upperSponsor = sponsor.toUpperCase();
                    if (upperSponsor !== 'KREANOVA') {
                        const q = query(collection(db, "users"), where("referralCode", "==", upperSponsor));
                        const qs = await getDocs(q);
                        if (qs.empty) { throw new Error("Kode Sponsor tidak ditemukan di sistem."); }
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const userUid = userCredential.user.uid;

                    const myRefCode = "KN" + Math.random().toString(36).substring(2, 6).toUpperCase();
                    const uniqueCode = Math.floor(100 + Math.random() * 900);
                    const billAmount = 150000 + uniqueCode;

                    const newUser = {
                        userId: userUid,
                        name: name,
                        email: email,
                        phone: phone,
                        sponsor: upperSponsor,
                        position: position,
                        referralCode: myRefCode,
                        status: 'PENDING',
                        billAmount: billAmount,
                        walletAvailable: 0,
                        walletTotal: 0,
                        createdAt: serverTimestamp()
                    };

                    await setDoc(doc(db, "users", userUid), newUser);
                    onRegister(newUser);
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') { setErrorMsg("Email sudah terdaftar!"); }
                    else if (error.code === 'auth/weak-password') { setErrorMsg("Kata sandi minimal 6 karakter."); }
                    else { setErrorMsg(error.message.replace("Firebase: ", "")); }
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center p-4 py-8 overflow-y-auto relative">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 z-0"></div>
                    <div className="w-full max-w-md bg-slate-900/90 backdrop-blur-sm border border-slate-800 rounded-3xl p-6 shadow-2xl relative z-10">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-bold text-white">Buat Akun Baru</h2>
                            <p className="text-xs text-slate-400 mt-1">Lengkapi data untuk bergabung dengan KreaNova AI</p>
                        </div>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4 text-center animate-fade-in">{errorMsg}</div>}
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
                                <label className="text-[10px] text-slate-400 font-bold uppercase block mb-2">Sponsor Anda</label>
                                <div className="relative mb-3">
                                    <i className="fas fa-users absolute left-3 top-3.5 text-slate-500"></i>
                                    {isLocked ? (
                                        <div className="w-full bg-blue-900/20 border border-blue-500/50 text-blue-400 rounded-xl pl-10 pr-10 py-3 text-sm font-mono font-bold flex items-center justify-between">{sponsor}<i className="fas fa-lock text-emerald-500"></i></div>
                                    ) : (
                                        <input type="text" placeholder="Ketik KREANOVA jika tidak ada" value={sponsor} onChange={(e) => setSponsor(e.target.value.toUpperCase())} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-3 text-sm focus:border-blue-500 focus:outline-none uppercase font-mono" required />
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => setPosition('KIRI')} className={`py-2.5 text-xs font-bold rounded-xl border ${position === 'KIRI' ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>KIRI</button>
                                    <button type="button" onClick={() => setPosition('KANAN')} className={`py-2.5 text-xs font-bold rounded-xl border ${position === 'KANAN' ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>KANAN</button>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <input type="text" placeholder="Nama Lengkap" value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm" required />
                                <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm" required />
                                <input type="tel" placeholder="Nomor WhatsApp" value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm" required />
                                <input type="password" placeholder="Kata Sandi Baru" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-sm" required minLength="6" />
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-6">
                                {isLoading ? "Memproses..." : "Daftar Sekarang"}
                            </button>
                        </form>
                        <div className="mt-6 text-center border-t border-slate-800 pt-5">
                            <button onClick={onNavigateLogin} className="text-slate-400 text-sm">Sudah punya akun? <span className="text-blue-400 font-bold">Masuk</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user }) => {
            const [copied, setCopied] = useState(false);
            const fullLink = `https://${window.location.hostname}?ref=${user?.referralCode}`;
            const handleCopy = () => {
                if (navigator.clipboard) navigator.clipboard.writeText(fullLink).then(() => showCopied());
            };
            const showCopied = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
            
            return (
                <div className="animate-fade-in relative pb-10">
                    <div className="bg-gradient-to-r from-slate-900 to-indigo-950 rounded-2xl p-6 mb-6 shadow-xl border border-slate-700/50 relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-20"><KreaNovaLogo className="w-24 h-24 grayscale" /></div>
                        <div className="relative z-10 flex items-center justify-between">
                            <div>
                                <p className="text-blue-300 text-xs mb-1 font-medium">Selamat datang kembali,</p>
                                <h2 className="text-xl font-bold text-white capitalize">{user?.name}</h2>
                                <div className="inline-block mt-2 bg-black/40 px-3 py-1 rounded-full border border-white/10 text-xs font-mono text-emerald-400 font-bold">
                                    ID: {user?.referralCode}
                                </div>
                            </div>
                            <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20"><i className="fas fa-user text-white"></i></div>
                        </div>
                    </div>
                    <div className="bg-slate-900 rounded-2xl p-6 mb-6 border border-slate-800 shadow-lg">
                        <h3 className="text-slate-400 text-sm font-medium uppercase">Saldo Tersedia</h3>
                        <p className="text-3xl font-extrabold text-white tracking-tight mt-2">{formatIDR(user?.walletAvailable)}</p>
                    </div>
                    <div className="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-lg">
                        <h3 className="text-sm font-bold text-white mb-2"><i className="fas fa-link text-blue-500 mr-2"></i>Link Referral Anda</h3>
                        <div className="bg-slate-950 rounded-xl p-3 mb-4 border border-slate-800 break-all text-xs text-blue-400 font-mono text-center">
                            {fullLink}
                        </div>
                        <button onClick={handleCopy} className={`w-full py-3 rounded-xl text-xs font-bold transition-all shadow-md ${copied ? 'bg-emerald-600 text-white' : 'bg-slate-800 border border-slate-700 text-white hover:bg-slate-700'}`}>
                            {copied ? "Tersalin!" : "Salin Link"}
                        </button>
                    </div>
                </div>
            );
        };

        const AiStudio = () => {
            const [products, setProducts] = useState([{ id: 'tutorial', name: "Tutorial Produk AI", url: "#", icon: "fa-youtube", active: true, isTutorial: true }]);
            useEffect(() => {
                const saved = localStorage.getItem('kreanova_ai_products');
                if (saved) setProducts(JSON.parse(saved));
            }, []);

            return (
                <div className="animate-fade-in relative pb-10">
                    <h2 className="text-2xl font-bold text-white mb-6">AI Video Studio</h2>
                    <div className="grid grid-cols-2 gap-4">
                        {products.map(product => {
                            if (!product.active) return null;
                            const isTut = product.isTutorial || product.id === 'tutorial';
                            return (
                                <a key={product.id} href={product.url} target="_blank" rel="noopener noreferrer" 
                                   className={`block rounded-2xl p-4 border shadow-lg transition-all ${isTut ? 'col-span-2 bg-gradient-to-r from-red-900/40 to-slate-900 border-red-500/30' : 'bg-slate-900 border-slate-800 flex flex-col items-center justify-center text-center aspect-square'}`}>
                                    {isTut ? (
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center text-red-500"><i className={`fab ${product.icon} text-2xl`}></i></div>
                                            <div><h3 className="text-white font-bold text-sm">{product.name}</h3></div>
                                        </div>
                                    ) : (
                                        <><div className="w-14 h-14 rounded-full bg-slate-800 border border-blue-500/20 flex items-center justify-center mb-3 text-blue-400"><i className={`fas ${product.icon} text-2xl`}></i></div><h3 className="text-slate-200 font-bold text-xs">{product.name}</h3></>
                                    )}
                                </a>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const BinaryTree = ({ user }) => (
            <div className="animate-fade-in relative pb-10 flex flex-col items-center">
                <h2 className="text-2xl font-bold text-white mb-8">Pohon Jaringan</h2>
                <div className="flex flex-col items-center relative">
                    <div className="z-10 bg-slate-900 p-2 rounded-2xl border-2 border-[#d4af37]/50 shadow-[0_0_20px_rgba(212,175,55,0.2)] flex flex-col items-center w-32">
                        <KreaNovaLogo className="w-12 h-12 mb-2" />
                        <div className="w-full text-center bg-slate-950 py-1.5 px-1 rounded-xl border border-slate-800">
                            <p className="font-bold text-white text-[10px] truncate w-full px-1">{user?.name}</p>
                            <p className="text-emerald-400 font-mono text-[9px] mt-0.5">{user?.referralCode}</p>
                        </div>
                    </div>
                    <div className="w-px h-6 bg-slate-700"></div>
                    <div className="w-48 h-px bg-slate-700 flex justify-between"><div className="w-px h-6 bg-slate-700"></div><div className="w-px h-6 bg-slate-700"></div></div>
                    <div className="flex justify-between w-64 -mt-px">
                        <div className="flex flex-col items-center">
                            <div className="w-14 h-14 bg-slate-900 border border-slate-700 border-dashed rounded-full flex items-center justify-center text-slate-600 mb-2"><i className="fas fa-plus"></i></div>
                            <div className="bg-slate-900/50 px-3 py-1 rounded-full border border-slate-800"><p className="text-[9px] text-slate-500 font-bold">KIRI</p></div>
                        </div>
                        <div className="flex flex-col items-center">
                            <div className="w-14 h-14 bg-slate-900 border border-slate-700 border-dashed rounded-full flex items-center justify-center text-slate-600 mb-2"><i className="fas fa-plus"></i></div>
                            <div className="bg-slate-900/50 px-3 py-1 rounded-full border border-slate-800"><p className="text-[9px] text-slate-500 font-bold">KANAN</p></div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const MemberApp = ({ user, onLogout }) => {
            const [activeTab, setActiveTab] = useState('home');
            
            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <Dashboard user={user} />;
                    case 'network': return <BinaryTree user={user} />;
                    case 'ai': return <AiStudio />;
                    case 'profile': return (
                        <div className="animate-fade-in pb-10">
                            <div className="flex items-center gap-4 mb-8"><KreaNovaLogo className="w-16 h-16" /><div><h2 className="text-xl font-bold text-white capitalize">{user?.name}</h2><span className="bg-green-500/20 text-green-400 px-2 py-0.5 rounded text-[10px] font-bold">AKUN AKTIF</span></div></div>
                            <div className="bg-slate-900 rounded-2xl p-5 border border-slate-800 space-y-4 mb-8 divide-y divide-slate-800/50">
                                <div className="pt-2 first:pt-0"><p className="text-[10px] text-slate-500 uppercase">Email</p><p className="text-white text-sm">{user?.email}</p></div>
                                <div className="pt-3"><p className="text-[10px] text-slate-500 uppercase">Nomor WA</p><p className="text-white text-sm">{user?.phone}</p></div>
                                <div className="pt-3"><p className="text-[10px] text-slate-500 uppercase">Sponsor</p><p className="text-emerald-400 text-sm font-mono">{user?.sponsor}</p></div>
                            </div>
                            <button onClick={onLogout} className="w-full bg-red-950/40 text-red-400 border border-red-900/50 font-bold py-3.5 rounded-xl text-sm">Keluar Akun</button>
                        </div>
                    );
                    default: return <Dashboard user={user} />;
                }
            };

            return (
                <div className="h-screen w-full bg-slate-950 flex flex-col relative overflow-hidden font-sans">
                    <header className="h-16 bg-slate-900/95 border-b border-slate-800 flex items-center px-4 shrink-0 z-20 backdrop-blur-md">
                        <KreaNovaLogo className="w-8 h-8 mr-3" />
                        <h1 className="font-bold text-sm tracking-wide text-white">KreaNova AI</h1>
                    </header>
                    <main className="flex-1 overflow-y-auto p-4 custom-scrollbar relative z-10">{renderContent()}</main>
                    <nav className="h-16 bg-slate-900/95 border-t border-slate-800 flex justify-around items-center shrink-0 z-20 pb-safe">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center w-16 ${activeTab === 'home' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-home text-xl mb-1"></i><span className="text-[9px]">Beranda</span></button>
                        <button onClick={() => setActiveTab('network')} className={`flex flex-col items-center w-16 ${activeTab === 'network' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-sitemap text-xl mb-1"></i><span className="text-[9px]">Jaringan</span></button>
                        <button onClick={() => setActiveTab('ai')} className={`flex flex-col items-center w-16 ${activeTab === 'ai' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-robot text-xl mb-1"></i><span className="text-[9px]">AI Studio</span></button>
                        <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center w-16 ${activeTab === 'profile' ? 'text-blue-500' : 'text-slate-500'}`}><i className="fas fa-user-circle text-xl mb-1"></i><span className="text-[9px]">Profil</span></button>
                    </nav>
                </div>
            );
        };

        const AppWrapper = () => {
            const [view, setView] = useState('LOGIN'); 
            const [user, setUser] = useState(null);
            const [loadingApp, setLoadingApp] = useState(true);

            useEffect(() => {
                const checkAuth = () => {
                    if (window.KreaNovaBackend && window.KreaNovaBackend.auth) {
                        const unsub = window.KreaNovaBackend.auth.onAuthStateChanged(async (firebaseUser) => {
                            if (firebaseUser) {
                                try {
                                    const userDocRef = window.KreaNovaBackend.doc(window.KreaNovaBackend.db, "users", firebaseUser.uid);
                                    const userDoc = await window.KreaNovaBackend.getDoc(userDocRef);
                                    if(userDoc.exists()) {
                                        setUser(userDoc.data()); setView('APP');
                                    } else { window.KreaNovaBackend.signOut(window.KreaNovaBackend.auth); }
                                } catch (err) { console.error(err); }
                            }
                            setLoadingApp(false);
                        });
                        return unsub;
                    } else { setTimeout(checkAuth, 500); }
                };
                const unsubscribe = checkAuth();
                return () => { if(typeof unsubscribe === 'function') unsubscribe(); };
            }, []);

            const handleLogout = async () => {
                if (window.KreaNovaBackend) {
                    await window.KreaNovaBackend.signOut(window.KreaNovaBackend.auth);
                    setUser(null); setView('LOGIN');
                }
            };

            if (loadingApp) return <div className="min-h-screen bg-slate-950 flex justify-center items-center"><KreaNovaLogo className="w-20 h-20 animate-pulse" /></div>;

            if (view === 'LOGIN') return <ErrorBoundary><LoginPage onLogin={(u) => { setUser(u); setView('APP'); }} onNavigateRegister={() => setView('REGISTER')} /></ErrorBoundary>;
            if (view === 'REGISTER') return <ErrorBoundary><RegisterPage onRegister={(u) => { setUser(u); setView('APP'); }} onNavigateLogin={() => setView('LOGIN')} /></ErrorBoundary>;
            
            if (user && user.status === 'PENDING') {
                return (
                    <ErrorBoundary>
                        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
                            <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 max-w-md w-full shadow-2xl">
                                <i className="fas fa-hourglass-half text-4xl text-orange-500 mb-4 animate-pulse"></i>
                                <h2 className="text-white text-xl font-bold mb-2">Aktivasi Tertunda</h2>
                                <p className="text-slate-400 text-sm mb-6">Silakan transfer nominal unik berikut untuk mengaktifkan akun Anda.</p>
                                <div className="bg-slate-950 rounded-2xl p-5 border border-slate-700 mb-6">
                                    <p className="text-4xl font-extrabold text-white">{formatIDR(user.billAmount)}</p>
                                </div>
                                <div className="text-left bg-blue-900/10 border border-blue-900/30 p-4 rounded-xl mb-6">
                                    <p className="text-sm font-bold text-white font-mono">BCA - 8765432109</p>
                                    <p className="text-[10px] text-slate-500 mt-1 uppercase">A.N KREANOVA INDONESIA</p>
                                </div>
                                <button onClick={handleLogout} className="text-slate-500 text-xs font-medium hover:text-white"><i className="fas fa-sign-out-alt mr-1"></i> Keluar</button>
                            </div>
                        </div>
                    </ErrorBoundary>
                );
            }

            return <ErrorBoundary><MemberApp user={user} onLogout={handleLogout} /></ErrorBoundary>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppWrapper />);
    </script>
</body>
</html>
